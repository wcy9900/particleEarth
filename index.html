<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#02060d">
<title>粒子太阳系</title>
<link rel="preconnect" href="https://registry.npmmirror.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#02060d;overscroll-behavior:none}
body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:1;touch-action:none}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(2,6,13,0) 46%,rgba(0,0,0,.34) 100%),radial-gradient(circle at 50% -12%,rgba(46,155,234,.038),rgba(46,155,234,0) 58%)}
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 62% 44% at 16% 20%,rgba(64,132,220,.042),rgba(64,132,220,0) 70%),radial-gradient(ellipse 54% 40% at 84% 74%,rgba(126,82,190,.088),rgba(126,82,190,0) 72%),radial-gradient(ellipse 72% 42% at 50% 108%,rgba(28,120,170,.038),rgba(28,120,170,0) 74%),radial-gradient(ellipse 46% 30% at 64% 8%,rgba(255,150,80,.078),rgba(255,150,80,0) 72%)}
#input-video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;border:0}
#ui-layer{position:fixed;inset:0;z-index:10;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none;user-select:none;-webkit-user-select:none;color:rgba(220,240,255,.82)}
#top-bar{display:flex;align-items:flex-start;gap:14px}
h1{margin:8px 0 0;flex:0 0 auto;font-size:clamp(18px,4.4vw,24px);font-weight:600;letter-spacing:3px;color:#e6f7ff;background:linear-gradient(92deg,#ffffff,#a8e6ff 42%,#4fb6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(84,196,255,.5))}
#search-panel{position:relative;margin-left:auto;width:min(56vw,360px);pointer-events:auto;z-index:26}
.search-box{display:flex;align-items:center;gap:8px;height:42px;padding:0 11px;border-radius:12px;background:rgba(4,12,24,.8);border:1px solid rgba(90,200,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .18s,box-shadow .18s}
.search-box:focus-within{border-color:rgba(90,200,255,.62);box-shadow:0 0 0 1px rgba(90,200,255,.22),0 10px 28px rgba(0,0,0,.42)}
.search-icon{flex:0 0 auto;font-size:17px;line-height:1;color:#7fd0ff;opacity:.85;transform:rotate(-45deg);display:inline-block}
#search-input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:#eaf8ff;font-family:inherit;font-size:clamp(12px,3vw,14px);letter-spacing:.6px;outline:none}
#search-input::placeholder{color:rgba(150,190,220,.55)}
#search-input::-webkit-search-cancel-button{display:none}
#search-clear{display:none;flex:0 0 auto;width:22px;height:22px;border:0;border-radius:50%;background:rgba(90,200,255,.14);color:#bfe6ff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
#search-clear:hover{background:rgba(90,200,255,.26)}
#search-results{position:absolute;left:0;right:0;top:calc(100% + 7px);max-height:min(52vh,310px);overflow:auto;padding:6px;border-radius:12px;background:rgba(4,12,24,.95);border:1px solid rgba(90,200,255,.2);box-shadow:0 18px 44px rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#search-results[hidden]{display:none}
#search-results button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:38px;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:#cfeaff;font-family:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
#search-results button:hover,#search-results button.active{background:rgba(90,200,255,.13)}
#search-results .rs-name{font-size:13.5px;font-weight:600;letter-spacing:.5px}
#search-results .rs-name em{margin-left:5px;font-style:normal;font-size:11px;font-weight:400;color:rgba(150,195,230,.6)}
#search-results .rs-sub{flex:0 0 auto;font-size:10.5px;color:rgba(160,200,230,.55);letter-spacing:.5px}
.search-empty{padding:14px 8px;text-align:center;font-size:12px;color:rgba(160,200,230,.55)}
.instruction{margin-top:10px;max-width:min(86vw,320px);font-size:clamp(12px,2.8vw,14px);line-height:1.65;background:linear-gradient(180deg,rgba(8,22,38,.72),rgba(4,12,24,.56));padding:10px 13px;border-radius:10px;border:1px solid rgba(90,200,255,.13);border-left:3px solid #2e9bea;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,0,0,.3)}
.status{margin-top:6px;font-size:clamp(12px,2.8vw,14px);font-weight:700;color:#5ac8ff}
#body-info{margin-top:10px;width:min(86vw,320px);padding:10px 13px;border-radius:10px;background:linear-gradient(180deg,rgba(8,22,38,.8),rgba(4,12,24,.64));border:1px solid rgba(90,200,255,.16);border-left:3px solid #4fb6ff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.32)}
#body-info[hidden]{display:none}
#body-info .info-head{display:flex;align-items:baseline;gap:8px}
#body-info .info-head b{font-size:clamp(15px,3.6vw,17px);font-weight:600;letter-spacing:1px;color:#eaf8ff}
#body-info .info-head span{font-size:11px;letter-spacing:1px;color:rgba(150,195,230,.62)}
#body-info .info-meta{margin-top:5px;font-size:clamp(11px,2.6vw,12.5px);line-height:1.6;color:rgba(190,222,245,.72)}
#body-labels{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.body-label{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;margin:0;padding:2px 7px;border:0;border-radius:6px;background:rgba(4,14,26,.36);color:rgba(206,235,255,.84);font-family:inherit;font-size:clamp(10px,2.2vw,12px);letter-spacing:1px;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;pointer-events:auto;cursor:pointer;transition:opacity .18s,background .18s,color .18s;will-change:left,top}
.body-label i{display:block;width:5px;height:5px;border-radius:50%;background:#9fe4ff;box-shadow:0 0 8px 1px rgba(120,215,255,.75)}
.body-label:hover{background:rgba(16,40,64,.78);color:#ffffff}
.body-label.active{color:#ffffff;background:rgba(46,155,234,.3)}
.body-label.active i{background:#ffffff;box-shadow:none}
#star-labels{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.star-label{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(10px,2.2vw,12.5px);letter-spacing:1.5px;color:#c9ecff;opacity:0;will-change:opacity,transform;transform:translate3d(-50%,-50%,0)}
.star-label i{display:block;width:5px;height:5px;border-radius:50%;background:#eaf9ff;box-shadow:0 0 9px 2px rgba(120,215,255,.9)}
.star-label span{padding:1px 7px;border-radius:6px;background:rgba(4,14,26,.4);white-space:nowrap;text-shadow:0 0 10px rgba(80,190,255,.85),0 0 22px rgba(46,155,234,.4)}
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 40%,#07192b,#02060d 72%);color:#cfeaff;text-align:center;font-size:clamp(15px,4vw,20px);transition:opacity .35s ease;overflow:hidden}
#loading.is-hidden{opacity:0;pointer-events:none}
#loading p{margin:0}
#loading small{font-size:clamp(11px,2.6vw,13px);line-height:1.6;opacity:.65}
/* 加载进度：分阶段构建时给出阶段文案与完成度，避免长时间无反馈 */
#loading-bar{position:relative;width:clamp(170px,44vw,268px);height:2px;border-radius:2px;background:rgba(120,190,255,.16);overflow:hidden}
#loading-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:linear-gradient(90deg,rgba(88,190,255,.45),#9fe8ff);box-shadow:0 0 10px rgba(120,215,255,.75);transition:width .25s cubic-bezier(.2,.8,.3,1)}
#loading-stage{margin:0;font-style:normal;font-size:clamp(10px,2.4vw,11.5px);letter-spacing:1.2px;color:rgba(150,200,235,.58);min-height:1.2em}
/* 加载阶段：粒子从屏幕外各自缓动汇聚成星系。全部走合成层动画，
   场景构建阻塞主线程时仍能持续播放，构建完成后随 #loading 一起淡出 */
#loading-galaxy{position:absolute;left:50%;top:42%;width:0;height:0;pointer-events:none;animation:galaxy-spin 64s linear infinite}
#loading-galaxy::before{content:'';position:absolute;left:-40vmin;top:-15vmin;width:80vmin;height:31vmin;border-radius:50%;background:radial-gradient(ellipse at center,rgba(120,196,255,.22),rgba(60,140,235,.09) 45%,rgba(0,0,0,0) 74%);animation:galaxy-breathe 4.4s ease-in-out infinite}
.galaxy-dot{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;background:radial-gradient(circle,#f2fbff 0%,rgba(150,214,255,.85) 38%,rgba(70,160,255,0) 76%);opacity:0;transform:translate3d(var(--x0),var(--y0),0) scale(.35);animation:galaxy-in var(--d) cubic-bezier(.16,.86,.24,1) var(--delay) forwards;will-change:transform,opacity}
.galaxy-dot.is-warm{background:radial-gradient(circle,#fff3d6 0%,rgba(255,196,120,.85) 38%,rgba(255,140,60,0) 76%)}
@keyframes galaxy-in{to{opacity:var(--o);transform:translate3d(var(--x1),var(--y1),0) scale(1)}}
@keyframes galaxy-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes galaxy-breathe{0%,100%{opacity:.55}50%{opacity:1}}
#loading-copy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translateY(13vh);text-shadow:0 0 16px rgba(2,8,16,.85)}
#webcam-preview{display:none;position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:clamp(96px,24vw,160px);height:auto;aspect-ratio:4/3;z-index:10;border:1px solid rgba(90,200,255,.35);border-radius:8px;opacity:.75;transform:scaleX(-1);background:#040a12}
#view-switch{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:5px;padding:5px;border-radius:12px;background:rgba(4,12,24,.62);border:1px solid rgba(90,200,255,.18);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
#view-switch.is-ready{opacity:1;transform:none;pointer-events:auto}
#view-switch button{appearance:none;border:0;background:transparent;color:rgba(207,234,255,.72);font-family:inherit;font-size:clamp(12px,2.6vw,13px);font-weight:600;padding:0 16px;min-height:40px;border-radius:8px;cursor:pointer;transition:background .18s,color .18s;touch-action:manipulation}
#view-switch button:hover{color:#e6f7ff;background:rgba(90,200,255,.1)}
#view-switch button.active{color:#031018;background:linear-gradient(180deg,#7fdcff,#3aa8e6);box-shadow:0 0 14px rgba(90,200,255,.45)}
#view-switch .view-mode-btn{display:none}
#view-switch.is-earth-context .view-mode-btn{display:block}
#earth-panel{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:min(92vw,340px);padding:10px;border-radius:12px;background:linear-gradient(180deg,rgba(8,22,38,.92),rgba(4,12,24,.82));border:1px solid rgba(90,200,255,.24);box-shadow:0 12px 30px rgba(0,0,0,.42),inset 0 0 24px rgba(46,155,234,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .24s ease,transform .24s ease}
#earth-panel.is-open{opacity:1;transform:none;pointer-events:auto}
.earth-panel-head{display:flex;align-items:baseline;gap:8px;padding:0 3px 8px;color:#eaf8ff}
.earth-panel-head b{font-size:13px;letter-spacing:1px;font-weight:600}
.earth-panel-head span{font-size:10.5px;letter-spacing:.8px;color:rgba(150,195,230,.62)}
.earth-panel-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.earth-mode-btn{appearance:none;min-height:38px;padding:0 6px;border:1px solid rgba(90,200,255,.16);border-radius:8px;background:rgba(90,200,255,.06);color:rgba(207,234,255,.78);font-family:inherit;font-size:clamp(11px,2.5vw,12px);font-weight:600;letter-spacing:.5px;cursor:pointer;transition:background .18s,color .18s,border-color .18s,box-shadow .18s;touch-action:manipulation}
.earth-mode-btn:hover{color:#e6f7ff;background:rgba(90,200,255,.14)}
.earth-mode-btn.active{color:#031018;background:linear-gradient(180deg,#7fdcff,#3aa8e6);border-color:transparent;box-shadow:0 0 12px rgba(90,200,255,.4)}
#entry-modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(10,30,50,.55),rgba(2,6,13,.88));opacity:0;pointer-events:none;transition:opacity .3s ease}
#entry-modal.is-open{opacity:1;pointer-events:auto}
#entry-modal[hidden]{display:none}
.modal-panel{position:relative;overflow:hidden;width:min(92vw,440px);padding:clamp(18px,4vw,26px);border-radius:16px;background:linear-gradient(160deg,rgba(10,24,40,.97),rgba(4,10,20,.97));border:1px solid rgba(90,200,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(46,155,234,.06);color:#dcf0ff;text-align:center}
.modal-panel::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,rgba(90,200,255,0),rgba(143,228,255,.85),rgba(90,200,255,0))}
.modal-panel h2{margin:0 0 8px;font-size:clamp(18px,4.4vw,22px);font-weight:600;letter-spacing:1px;color:#e6f7ff}
.modal-panel p{margin:0 0 18px;font-size:clamp(12px,3vw,13.5px);line-height:1.7;color:rgba(200,228,248,.75)}
.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:16px 10px;min-height:116px;border-radius:12px;border:1px solid rgba(90,200,255,.22);background:rgba(8,20,34,.8);color:#dcf0ff;cursor:pointer;font-family:inherit;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;touch-action:manipulation}
.mode-btn:hover,.mode-btn:focus-visible{border-color:rgba(90,200,255,.6);background:rgba(16,40,64,.92);box-shadow:0 0 20px rgba(46,155,234,.25);transform:translateY(-1px);outline:none}
.mode-btn .icon{font-size:26px;line-height:1}
.mode-btn b{font-size:clamp(14px,3.4vw,15px);font-weight:600}
.mode-btn small{font-size:clamp(10px,2.4vw,11.5px);color:rgba(180,215,240,.6);line-height:1.5}
.modal-actions{display:flex;gap:10px;justify-content:center}
.ghost-btn,.primary-btn{min-height:46px;padding:0 18px;border-radius:10px;font-family:inherit;font-size:clamp(13px,3.2vw,14px);font-weight:600;cursor:pointer;touch-action:manipulation;transition:opacity .18s,box-shadow .18s}
.primary-btn{border:0;background:linear-gradient(180deg,#7fdcff,#2f9be0);color:#031018;box-shadow:0 0 18px rgba(90,200,255,.35)}
.ghost-btn{border:1px solid rgba(90,200,255,.28);background:transparent;color:#bcdcf5}
.ghost-btn:hover,.primary-btn:hover{opacity:.88}
.modal-step[hidden]{display:none}
@media (max-width:640px){#top-bar{flex-wrap:wrap;row-gap:8px}h1{font-size:17px;letter-spacing:2px;margin-top:9px}#search-panel{width:100%;margin-left:0;order:2}.instruction{padding:8px 10px;border-radius:6px}#body-info{width:100%}#view-switch button{padding:0 13px}}
@media (pointer:coarse){.instruction{line-height:1.75}}
@media (prefers-reduced-motion:reduce){.galaxy-dot{animation:none;opacity:var(--o);transform:translate3d(var(--x1),var(--y1),0)}#loading-galaxy,#loading-galaxy::before{animation:none}}
</style>
</head>
<body>

<div id="loading"><div id="loading-galaxy" aria-hidden="true"></div><div id="loading-copy"><p>正在构建星系中</p><small>太阳 · 八大行星 · 主要卫星系统</small><div id="loading-bar"><i></i></div><em id="loading-stage">初始化渲染管线</em></div></div>

<div id="ui-layer">
    <div id="top-bar">
        <h1>粒子太阳系</h1>
        <div id="search-panel">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索天体：木星 / 月球 / Titan" aria-label="搜索天体" role="combobox" aria-expanded="false" aria-controls="search-results">
                <button type="button" id="search-clear" aria-label="清除搜索">×</button>
            </div>
            <div id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
        </div>
    </div>
    <div id="body-info" hidden>
        <div class="info-head"><b id="info-name">太阳</b><span id="info-en">Sun</span></div>
        <div class="info-meta" id="info-meta"></div>
    </div>
    <div class="instruction" id="instruction">
        🖱 <b>拖动</b>: 环绕观察<br>
        ⚙️ <b>滚轮 / 双指</b>: 缩放远近<br>
        ⌕ <b>搜索 / 标签</b>: 聚焦天体
    </div>
    <div id="gesture-status" class="status">正在准备…</div>
</div>

<div id="body-labels" aria-hidden="true"></div>
<div id="star-labels" aria-hidden="true"></div>

<div id="view-switch" role="group" aria-label="视角控制">
    <button type="button" class="view-mode-btn" data-view="earth" aria-pressed="false">星球</button>
    <button type="button" class="view-mode-btn" data-view="stars" aria-pressed="false">星座</button>
    <button type="button" class="view-mode-btn active" data-view="both" aria-pressed="true">两者</button>
    <button type="button" id="overview-btn" class="active" aria-pressed="true">全视视角</button>
</div>

<div id="earth-panel" role="dialog" aria-label="地球展示筛选">
    <div class="earth-panel-head"><b>地球</b><span>展示筛选</span></div>
    <div class="earth-panel-opts" role="radiogroup" aria-label="地球展示内容">
        <button type="button" class="earth-mode-btn" data-view="earth" role="radio" aria-checked="false">仅地球</button>
        <button type="button" class="earth-mode-btn" data-view="stars" role="radio" aria-checked="false">仅星座</button>
        <button type="button" class="earth-mode-btn active" data-view="both" role="radio" aria-checked="true">地球 + 星座</button>
    </div>
</div>

<div id="entry-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-panel">
        <div class="modal-step" id="step-mode">
            <h2 id="modal-title">选择进入方式</h2>
            <p>用鼠标拖拽环绕太阳系，或开启摄像头用手势控制。</p>
            <div class="mode-options">
                <button type="button" class="mode-btn" id="mode-mouse">
                    <span class="icon">🖱</span>
                    <b>鼠标控制</b>
                    <small>拖拽旋转 · 滚轮缩放</small>
                </button>
                <button type="button" class="mode-btn" id="mode-hand">
                    <span class="icon">👋</span>
                    <b>妙手控制</b>
                    <small>摄像头识别手势</small>
                </button>
            </div>
        </div>
        <div class="modal-step" id="step-camera" hidden>
            <h2>授权摄像头</h2>
            <p>妙手控制需要摄像头权限。画面仅在本地识别，不会上传。</p>
            <div class="modal-actions">
                <button type="button" class="ghost-btn" id="camera-back">返回</button>
                <button type="button" class="primary-btn" id="camera-allow">允许并开启</button>
            </div>
        </div>
    </div>
</div>

<video id="input-video" playsinline muted></video>
<canvas id="webcam-preview" width="160" height="120"></canvas>
<canvas id="scene"></canvas>

<!-- MediaPipe 依赖：国内镜像优先，加载失败时自动回退 jsDelivr；defer 不阻塞太阳系首帧 -->
<script>

        var yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;

        out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
        out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
        out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
        out[12] = -(xx * ex + xy * ey + xz * ez);
        out[13] = -(yx * ex + yy * ey + yz * ez);
        out[14] = -(zx * ex + zy * ey + zz * ez);
        out[15] = 1;
        return out;
    }

    function normalMat3(out, m) {
        out[0] = m[0]; out[1] = m[1]; out[2] = m[2];
        out[3] = m[4]; out[4] = m[5]; out[5] = m[6];
        out[6] = m[8]; out[7] = m[9]; out[8] = m[10];
        return out;
    }

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

    function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(s) || 'shader compile failed');
        }
        return s;
    }

    function createProgram(vsSrc, fsSrc) {
        var p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(p) || 'program link failed');
        }
        return p;
    }

    function makeProgram(vsSrc, fsSrc, attrs, unis) {
        var program = createProgram(vsSrc, fsSrc);
        var obj = { program: program, attr: {}, uni: {} };
        for (var i = 0; i < attrs.length; i++) obj.attr[attrs[i]] = gl.getAttribLocation(program, attrs[i]);
        for (var j = 0; j < unis.length; j++) obj.uni[unis[j]] = gl.getUniformLocation(program, unis[j]);

    }

    // ==========================================

    var POINTS_VS = [
        'attribute vec3 aPos;',

        'uniform vec3 uLightDir;',

        'attribute vec3 aPos;',
        'attribute vec3 aColor;',
        'attribute float aSize;',

    function drawLines(geom, o) {

    // 大气球壳：非索引三角形球面（与参考站点一致，避免部分驱动索引缓冲绑定失败）
    function createAtmosGeom(radius, latSeg, lonSeg) {
        var grid = [];
        var lat, lon;
        for (lat = 0; lat <= latSeg; lat++) {
            var theta = lat / latSeg * Math.PI;
            var sinT = Math.sin(theta), cosT = Math.cos(theta);
            for (lon = 0; lon <= lonSeg; lon++) {

                grid.push([sinT * Math.cos(phi), cosT, sinT * Math.sin(phi)]);
            }

        function emit(v) {
            positions.push(v[0] * radius, v[1] * radius, v[2] * radius);
            normals.push(v[0], v[1], v[2]);
        }
        for (var i = 0; i < latSeg; i++) {
            for (var j = 0; j < lonSeg; j++) {
                var a = grid[i * (lonSeg + 1) + j];
                var b = grid[i * (lonSeg + 1) + j + 1];
                var c = grid[(i + 1) * (lonSeg + 1) + j];
                var d = grid[(i + 1) * (lonSeg + 1) + j + 1];
                emit(a); emit(b); emit(c);
                emit(b); emit(d); emit(c);
            }
        }
        function makeBuf(arr) {
            var buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
            return buf;
        }
        return {
            pos: makeBuf(new Float32Array(positions)),
            normal: makeBuf(new Float32Array(normals)),
            count: positions.length / 3
        };
    }

    function drawAtmosphere(geom, o) {

        gl.uniformMatrix4fv(boundaryProg.uni.uView, false, viewMatrix);

    var quadGeom = (function () {

    // ==========================================

    // ==========================================
    // 迸发粒子全部塞进一个 DYNAMIC_DRAW 缓冲，只用一个 drawArrays，

    function initBurst() {
        if (burstGeom || !gl) return;
        function mkBuf(data) {
            var b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
            return b;

            pos: mkBuf(burstPosData),
            col: mkBuf(burstColData),
            size: mkBuf(burstSizeData),
            count: BURST_MAX
        };
    }

    function spawnBurst(body) {
        if (reducedMotion) return;
        initBurst();
        if (!burstGeom) return;
        var R = body.dispR || 1;
        var c1 = body.isSun ? [1.00, 0.72, 0.34] : (body.c1 || body.base || [0.78, 0.82, 0.90]);
        var tint = body.isSun ? [1.00, 0.90, 0.62]
            : (body.isMoon ? (body.tint || c1) : planetMat(body).halo);
        for (var i = 0; i < BURST_MAX; i++) {
            var i3 = i * 3;
            // 球面均匀采样：保证迸发来自整个球面而不是某个扇区
            var u = Math.random() * 2 - 1;
            var th = Math.random() * 6.2831853;
            var sr = Math.sqrt(Math.max(0, 1 - u * u));
            var nx = sr * Math.cos(th), ny = u, nz = sr * Math.sin(th);
            burstPosData[i3] = body.pos[0] + nx * R * 1.02;
            burstPosData[i3 + 1] = body.pos[1] + ny * R * 1.02;
            burstPosData[i3 + 2] = body.pos[2] + nz * R * 1.02;
            var sp = R * (0.50 + Math.random() * 0.85);
            burstVel[i3] = nx * sp;
            burstVel[i3 + 1] = ny * sp;
            burstVel[i3 + 2] = nz * sp;
            burstLife[i] = 0.50 + Math.random() * 0.50;
            var w = 0.25 + Math.random() * 0.75;
            burstColData[i3] = (c1[0] * (1 - w) + tint[0] * w) * 0.92;
            burstColData[i3 + 1] = (c1[1] * (1 - w) + tint[1] * w) * 0.92;
            burstColData[i3 + 2] = (c1[2] * (1 - w) + tint[2] * w) * 0.92;
            burstSizeData[i] = 0.55 + Math.random() * 0.95;
        }
        burstSizeScale = R * 0.020;
        burstActive = true;
        gl.bindBuffer(gl.ARRAY_BUFFER, burstGeom.pos);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, burstPosData);
        gl.bindBuffer(gl.ARRAY_BUFFER, burstGeom.col);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, burstColData);
        gl.bindBuffer(gl.ARRAY_BUFFER, burstGeom.size);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, burstSizeData);
    }

    function updateBurst(dt) {
        if (!burstActive || !burstGeom) return;
        var alive = false;
        var drag = Math.exp(-dt * 1.9);
        var fade = Math.exp(-dt * 2.8);
        for (var i = 0; i < BURST_MAX; i++) {
            if (burstLife[i] <= 0) continue;
            burstLife[i] -= dt;
            var i3 = i * 3;
            if (burstLife[i] <= 0) {
                burstLife[i] = 0;
                burstColData[i3] = 0;
                burstColData[i3 + 1] = 0;
                burstColData[i3 + 2] = 0;
                continue;
            }
            alive = true;
            burstVel[i3] *= drag;
            burstVel[i3 + 1] *= drag;
            burstVel[i3 + 2] *= drag;
            burstPosData[i3] += burstVel[i3] * dt;
            burstPosData[i3 + 1] += burstVel[i3 + 1] * dt;
            burstPosData[i3 + 2] += burstVel[i3 + 2] * dt;
            burstColData[i3] *= fade;
            burstColData[i3 + 1] *= fade;
            burstColData[i3 + 2] *= fade;
        }
        if (!alive) {
            burstActive = false;
            return;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, burstGeom.pos);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, burstPosData);
        gl.bindBuffer(gl.ARRAY_BUFFER, burstGeom.col);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, burstColData);
    }

    function drawBurst() {
        if (!burstActive || !burstGeom) return;
        drawPoints(burstGeom, {
            sizeScale: burstSizeScale, maxSize: 9, opacity: 1,
            shade: false, cull: false, edgeFade: -1, amb: 1

    var audioCtx = null;
    function ensureAudio() {
        if (audioCtx || reducedMotion) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
    }

    // 合成短促下滑音：低频正弦打底 + 两层三角泛音，经低通滚降，
    // 音量压在 0.06 以内，只做「触到实体」的确认感，不喧宾夺主
    function playSelectTone(deep) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            try { audioCtx.resume(); } catch (e) { /* 忽略 */ }
        }
        var t0 = audioCtx.currentTime;
        var master = audioCtx.createGain();
        var filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.Q.value = 0.7;
        var base = deep ? 128 : 208;
        master.gain.setValueAtTime(0.0001, t0);
        master.gain.exponentialRampToValueAtTime(deep ? 0.070 : 0.052, t0 + 0.014);
        master.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.50);
        filt.frequency.setValueAtTime(deep ? 1100 : 1900, t0);
        filt.frequency.exponentialRampToValueAtTime(deep ? 240 : 400, t0 + 0.46);
        master.connect(filt);
        filt.connect(audioCtx.destination);
        var ratios = [1, 1.5, 2.004];
        for (var i = 0; i < ratios.length; i++) {
            var osc = audioCtx.createOscillator();
            osc.type = i === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(base * ratios[i] * 1.85, t0);
            osc.frequency.exponentialRampToValueAtTime(base * ratios[i], t0 + 0.30);
            var g = audioCtx.createGain();
            g.gain.value = i === 0 ? 1 : 0.26 / i;
            osc.connect(g);
            g.connect(master);
            osc.start(t0);
            osc.stop(t0 + 0.55);

    // 选中/点击的完整反馈链：缩放脉冲 + 冲击波环 + 粒子迸发 + 相机震动 + 音效 + 触感
    function triggerSelectFx(body) {
        if (!body) return;
        ensureAudio();
        fxPulse = 1;
        fxPulseBody = body;
        fxShock = 1;
        fxShockBody = body;
        spawnBurst(body);
        if (!reducedMotion) {
            // 震动幅度按相机距离缩放，落到屏幕上幅度一致
            shakeAmp = Math.max(shakeAmp, cameraState.radius * 0.0030);
            try {
                if (navigator.vibrate) navigator.vibrate(body.isSun ? [0, 18, 30, 12] : 14);
            } catch (e) { /* 忽略 */ }
        }
        playSelectTone(!!body.isSun || (body.dispR || 0) > 8);
    }

    // 屏幕空间拾取：把天体中心与其「右移一个半径」的位置分别投影，
    // 两点距离即为屏幕像素半径，命中判定对任意视角、任意距离都成立
    var pickVec = new Float32Array(3);
    function bodyScreenHit(b) {
        var pt = projectPoint(b.pos[0], b.pos[1], b.pos[2]);
        if (!pt) return null;
        var R = b.dispR || 1;
        pickVec[0] = b.pos[0] + camRight[0] * R;
        pickVec[1] = b.pos[1] + camRight[1] * R;
        pickVec[2] = b.pos[2] + camRight[2] * R;
        var pt2 = projectPoint(pickVec[0], pickVec[1], pickVec[2]);
        var rpx = pt2 ? Math.hypot(pt2.x - pt.x, pt2.y - pt.y) : 0;
        return { x: pt.x, y: pt.y, r: rpx };
    }

    function pickBody(mx, my) {
        var best = null, bestD = 1e9;
        for (var i = 0; i < BODY_LIST.length; i++) {
            var b = BODY_LIST[i];
            var s = bodyScreenHit(b);
            if (!s) continue;
            var d = Math.hypot(mx - s.x, my - s.y);
            if (d <= Math.max(s.r * 1.12, 22) && d < bestD) {
                bestD = d;
                best = b;
            }
        }
        return best;
    }

    function setHoverBody(b) {
        if (b === fxHoverBody) return;
        fxHoverBody = b;
        fxHoverAmt = 0;
        canvas.style.cursor = b ? 'pointer' : '';
    }

    function updateInteraction(dt) {
        if (fxPulse > 0) {
            fxPulse -= dt * 2.3;
            if (fxPulse <= 0) { fxPulse = 0; fxPulseBody = null; }
        }
        if (fxShock > 0) {
            fxShock -= dt * 1.30;
            if (fxShock <= 0) { fxShock = 0; fxShockBody = null; }
        }
        var want = (fxHoverBody && planetFade > 0.5) ? 1 : 0;
        if (!want) fxHoverBody = null;
        fxHoverAmt += (want - fxHoverAmt) * (1 - Math.exp(-dt * 9));
        if (Math.abs(fxHoverAmt - want) < 0.004) fxHoverAmt = want;
        if (shakeAmp > 0.0004) {
            shakeAmp *= Math.exp(-dt * 7.5);
        } else {
            shakeAmp = 0;
        }
        updateBurst(dt);
    }

    // ==========================================
    // 5. 数值噪声（天体表面细节）
    // ==========================================
    function hash3(x, y, z) {
        var s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
        return s - Math.floor(s);
    }

    function noise3(x, y, z) {
        var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        var xf = x - xi, yf = y - yi, zf = z - zi;
        var u = xf * xf * (3 - 2 * xf);
        var v = yf * yf * (3 - 2 * yf);
        var w = zf * zf * (3 - 2 * zf);
        var x00 = hash3(xi, yi, zi) * (1 - u) + hash3(xi + 1, yi, zi) * u;
        var x10 = hash3(xi, yi + 1, zi) * (1 - u) + hash3(xi + 1, yi + 1, zi) * u;
        var x01 = hash3(xi, yi, zi + 1) * (1 - u) + hash3(xi + 1, yi, zi + 1) * u;
        var x11 = hash3(xi, yi + 1, zi + 1) * (1 - u) + hash3(xi + 1, yi + 1, zi + 1) * u;
        var y0 = x00 * (1 - v) + x10 * v;
        var y1 = x01 * (1 - v) + x11 * v;
        return y0 * (1 - w) + y1 * w;
    }

    function fbm(x, y, z, oct) {
        var sum = 0, amp = 0.5, f = 1;
        for (var i = 0; i < oct; i++) {
            sum += amp * noise3(x * f, y * f, z * f);
            f *= 2.03;
            amp *= 0.5;
        }
        return sum;
    }

    function mix3(a, b, t) {
        t = clamp(t, 0, 1);
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    }

    function applyScale() {

        SUN.light = new Float32Array([0, 0, 0]);
        var prevR = 0, prevOrbit = 0;
        for (var i = 0; i < PLANETS.length; i++) {
            var p = PLANETS[i];
            p.dispR = 3.2 * Math.pow(p.radiusEarth, CONFIG.radiusPower) * CONFIG.bodyScale;
            p.moons = [];
            // 统一放大后，相邻轨道至少留出两球半径 + 净空，避免公转相遇时穿插
            var orbit = CONFIG.orbitBase + CONFIG.orbitScale * Math.pow(p.au, CONFIG.orbitPower);
            if (i > 0) orbit = Math.max(orbit, prevOrbit + prevR + p.dispR + CONFIG.orbitGap);
            p.orbitR = orbit;
            prevR = p.dispR;
            prevOrbit = orbit;
            p.speed = CONFIG.angularBase * Math.pow(1 / p.periodYears, CONFIG.periodPower);
            p.light = new Float32Array(3);
            p.pos = new Float32Array(3);
            p.model = mat4();
            p.normal = new Float32Array(9);
            p.angle = p.angle0;
            p.spinAngle = 0;
        }
    }

            var m = list[i];
            m.parent = p;
            m.isMoon = true;
            m.type = '卫星';
            m.dispR = (0.26 + 0.9 * m.radiusEarth) * CONFIG.bodyScale;
            m.orbitR = m.orbitFactor * p.dispR;
            m.angle = m.angle0 || 0;
            m.pos = new Float32Array(3);
            m.light = new Float32Array(3);
            p.moons.push(m);
        }
    }

                for (var r = 0; r < nRings; r++) {

                    var rb = [180, 90, -180, -90];
                    for (var k = 0; k < nPts; k++) {

                        ring[k * 2] = lon;
                        ring[k * 2 + 1] = lat;
                        if (lon < rb[0]) rb[0] = lon;
                        if (lat < rb[1]) rb[1] = lat;
                        if (lon > rb[2]) rb[2] = lon;
                        if (lat > rb[3]) rb[3] = lat;
                    }
                    rings.push({ pts: ring, bbox: rb });
                    if (rb[0] < bbox[0]) bbox[0] = rb[0];
                    if (rb[1] < bbox[1]) bbox[1] = rb[1];
                    if (rb[2] > bbox[2]) bbox[2] = rb[2];
                    if (rb[3] > bbox[3]) bbox[3] = rb[3];

        var denseCount = Math.round(count * 0.62);
        var wispyCount = count - denseCount;

        function makeLayer(n, opts) {
            var pos = new Float32Array(n * 3);
            var col = new Float32Array(n * 3);
            var siz = new Float32Array(n);
            var centers = [];
            for (var c = 0; c < opts.clusters; c++) {
                // 云团集中在中低纬带，两极留白，看起来更像真实的大气环流
                var cy = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                cy = clamp(cy, -opts.latLimit, opts.latLimit);
                var rr = Math.sqrt(Math.max(0, 1 - cy * cy));
                var cth = Math.random() * Math.PI * 2;
                centers.push([Math.cos(cth) * rr, cy, Math.sin(cth) * rr]);
            }

            for (var i = 0; i < n; i++) {
                var ct = centers[(Math.random() * centers.length) | 0];
                // 三次均匀随机求和近似高斯分布：云团中心密、边缘稀
                var gx = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                var gy = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                var gz = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                // 沿纬向拉长、竖向压扁：形成自然云带而不是圆团
                var px = ct[0] + gx * opts.spread * opts.stretch;
                var py = ct[1] + gy * opts.spread * opts.flatten;
                var pz = ct[2] + gz * opts.spread * opts.stretch;
                var len = Math.hypot(px, py, pz) || 1;
                var r = radius * opts.radiusK * (0.998 + Math.random() * 0.012);
                pos[i * 3] = (px / len) * r;
                pos[i * 3 + 1] = (py / len) * r;
                pos[i * 3 + 2] = (pz / len) * r;

                var core = 1 - Math.min(1, Math.hypot(gx * opts.stretch, gy * opts.flatten, gz * opts.stretch) * 0.95);
                // 云团内部提亮、边缘压暗：让云块从中心自然虚化到周围，避免硬边
                var tint = opts.tint + core * opts.coreGain + Math.random() * 0.04;
                col[i * 3] = Math.min(1, tint * 0.90);
                col[i * 3 + 1] = Math.min(1, tint * 0.97);
                col[i * 3 + 2] = Math.min(1, tint * 1.06);
                siz[i] = opts.sizeBase + Math.random() * opts.sizeRand + core * opts.sizeCore;
            }
            return createGeom(pos, col, siz);
        }

        return {
            // 低层：云团紧凑、颗粒厚实、亮度高，是地球表面主要的一层云
            dense: makeLayer(denseCount, {
                clusters: 34, latLimit: 0.90, spread: 0.21, stretch: 1.10, flatten: 0.55,
                radiusK: 1.020, tint: 0.55, coreGain: 0.34,
                sizeBase: 0.60, sizeRand: 0.40, sizeCore: 1.62
            }),
            // 高层：云带更修长轻薄、颗粒更小更淡，叠在厚云之上形成通透的卷云层
            wispy: makeLayer(wispyCount, {
                clusters: 22, latLimit: 0.82, spread: 0.30, stretch: 1.55, flatten: 0.34,
                radiusK: 1.046, tint: 0.50, coreGain: 0.30,
                sizeBase: 0.42, sizeRand: 0.44, sizeCore: 1.15
            })
        };
    }

    // 大洲边界粒子层：沿岸线等距加密，固定屏幕像素粗细
    var BOUNDARY_STEP = 0.16;   // 加密步长（度）
    var BOUNDARY_MAX = 60000;   // 点数上限（防御性）
    var BOUNDARY_COAST = [156, 232, 255];   // 海岸线基础色，与各大洲线色轻微混合

    function buildEarthBoundaryGeom(geo, radius) {
        if (!geo || !geo.coast) return null;
        var positions = [], colors = [], sizes = [];
        var R = radius * 1.006;

        function pushPoint(lon, lat, ci) {
            if (positions.length / 3 >= BOUNDARY_MAX) return;
            var lam = lon * Math.PI / 180;
            var phi = lat * Math.PI / 180;
            var cp = Math.cos(phi);
            positions.push(cp * Math.cos(lam) * R, Math.sin(phi) * R, cp * Math.sin(lam) * R);

            var tint = (ci >= 0 && ci < CONTINENT_LINE.length) ? CONTINENT_LINE[ci] : BOUNDARY_COAST;
            var mixTo = 0.38;
            var r = BOUNDARY_COAST[0] + (tint[0] - BOUNDARY_COAST[0]) * mixTo;
            var g = BOUNDARY_COAST[1] + (tint[1] - BOUNDARY_COAST[1]) * mixTo;
            var b = BOUNDARY_COAST[2] + (tint[2] - BOUNDARY_COAST[2]) * mixTo;
            // 轻微亮度抖动，避免整条线死板；同时保留固定屏幕尺寸
            var lum = 0.94 + Math.random() * 0.12;
            colors.push(Math.min(1, r / 255 * lum), Math.min(1, g / 255 * lum), Math.min(1, b / 255 * lum));
            sizes.push(0.94 + Math.random() * 0.2);
        }

        for (var k = 0; k < geo.coast.length; k++) {
            var ring = geo.coast[k];
            var pts = ring.pts;
            var np = pts.length / 2;
            for (var i = 0; i < np - 1; i++) {
                var x1 = pts[i * 2], y1 = pts[i * 2 + 1];
                var x2 = pts[i * 2 + 2], y2 = pts[i * 2 + 3];
                // 跳过跨 180° 经线的假线段，以及沿地图边界的闭合边
                if (Math.abs(x2 - x1) > 180) continue;
                if (Math.abs(x1) > 179.5 && Math.abs(x2) > 179.5) continue;
                if (Math.abs(y1) > 89.5 && Math.abs(y2) > 89.5) continue;

                var midLat = (y1 + y2) * 0.5 * Math.PI / 180;
                var dx = (x2 - x1) * Math.cos(midLat);
                var dy = y2 - y1;
                var segLen = Math.sqrt(dx * dx + dy * dy);
                if (segLen < 1e-6) continue;
                var steps = Math.max(1, Math.ceil(segLen / BOUNDARY_STEP));
                for (var s = 0; s < steps; s++) {
                    var t = s / steps;
                    pushPoint(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, ring.ci);
                }
            }
        }

        if (!sizes.length) return null;
        return createGeom(
            new Float32Array(positions),
            new Float32Array(colors),
            new Float32Array(sizes)
        );
    }

    // 全局调色：统一提高饱和度与对比度，让所有天体的色彩风格一致
    // （已内联进各点云构建循环，避免逐点返回新数组造成 GC 抖动）

    // 球面点云：可切片构建。step(deadline, report) 在单帧预算内推进一批点，
    // 返回 true 表示构建完成并写入 job.geom；逐点复用同一方向数组，零临时对象
    var SPHERE_CHUNK = 256;
    function makeSphereJob(count, radius, colorFn, sizeBoost) {
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        var ga = Math.PI * (3 - Math.sqrt(5));
        // 抖动幅度约等于点间距：打散斐波那契螺旋的规则网格，近景不出现点阵
        var jitter = 0.95 * Math.sqrt(4 * Math.PI / Math.max(1, count));
        var dir = [0, 0, 0];
        var i = 0;
        var job = { count: count, geom: null, step: null };
        job.step = function (deadline, report) {
            while (i < count) {
                var begin = i;
                var stop = Math.min(count, i + SPHERE_CHUNK);
                for (; i < stop; i++) {
                    var y = 1 - (i / Math.max(1, count - 1)) * 2;
                    var r = Math.sqrt(Math.max(0, 1 - y * y));
                    var th = ga * i;
                    var dx = Math.cos(th) * r, dz = Math.sin(th) * r;
                    var jx = (hash3(i * 1.37, 4.11, 8.23) - 0.5) * jitter;
                    var jy = (hash3(i * 3.71, 6.53, 2.17) - 0.5) * jitter;
                    var jz = (hash3(i * 5.93, 1.29, 7.61) - 0.5) * jitter;
                    var vx = dx + jx, vy = y + jy, vz = dz + jz;
                    var nl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
                    dx = vx / nl;
                    y = vy / nl;
                    dz = vz / nl;
                    pos[i * 3] = dx * radius;
                    pos[i * 3 + 1] = y * radius;
                    pos[i * 3 + 2] = dz * radius;
                    dir[0] = dx; dir[1] = y; dir[2] = dz;
                    var c = colorFn(dir);
                    var lum = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
                    col[i * 3] = clamp((lum + (c[0] - lum) * 1.16 - 0.5) * 1.08 + 0.5, 0, 1);
                    col[i * 3 + 1] = clamp((lum + (c[1] - lum) * 1.16 - 0.5) * 1.08 + 0.5, 0, 1);
                    col[i * 3 + 2] = clamp((lum + (c[2] - lum) * 1.16 - 0.5) * 1.08 + 0.5, 0, 1);
                    // 每点尺寸略作抖动，避免规则点阵感，近景更接近连续表面
                    siz[i] = (0.86 + 0.34 * hash3(dx * 13.1, y * 17.7, dz * 19.3)) * (sizeBoost || 1);
                }
                report(i - begin);
                if (i < count && performance.now() >= deadline) return false;
            }
            job.geom = createGeom(pos, col, siz);
            return true;
        };
        return job;
    }

    // 太阳表面色阶：深橙红 → 橙 → 橙金 → 金黄 → 明黄 → 近白热核，共 6 级 5 段渐变
    // 比原来的两色插值多出 4 层过渡，配合不同尺度的噪声做出对流色带与米粒组织
    var SUN_RAMP = [
        [0.84, 0.19, 0.03],
        [1.00, 0.36, 0.05],
        [1.00, 0.55, 0.11],
        [1.00, 0.75, 0.26],
        [1.00, 0.90, 0.52],
        [1.00, 0.98, 0.88]
    ];

    function sunRamp(t) {
        t = clamp(t, 0, 1) * (SUN_RAMP.length - 1);
        var i = Math.floor(t);
        if (i >= SUN_RAMP.length - 1) return SUN_RAMP[SUN_RAMP.length - 1];
        return mix3(SUN_RAMP[i], SUN_RAMP[i + 1], t - i);
    }

    function sunColor(d) {
        var n1 = fbm(d[0] * 3.4 + 3.2, d[1] * 3.4 + 1.1, d[2] * 3.4 + 7.7, 3);    // 大尺度对流色带
        var n2 = fbm(d[0] * 9.0 + 5.5, d[1] * 9.0 + 2.6, d[2] * 9.0 + 4.2, 2);    // 中尺度色斑
        var g = fbm(d[0] * 26.0 + 1.9, d[1] * 26.0 + 8.4, d[2] * 26.0 + 6.3, 2);  // 细颗粒米粒组织
        var t = clamp(n1 * 1.45 - 0.18 + (n2 - 0.5) * 0.42 + (g - 0.5) * 0.30, 0, 1);
        var c = sunRamp(t);
        var spot = fbm(d[0] * 12.0 + 8.0, d[1] * 12.0 + 2.0, d[2] * 12.0 + 4.0, 2);
        if (spot < 0.38) c = mix3(c, [0.52, 0.11, 0.02], (0.38 - spot) * 1.5);
        return [clamp(c[0], 0, 1), clamp(c[1], 0, 1), clamp(c[2], 0, 1)];
    }

    function earthColor(d) {
        var n1 = fbm(d[0] * 2.2 + 1.7, d[1] * 2.2 + 4.1, d[2] * 2.2 + 2.3, 4);
        var n2 = fbm(d[0] * 6.5 + 8.2, d[1] * 6.5 + 1.4, d[2] * 6.5 + 5.6, 3);
        var lat = Math.asin(clamp(d[1], -1, 1));
        var c;
        if (n1 < 0.56) {
            // 海洋：近岸浅蓝、深海深蓝，海岸线由噪声自然过渡
            var depth = clamp((0.56 - n1) / 0.56, 0, 1);
            c = mix3([0.05, 0.26, 0.50], [0.012, 0.07, 0.20], depth);
            c = mix3(c, [0.10, 0.44, 0.62], smoothstep(0.26, 0.0, depth) * 0.4);
        } else {
            // 陆地：森林绿、草原黄绿、沙漠棕与山脉灰，细节由多尺度噪声叠加
            var g = clamp((n1 - 0.56) / 0.26, 0, 1);
            c = mix3([0.11, 0.34, 0.14], [0.32, 0.46, 0.19], n2);
            c = mix3(c, [0.50, 0.42, 0.24], g * 0.5);
            c = mix3(c, [0.66, 0.60, 0.46], clamp((n2 - 0.60) * 2.4, 0, 0.65));
            var desert = smoothstep(0.60, 0.90, Math.cos(lat * 2.0)) * smoothstep(0.38, 0.72, n2);
            c = mix3(c, [0.74, 0.60, 0.34], desert * 0.5);
        }
        var ice = smoothstep(0.80, 0.95, Math.abs(d[1]));
        c = mix3(c, [0.92, 0.96, 1.0], ice * 0.92);
        return c;
    }

    function makePlanetColor(p) {
        var spotDir = null, spotEast = null, spotNorth = null;
        if (p.spotLat !== undefined) {
            var cl = Math.cos(p.spotLat), sl = Math.sin(p.spotLat);
            var co = Math.cos(p.spotLon), so = Math.sin(p.spotLon);
            // 以红斑中心建立东/北切向基，用于绘制真实比例的椭圆风暴，而不是整块圆形色斑
            spotDir = [cl * co, sl, cl * so];
            spotEast = [-so, 0, co];
            spotNorth = [-co * sl, cl, -so * sl];
        }
        var olyDir = null;
        if (p.id === 'mars') {
            olyDir = [Math.cos(0.32) * Math.cos(-2.4), Math.sin(0.32), Math.cos(0.32) * Math.sin(-2.4)];
        }
        return function (d) {
            var lat = Math.asin(clamp(d[1], -1, 1));
            // 主纹理 4 层、细节 3 层、微纹理 2 层：近景仍能看出细碎的表面层次
            var n = fbm(d[0] * p.nf + 3.1, d[1] * p.nf + 5.7, d[2] * p.nf + 8.3, 4);
            var fine = fbm(d[0] * 34.0 + 1.3, d[1] * 34.0 + 7.9, d[2] * 34.0 + 4.1, 3);
            var micro = fbm(d[0] * 68.0 + 2.7, d[1] * 68.0 + 9.3, d[2] * 68.0 + 6.1, 2);
            var band, c;
            if (p.id === 'mercury') {
                // 水星：灰岩质陨坑地貌，暗色平原 + 明亮辐射纹
                var crater = fbm(d[0] * 15.0 + 2.0, d[1] * 15.0 + 7.0, d[2] * 15.0 + 1.0, 3);
                c = mix3([0.30, 0.29, 0.28], [0.68, 0.65, 0.61], clamp(crater * 1.7, 0, 1));
                if (n < 0.43) c = mix3(c, [0.20, 0.17, 0.16], (0.43 - n) * 2.2);
                if (fine > 0.72) c = mix3(c, [0.92, 0.87, 0.78], (fine - 0.72) * 2.4);
                // 想象细节：极区陨坑里的冷蓝霜斑 + 低纬熔岩沟槽的暖褐调 + 玄武岩平原的钢蓝反照
                var mFrost = smoothstep(0.72, 0.96, Math.abs(d[1])) * smoothstep(0.48, 0.80, fine);
                c = mix3(c, [0.55, 0.73, 0.90], mFrost * 0.62);
                if (n < 0.36) c = mix3(c, [0.50, 0.33, 0.24], (0.36 - n) * 1.35);
                var mSteel = fbm(d[0] * 9.5 + 17.0, d[1] * 9.5 + 3.0, d[2] * 9.5 + 23.0, 2);
                if (mSteel > 0.60) c = mix3(c, [0.40, 0.50, 0.62], (mSteel - 0.60) * 0.70);
            } else if (p.id === 'venus') {
                // 金星：硫酸云旋涡，奶油黄到浅赭，极区略暗
                var w = fbm(d[0] * 3.2 + 5.0, d[1] * 3.2 + 2.0, d[2] * 3.2 + 9.0, 3);
                band = 0.5 + 0.5 * Math.sin(lat * 7.0 + w * 6.0);
                c = mix3([0.96, 0.86, 0.60], [0.80, 0.66, 0.38], clamp(band * 0.7 + n * 0.3, 0, 1));
                c = mix3(c, [1.0, 0.97, 0.86], smoothstep(0.65, 0.95, n) * 0.45);
                // 想象细节：高层硫酸云里的青绿与淡紫涡旋，打破单一奶油黄
                var vSwirl = fbm(d[0] * 5.4 + 11.0, d[1] * 5.4 + 4.0, d[2] * 5.4 + 7.0, 2);
                if (vSwirl > 0.60) c = mix3(c, [0.66, 0.88, 0.78], (vSwirl - 0.60) * 0.65);
                if (vSwirl < 0.34) c = mix3(c, [0.90, 0.80, 0.94], (0.34 - vSwirl) * 0.50);
            } else if (p.id === 'mars') {
                // 火星：锈红地表、暗色玄武岩区、极冠与奥林帕斯山
                c = mix3([0.80, 0.40, 0.20], [0.58, 0.27, 0.14], n);
                var dark = fbm(d[0] * 2.6 + 9.0, d[1] * 2.6 + 3.0, d[2] * 2.6 + 7.0, 2);
                if (dark < 0.44) c = mix3(c, [0.38, 0.21, 0.15], (0.44 - dark) * 1.8);
                c = mix3(c, [0.98, 0.68, 0.40], smoothstep(0.62, 0.88, n) * 0.40);
                // 想象细节：赤道尘暴的暖黄薄纱 + 古老河床的青灰沉积
                var mDust = fbm(d[0] * 6.2 + 4.0, d[1] * 6.2 + 12.0, d[2] * 6.2 + 2.0, 2);
                if (Math.abs(d[1]) < 0.42 && mDust > 0.58) c = mix3(c, [0.94, 0.74, 0.44], (mDust - 0.58) * 0.70);
                if (micro > 0.66 && Math.abs(d[1]) < 0.55) c = mix3(c, [0.52, 0.60, 0.58], (micro - 0.66) * 0.85);
                var pol = smoothstep(0.86, 0.95, Math.abs(d[1]));
                c = mix3(c, [0.96, 0.94, 0.91], pol * 0.9);
                if (olyDir) {
                    var od = d[0] * olyDir[0] + d[1] * olyDir[1] + d[2] * olyDir[2];
                    if (od > 0.985) c = mix3(c, [0.95, 0.72, 0.46], smoothstep(0.985, 1.0, od) * 0.8);
                }
            } else if (p.id === 'jupiter') {
                // 木星：高速纬向急流 + 湍流带纹，大红斑与白色椭圆风暴
                var turb = fbm(d[0] * 4.0 + 1.0, d[1] * 13.0 + 2.0, d[2] * 4.0 + 3.0, 3);
                band = 0.5 + 0.5 * Math.sin(lat * 13.0 + turb * 3.2);
                c = mix3([0.92, 0.84, 0.70], [0.60, 0.40, 0.24], clamp(band * 0.75 + n * 0.25, 0, 1));
                c = mix3(c, [0.98, 0.94, 0.85], smoothstep(0.68, 0.92, n) * 0.5);
                if (spotDir) {
                    // 大红斑：位于南纬约 22°，东西向拉长的椭圆，带浅色外晕与暗色环边
                    var du = d[0] * spotEast[0] + d[1] * spotEast[1] + d[2] * spotEast[2];
                    var dv = d[0] * spotNorth[0] + d[1] * spotNorth[1] + d[2] * spotNorth[2];
                    var ex = du / 0.18, ey = dv / 0.09;
                    var e2 = ex * ex + ey * ey;
                    if (e2 < 1.5) {
                        var halo = 1.0 - smoothstep(0.58, 1.42, e2);
                        var core = 1.0 - smoothstep(0.02, 0.82, e2);
                        var ring = smoothstep(0.50, 0.72, e2) * (1.0 - smoothstep(0.72, 0.98, e2));
                        c = mix3(c, [1.0, 0.93, 0.78], halo * 0.95);
                        c = mix3(c, [0.95, 0.30, 0.14], core);
                        c = mix3(c, [0.45, 0.16, 0.08], ring * 0.55);
                        c = mix3(c, [1.0, 0.55, 0.30], smoothstep(0.55, 0.88, n) * core * 0.30);
                    }
                }
                if (fine > 0.80 && Math.abs(lat) < 0.55) c = mix3(c, [1.0, 0.98, 0.93], (fine - 0.80) * 1.4);
                // 想象细节：极区青绿氨斑 + 高纬蓝白涡旋，和橙褐带纹形成冷暖并列
                var jPolar = smoothstep(0.45, 0.95, Math.abs(d[1]));
                if (jPolar > 0.01) c = mix3(c, [0.60, 0.84, 0.80], jPolar * smoothstep(0.46, 0.78, fine) * 0.62);
                if (fine > 0.88) c = mix3(c, [0.80, 0.92, 1.0], (fine - 0.88) * 1.3);
            } else if (p.id === 'saturn') {
                // 土星：柔和的淡金纬向带，极区偏冷
                band = 0.5 + 0.5 * Math.sin(lat * 12.0 + n * 2.4);
                c = mix3([0.96, 0.89, 0.72], [0.78, 0.65, 0.44], clamp(band * 0.7 + n * 0.3, 0, 1));
                c = mix3(c, [0.99, 0.96, 0.86], smoothstep(0.70, 0.95, n) * 0.4);
                c = mix3(c, [0.70, 0.78, 0.80], smoothstep(1.15, 1.5, Math.abs(lat)) * 0.28);
                // 想象细节：北极六边形风暴的冷蓝核心 + 赤道带的暖铜细纹
                var sHex = smoothstep(1.20, 1.44, Math.abs(lat)) * smoothstep(0.42, 0.74, n);
                c = mix3(c, [0.52, 0.74, 0.90], sHex * 0.62);
                var sBelt = Math.sin(lat * 9.0 + fine * 4.0);
                if (Math.abs(lat) < 0.30 && sBelt > 0.55) c = mix3(c, [0.90, 0.72, 0.50], (sBelt - 0.55) * 0.55);
            } else if (p.id === 'uranus') {
                // 天王星：几乎无特征的青蓝大气，极冠略亮
                band = 0.5 + 0.5 * Math.sin(lat * 8.0 + n * 2.0);
                c = mix3([0.58, 0.87, 0.91], [0.46, 0.77, 0.85], clamp(band * 0.5 + n * 0.5, 0, 1));
                c = mix3(c, [0.73, 0.95, 0.96], smoothstep(0.55, 0.92, n) * 0.32);
                c = mix3(c, [0.86, 0.98, 0.99], smoothstep(1.1, 1.5, Math.abs(lat)) * 0.36);
                // 想象细节：低纬淡紫云带 + 中纬玫瑰色薄纱 + 赤道薄荷青雾 + 极区青白
                var uBand = 0.5 + 0.5 * Math.sin(lat * 6.5 + micro * 2.2);
                c = mix3(c, [0.60, 0.34, 1.0], smoothstep(0.52, 0.80, uBand) * 0.80);
                var uRose = fbm(d[0] * 4.0 + 13.0, d[1] * 7.0 + 5.0, d[2] * 4.0 + 11.0, 2);
                c = mix3(c, [1.0, 0.44, 0.70], smoothstep(0.50, 0.74, uRose) * 0.70);
                var uMint = fbm(d[0] * 9.0 + 31.0, d[1] * 5.0 + 9.0, d[2] * 9.0 + 2.0, 2);
                c = mix3(c, [0.40, 1.0, 0.86], smoothstep(0.58, 0.84, uMint) * 0.52);
                if (fine > 0.80) c = mix3(c, [0.90, 0.99, 1.0], (fine - 0.80) * 0.90);
            } else if (p.id === 'neptune') {
                // 海王星：深蓝甲烷大气、大黑斑与高空白色云带
                band = 0.5 + 0.5 * Math.sin(lat * 7.0 + n * 2.6);
                c = mix3([0.22, 0.44, 0.90], [0.09, 0.23, 0.66], clamp(band * 0.65 + n * 0.35, 0, 1));
                c = mix3(c, [0.44, 0.70, 1.0], smoothstep(0.66, 0.92, n) * 0.5);
                if (spotDir) {
                    var nd = d[0] * spotDir[0] + d[1] * spotDir[1] + d[2] * spotDir[2];
                    if (nd > 0.972) c = mix3(c, [0.04, 0.10, 0.30], smoothstep(0.972, 1.0, nd) * 0.9);
                }
                if (fine > 0.76 && Math.abs(lat) < 0.9) c = mix3(c, [0.93, 0.97, 1.0], (fine - 0.76) * 1.8);
                // 想象细节：青绿对流带 + 紫罗兰涡旋 + 洋红风暴斑，与深蓝主色冷暖并列
                var nCurl = fbm(d[0] * 7.5 + 6.0, d[1] * 7.5 + 15.0, d[2] * 7.5 + 3.0, 2);
                c = mix3(c, [0.16, 1.0, 0.80], smoothstep(0.50, 0.76, nCurl) * 0.70);
                if (nCurl < 0.34) c = mix3(c, [0.16, 0.10, 0.56], (0.34 - nCurl) * 0.85);
                var nVort = fbm(d[0] * 6.0 + 21.0, d[1] * 6.0 + 2.0, d[2] * 6.0 + 17.0, 2);
                c = mix3(c, [0.62, 0.24, 1.0], smoothstep(0.54, 0.78, nVort) * 0.80);
                if (nVort < 0.36) c = mix3(c, [0.30, 0.95, 0.86], (0.36 - nVort) * 0.60);
                // 大尺度色带：青绿带与紫罗兰带交替，让整球形成冷暖并列的色带
                var nBeltT = 0.5 + 0.5 * Math.sin(lat * 5.2 + nCurl * 4.0);
                c = mix3(c, [0.18, 0.98, 0.86], smoothstep(0.55, 0.85, nBeltT) * 0.50);
                var nBeltV = 0.5 + 0.5 * Math.sin(lat * 3.6 + 2.1 + nVort * 3.0);
                c = mix3(c, [0.66, 0.28, 1.0], smoothstep(0.58, 0.88, nBeltV) * 0.46);
                // 洋红风暴斑：高空强对流区，给冷色球面点缀暖色
                var nStorm = fbm(d[0] * 5.0 + 41.0, d[1] * 8.0 + 27.0, d[2] * 5.0 + 33.0, 2);
                c = mix3(c, [1.0, 0.34, 0.68], smoothstep(0.46, 0.64, nStorm) * 0.66);
            } else {
                band = 0.5 + 0.5 * Math.sin(lat * p.bandFreq + n * p.bandWarp * 3.0);
                c = mix3(p.c1, p.c2, clamp(band * 0.65 + n * 0.35, 0, 1));
                c = mix3(c, p.c3, clamp((n - 0.55) * 1.5, 0, 0.55));
                if (p.ice) {
                    var pol2 = smoothstep(p.iceThr, 0.97, Math.abs(d[1]));
                    c = mix3(c, p.ice, pol2 * 0.9);
                }
            }
            // 多色系渐变：用已有噪声场做双辅色过渡，再掺入少量随机异色颗粒，
            // 同一星球同时呈现主色与冷暖辅色，避免单一色相铺满球面
            var ac = PLANET_ACCENTS[p.id];
            if (ac) {
                // 天王星/海王星已在自身分支内做出多色分区，这里降低全局辅色覆盖，避免被拉回单一色调
                var acGain = (p.id === 'uranus' || p.id === 'neptune') ? 0.42 : 1;
                var g1 = smoothstep(0.40, 0.76, n * 0.70 + fine * 0.30);
                var g2 = smoothstep(0.42, 0.78, (1.0 - n) * 0.62 + micro * 0.38);
                c = mix3(c, ac[0], g1 * 0.52 * acGain);
                c = mix3(c, ac[1], g2 * 0.38 * acGain);
                var speck = hash3(d[0] * 47.3 + 3.7, d[1] * 63.1 + 8.9, d[2] * 81.7 + 5.3);
                if (speck > 0.74) c = mix3(c, ac[2], (speck - 0.74) * 1.50 * acGain);
            }
            // 微纹理参与明暗起伏，比纯随机颗粒更接近真实云层/岩层
            var g = 0.94 + (micro - 0.5) * (0.10 + p.grain * 1.1)
                + (hash3(d[0] * 37.1, d[1] * 53.7, d[2] * 71.3) - 0.5) * p.grain * 0.42;
            var pr = clamp(c[0] * g, 0, 1);
            var pg = clamp(c[1] * g, 0, 1);
            var pb = clamp(c[2] * g, 0, 1);
            // 行星整体提高饱和度并轻抬亮度，配合多色系渐变让色彩更鲜明
            var plum = pr * 0.2126 + pg * 0.7152 + pb * 0.0722;
            return [
                clamp(plum + (pr - plum) * 1.24 + 0.025, 0, 1),
                clamp(plum + (pg - plum) * 1.24 + 0.025, 0, 1),
                clamp(plum + (pb - plum) * 1.24 + 0.025, 0, 1)
            ];
        };
    }

    function makeMoonColor(m) {
        return function (d) {
            var lat = Math.asin(clamp(d[1], -1, 1));
            var n = fbm(d[0] * 4.2 + 1.3, d[1] * 4.2 + 7.1, d[2] * 4.2 + 3.6, 3);
            var fine = fbm(d[0] * 20.0 + 4.1, d[1] * 20.0 + 2.7, d[2] * 20.0 + 8.3, 2);
            var c = mix3(m.base, m.tint, n * 0.7);
            if (m.id === 'moon') {
                // 月球：暗色月海 + 高频环形山与明亮溅射纹
                if (n < 0.44) c = mix3(c, [0.26, 0.26, 0.27], (0.44 - n) * 2.2);
                if (fine > 0.70) c = mix3(c, [0.96, 0.95, 0.92], (fine - 0.70) * 2.2);
            } else if (m.id === 'io') {
                // 木卫一：硫磺黄与火山橙红斑
                c = mix3([0.94, 0.84, 0.38], [0.76, 0.50, 0.15], n);
                if (fine > 0.72) c = mix3(c, [0.52, 0.24, 0.06], (fine - 0.72) * 2.4);
                c = mix3(c, [0.99, 0.92, 0.55], smoothstep(0.66, 0.9, n) * 0.4);
            } else if (m.id === 'europa') {
                // 木卫二：白冰表面与褐色线性裂纹
                c = mix3([0.84, 0.87, 0.90], [0.98, 0.98, 0.96], n);
                var crack = Math.abs(fbm(d[0] * 11.0, d[1] * 4.5, d[2] * 11.0, 2) - 0.5);
                if (crack < 0.038) c = mix3(c, [0.60, 0.43, 0.30], 0.72);
            } else if (m.id === 'ganymede') {
                // 木卫三：灰褐沟槽地形，亮区与暗区交错
                c = mix3([0.52, 0.48, 0.43], [0.78, 0.75, 0.70], n * 0.85);
                if (fine > 0.68) c = mix3(c, [0.90, 0.88, 0.84], (fine - 0.68) * 1.6);
            } else if (m.id === 'callisto') {
                // 木卫四：古老板层，密集亮坑
                c = mix3([0.36, 0.33, 0.30], [0.62, 0.58, 0.53], n * 0.6);
                if (fine > 0.62) c = mix3(c, [0.92, 0.90, 0.86], (fine - 0.62) * 1.5);
            } else if (m.id === 'titan') {
                // 土卫六：浓厚橙色甲烷雾霾，表面细节被遮蔽
                c = mix3([0.86, 0.62, 0.26], [0.97, 0.80, 0.44], n * 0.8);
                c = mix3(c, [0.72, 0.48, 0.18], smoothstep(1.0, 1.45, Math.abs(lat)) * 0.4);
            } else if (m.id === 'enceladus') {
                c = mix3([0.90, 0.93, 0.95], [1.0, 1.0, 1.0], n);
            } else if (m.id === 'triton') {
                // 海卫一：粉白冰面与哈密瓜地形
                c = mix3([0.78, 0.72, 0.72], [0.96, 0.90, 0.90], n);
                if (fine > 0.70) c = mix3(c, [0.86, 0.72, 0.70], (fine - 0.70) * 1.6);
            } else if (m.id === 'phobos' || m.id === 'deimos') {
                c = mix3([0.30, 0.27, 0.24], [0.52, 0.48, 0.43], n * 0.8);
                if (fine > 0.66) c = mix3(c, [0.66, 0.62, 0.56], (fine - 0.66) * 1.4);
            } else {
                // 其余冰/岩卫星：环形山与明暗斑
                if (n < 0.42) c = mix3(c, [0.42, 0.40, 0.38], (0.42 - n) * 1.8);
                if (fine > 0.70) c = mix3(c, [0.95, 0.94, 0.91], (fine - 0.70) * 1.8);
            }
            var g = 0.92 + (hash3(d[0] * 41.3, d[1] * 57.9, d[2] * 67.1) - 0.5) * 0.16;
            return [clamp(c[0] * g, 0, 1), clamp(c[1] * g, 0, 1), clamp(c[2] * g, 0, 1)];
        };
    }

    function buildCloudGeom(radius) {
        var count = 900;
        var pos = [], col = [], siz = [];
        var ga = Math.PI * (3 - Math.sqrt(5));
        for (var i = 0; i < count; i++) {
            var y = 1 - (i / (count - 1)) * 2;
            var r = Math.sqrt(Math.max(0, 1 - y * y));
            var th = ga * i;
            var dx = Math.cos(th) * r, dz = Math.sin(th) * r;
            var n = fbm(dx * 3.3 + 6.2, y * 3.3 + 2.8, dz * 3.3 + 9.4, 3);
            if (n < 0.57) continue;
            pos.push(dx * radius, y * radius, dz * radius);
            var b = 0.78 + (n - 0.57) * 0.9;
            col.push(b, b, Math.min(1, b + 0.04));
            siz.push(1.1 + hash3(dx * 21.7, y * 29.3, dz * 33.1) * 0.9);
        }
        return createGeom(new Float32Array(pos), new Float32Array(col), new Float32Array(siz));
    }

    function buildCorona() {
        var count = Math.round(2600 * CONFIG.quality);
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        for (var i = 0; i < count; i++) {
            var u = hash3(i * 1.7, 3.1, 5.3) * 2 - 1;
            var phi = hash3(i * 2.3, 7.7, 9.1) * Math.PI * 2;
            var rr = Math.sqrt(Math.max(0, 1 - u * u));
            var radius = SUN.dispR * (1.03 + hash3(i * 3.7, 11.3, 13.9) * 0.95);
            var dx = Math.cos(phi) * rr, dz = Math.sin(phi) * rr;
            pos[i * 3] = dx * radius;
            pos[i * 3 + 1] = u * radius;
            pos[i * 3 + 2] = dz * radius;
            var t = hash3(i * 5.1, 17.7, 19.3);
            col[i * 3] = 1.0;
            col[i * 3 + 1] = 0.45 + t * 0.4;
            col[i * 3 + 2] = 0.12 + t * 0.2;
            siz[i] = 1.2 + t * 2.4;
        }
        return createGeom(pos, col, siz);
    }

    // 太阳日珥 / 耀斑喷发：小型动态粒子系统（约 520 点，占用 1 次 draw call）
    // 粒子按 7 个「活跃带」成簇分布，沿自身切向弯曲成弧，升起后亮度衰减再回落，
    // 位置与颜色每帧用 bufferSubData 推送（DYNAMIC_DRAW），不重建几何、不新增着色器
    var flareGeom = null;
    var flarePos = null;
    var flareCol = null;
    var flareSeed = null;
    var flareCount = 0;
    var flareClock = 0;

    function buildFlares() {
        var count = Math.max(160, Math.round(520 * CONFIG.quality));
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        // 每个粒子 10 个浮点：dir(3) + 切向(3) + 速度 + 相位 + 弧高 + 侧倾
        var seed = new Float32Array(count * 10);
        for (var i = 0; i < count; i++) {
            var band = Math.floor(hash3(i * 1.3, 2.7, 4.1) * 7);
            var lat = (hash3(band * 3.1, 8.7, 1.9) * 2 - 1) * 0.72 +
                (hash3(i * 4.7, 2.3, 6.7) - 0.5) * 0.26;
            var lon = hash3(band * 5.7, 4.3, 9.7) * Math.PI * 2 +
                (hash3(i * 2.9, 6.1, 3.3) - 0.5) * 0.55;
            var rr = Math.sqrt(Math.max(0, 1 - lat * lat));
            var dx = Math.cos(lon) * rr, dy = lat, dz = Math.sin(lon) * rr;
            // 与 dir 垂直的切向，用于让喷发轨迹弯成日珥弧
            var tx = -dz, ty = 0, tz = dx;
            var tl = Math.hypot(tx, ty, tz) || 1;
            tx /= tl; ty /= tl; tz /= tl;
            var o = i * 10;
            seed[o] = dx; seed[o + 1] = dy; seed[o + 2] = dz;
            seed[o + 3] = tx; seed[o + 4] = ty; seed[o + 5] = tz;
            seed[o + 6] = 0.60 + hash3(i * 7.1, 9.9, 2.5) * 0.85;   // 喷发周期速度
            seed[o + 7] = hash3(i * 11.3, 1.7, 5.9);                // 生命周期相位
            seed[o + 8] = 0.34 + hash3(i * 13.7, 3.9, 7.1) * 0.95;  // 弧顶高度（太阳半径倍数）
            seed[o + 9] = (hash3(i * 17.9, 5.3, 8.7) - 0.5) * 1.5;  // 侧倾量
            siz[i] = 1.0 + hash3(i * 17.3, 5.1, 8.3) * 2.1;
        }

        function dynBuf(arr) {
            var b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
            return b;
        }

        flarePos = pos; flareCol = col; flareSeed = seed; flareCount = count;
        flareClock = 0;
        return { pos: dynBuf(pos), col: dynBuf(col), size: dynBuf(siz), count: count };
    }

    function updateFlares(dt) {
        if (!flareGeom) return;
        flareClock += dt;
        var pos = flarePos, col = flareCol, seed = flareSeed;
        var R = SUN.dispR;
        for (var i = 0; i < flareCount; i++) {
            var o = i * 10;
            var ph = seed[o + 7] + flareClock * (0.15 + seed[o + 6] * 0.11);
            var t = ph - Math.floor(ph);
            // 升—落包络：sin 半周期，起点/终点都贴回光球表面，不会凭空出现或消失
            var rise = Math.sin(Math.PI * t);
            var env = rise * rise;
            var h = 0.015 + seed[o + 8] * env;
            var rad = R * (1.004 + h);
            var bend = seed[o + 9] * env * 0.85;
            pos[i * 3] = (seed[o] + seed[o + 3] * bend) * rad;
            pos[i * 3 + 1] = (seed[o + 1] + seed[o + 4] * bend) * rad;
            pos[i * 3 + 2] = (seed[o + 2] + seed[o + 5] * bend) * rad;
            // 弧顶偏冷偏红、根部偏白热，配合加色混合形成喷发的热度层次
            var mixT = env;
            var bright = 0.18 + 0.82 * rise;
            col[i * 3] = (1.0) * bright;
            col[i * 3 + 1] = (0.80 - 0.44 * mixT) * bright;
            col[i * 3 + 2] = (0.42 - 0.28 * mixT) * bright;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, flareGeom.pos);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);
        gl.bindBuffer(gl.ARRAY_BUFFER, flareGeom.col);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, col);
    }

    // 深空背景：三层视差星空（远景底噪 / 中景主星 / 近景亮星）+ 银河带 + 分层星云
    // 三层使用不同的极慢自转角速度，层与层之间产生细微相对位移；
    // par 为视差深度系数：数值越大表示该层越「近」，同样的视角位移下平移得越多，
    // 远/中/近依次递增，配合星云罩层形成递进的深度空间感
    var STAR_LAYER_DEFS = [
        // 远景：密集细暗的底噪星，压住整片深空的黑，不抢主体
        { frac: 0.40, band: 0.52, sizeLo: 0.14, sizeHi: 0.34,
            brightLo: 0.26, brightHi: 0.60, flare: 0.0,
            spin: 0.0011, maxSize: 6, opacity: 0.66, twinkle: 0.04, soft: 0, par: 13 },
        // 中景：主体星场，四类色温齐全，构成可辨认的星座感
        { frac: 0.42, band: 0.40, sizeLo: 0.30, sizeHi: 0.78,
            brightLo: 0.50, brightHi: 0.96, flare: 0.02,
            spin: 0.0021, maxSize: 10, opacity: 0.90, twinkle: 0.07, soft: 0, par: 24 },
        // 近景：稀疏亮星，点径更大且带柔光，拉开前后层次
        { frac: 0.18, band: 0.16, sizeLo: 0.95, sizeHi: 2.10,
            brightLo: 0.80, brightHi: 1.00, flare: 0.16,
            spin: 0.0032, maxSize: 18, opacity: 0.98, twinkle: 0.10, soft: 1, par: 38 }
    ];

    // 单层星点：银河带沿同一大圆聚集，其余球面均匀分布
    function buildStarLayer(count, def, seed) {
        var R = 1500;
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        var bandN = Math.round(count * def.band);
        for (var i = 0; i < count; i++) {
            var h = i * 3 + seed;
            var inBand = i < bandN;
            var x, y, z;
            if (inBand) {
                var a = hash3(h * 1.1, 3.7, 5.3) * Math.PI * 2;
                y = (hash3(h * 2.3, 7.1, 9.7) + hash3(h * 3.1, 11.3, 13.9) + hash3(h * 4.7, 17.9, 19.3) - 1.5) * 0.1;
                var bx = Math.cos(a), bz = Math.sin(a);
                var bl = Math.sqrt(bx * bx + y * y + bz * bz) || 1;
                x = bx / bl; y /= bl; z = bz / bl;
            } else {
                var u = hash3(h * 1.3, 5.7, 9.1) * 2 - 1;
                var ph = hash3(h * 2.9, 7.3, 11.7) * Math.PI * 2;
                var rr = Math.sqrt(Math.max(0, 1 - u * u));
                x = Math.cos(ph) * rr; y = u; z = Math.sin(ph) * rr;
            }
            pos[i * 3] = x * R; pos[i * 3 + 1] = y * R; pos[i * 3 + 2] = z * R;

            // 多色系星空：暖白 / 冷蓝白 / 淡紫 / 青绿四类色温随机分布，
            // 银河带整体压暗，避免整片星空只有单一冷白
            var tone = hash3(h * 5.9, 15.1, 21.7);
            var bright = def.brightLo + hash3(h * 6.1, 23.3, 29.1) * (def.brightHi - def.brightLo);
            var tintR, tintG, tintB;
            if (tone < 0.30) {            // 暖白（偏金）
                tintR = 1.00; tintG = 0.88; tintB = 0.70;
            } else if (tone < 0.62) {     // 冷蓝白
                tintR = 0.76; tintG = 0.86; tintB = 1.00;
            } else if (tone < 0.84) {     // 淡紫
                tintR = 0.86; tintG = 0.76; tintB = 1.00;
            } else {                      // 青绿
                tintR = 0.70; tintG = 0.96; tintB = 0.94;
            }
            var tintJit = 0.88 + hash3(h * 7.7, 27.1, 33.9) * 0.24;
            var bandDim = inBand ? 0.72 : 1;
            col[i * 3] = tintR * bright * tintJit * bandDim;
            col[i * 3 + 1] = tintG * bright * tintJit * bandDim;
            col[i * 3 + 2] = tintB * bright * tintJit * bandDim;

            var s = def.sizeLo + hash3(h * 9.7, 41.3, 43.1) * (def.sizeHi - def.sizeLo);
            // 少量「亮星」额外放大，作为星空里的视觉锚点
            if (hash3(h * 11.3, 47.9, 53.3) < def.flare) s *= 1.8;
            siz[i] = s;
        }
        return createGeom(pos, col, siz);
    }

    // 四团星云：每团再分「亮核 / 弱晕」两档，中心浓、边缘散，避免一片死板的雾
    function buildNebula(count) {
        var R = 1500;
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        var tints = [
            [0.42, 0.26, 0.75], [0.78, 0.44, 0.30],
            [0.24, 0.46, 0.78], [0.28, 0.62, 0.66]
        ];
        var per = Math.max(2, Math.floor(count / 4));
        var coreEnd = Math.floor(per * 0.62);
        for (var c = 0; c < 4; c++) {
            var baseAngle = c * 1.57 + 0.7;
            var baseTilt = Math.sin(c * 0.9 + 0.3) * 0.75;
            var cluster = [
                Math.cos(baseAngle) * Math.cos(baseTilt),
                Math.sin(baseTilt),
                Math.sin(baseAngle) * Math.cos(baseTilt)
            ];
            for (var k = 0; k < per; k++) {
                var idx = c * per + k;
                if (idx >= count) break;
                var core = k < coreEnd;
                var spread = core ? 0.34 : 0.62;
                var dx = cluster[0] + (hash3(idx * 1.7, 3.1, 5.9) - 0.5) * spread;
                var dy = cluster[1] + (hash3(idx * 2.9, 7.7, 11.3) - 0.5) * spread;
                var dz = cluster[2] + (hash3(idx * 4.3, 13.1, 17.7) - 0.5) * spread;
                var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
                pos[idx * 3] = dx / dl * R; pos[idx * 3 + 1] = dy / dl * R; pos[idx * 3 + 2] = dz / dl * R;
                var tint = tints[c];
                var glow = core
                    ? (0.085 + hash3(idx * 6.7, 19.9, 23.3) * 0.105)
                    : (0.026 + hash3(idx * 6.7, 19.9, 23.3) * 0.030);
                col[idx * 3] = tint[0] * glow; col[idx * 3 + 1] = tint[1] * glow; col[idx * 3 + 2] = tint[2] * glow;
                siz[idx] = core
                    ? (6 + hash3(idx * 8.9, 29.3, 31.7) * 13)
                    : (18 + hash3(idx * 8.9, 29.3, 31.7) * 20);
            }
        }
        return createGeom(pos, col, siz);
    }

    // 低饱和星云渐变罩层：色相取自深空窄带/宽带摄影里常见的蓝紫、粉紫与暗橙，
    // 用少量超大柔和点沿多条大圆带铺满整片天幕，点与点互相咬合形成连续的色彩晕染。
    // 亮度压在 0.05~0.12 的极低区间，加色混合后仍远低于前景内容，只提供氛围不抢主体
    function buildNebulaVeil(count, seed, tints) {
        var R = 1500;
        var pos = new Float32Array(count * 3);
        var col = new Float32Array(count * 3);
        var siz = new Float32Array(count);
        var groups = tints.length;
        var per = Math.max(1, Math.ceil(count / groups));
        for (var i = 0; i < count; i++) {
            var g = Math.min(groups - 1, Math.floor(i / per));
            var tint = tints[g];
            var h = i * 3 + seed;
            // 每组沿一条独立的大圆带展开，组与组之间角度错开，
            // 使整片天幕被不同色相的雾带交错覆盖，不出现规则的团块或接缝
            var a0 = g * (Math.PI * 2 / groups) + hash3(seed + g * 17.3, 3.1, 5.7) * 1.2;
            var tilt = (hash3(h * 1.9, 4.3, 6.7) - 0.5) * 1.25;
            var ang = a0 + (hash3(h * 2.7, 8.1, 10.3) - 0.5) * 2.1;
            var bx = Math.cos(ang), by = Math.sin(tilt) * 0.62, bz = Math.sin(ang) * Math.cos(tilt);
            var bl = Math.sqrt(bx * bx + by * by + bz * bz) || 1;
            // 半径轻微抖动：点不落在同一球壳上，视野边缘不会出现硬切
            var rr = R * (0.94 + hash3(h * 3.9, 12.7, 14.9) * 0.12);
            pos[i * 3] = bx / bl * rr;
            pos[i * 3 + 1] = by / bl * rr;
            pos[i * 3 + 2] = bz / bl * rr;

            // 极低亮度 + 轻微色相漂移，叠加后接近真实深空影像那种发灰的弥散色；
            // 单点亮度压在 0.075~0.21，靠大点径的柔光彼此咬合才浮现出可辨认的色彩
            var glow = 0.075 + hash3(h * 5.3, 16.1, 18.7) * 0.135;
            var jit = 0.86 + hash3(h * 7.1, 20.3, 22.9) * 0.28;
            col[i * 3] = tint[0] * glow * jit;
            col[i * 3 + 1] = tint[1] * glow * jit;
            col[i * 3 + 2] = tint[2] * glow * jit;

            // 点径远大于普通恒星：一片罩层由数十个大柔光点交叠成连续晕染，而不是一颗颗可见的光斑
            siz[i] = 120 + hash3(h * 9.3, 26.7, 28.1) * 110;
        }
        return createGeom(pos, col, siz);
    }

    function buildStars() {
        var base = CONFIG.bgStarCount;
        var lowQ = CONFIG.quality < 1;
        starLayers.length = 0;
        // 最远层：三片星云渐变罩，视差最小、几乎静止（仅极慢反向漂移），
        // 为整片背景提供蓝紫 / 粉紫 / 暗橙的自然色调基底
        starLayers.push({
            geom: buildNebulaVeil(lowQ ? 90 : 200, 41, [
                [0.30, 0.32, 0.82], [0.26, 0.42, 0.84], [0.46, 0.32, 0.86]
            ]),
            spin: -0.00042, maxSize: 320, opacity: 0.44, twinkle: 0,
            soft: 1, par: 6
        });
        starLayers.push({
            geom: buildNebulaVeil(lowQ ? 76 : 170, 733, [
                [0.86, 0.36, 0.54], [0.66, 0.30, 0.76]
            ]),
            spin: 0.00033, maxSize: 320, opacity: 0.40, twinkle: 0,
            soft: 1, par: 8
        });
        // 暗橙雾：深空 H-alpha / 尘埃带的低位暖色，亮度再压一档，只在下缘与星系带附近透出
        starLayers.push({
            geom: buildNebulaVeil(lowQ ? 58 : 130, 1297, [
                [0.98, 0.50, 0.18], [0.90, 0.42, 0.14]
            ]),
            spin: 0.00026, maxSize: 320, opacity: 0.44, twinkle: 0,
            soft: 1, par: 10
        });
        for (var li = 0; li < STAR_LAYER_DEFS.length; li++) {
            var d = STAR_LAYER_DEFS[li];
            var n = Math.max(1, Math.round(base * d.frac));
            starLayers.push({
                geom: buildStarLayer(n, d, li * 977),
                spin: d.spin, maxSize: d.maxSize,
                opacity: d.opacity, twinkle: d.twinkle, soft: d.soft, par: d.par
            });
        }
        var nebulaCount = lowQ ? 48 : 96;
        starLayers.push({
            geom: buildNebula(nebulaCount), spin: 0.0008,
            maxSize: 40, opacity: 0.92, twinkle: 0.02, soft: 1, par: 18
        });
    }

    // 赤经/赤纬 → 天球坐标（与原「粒子地球」一致）
    function raDecToXYZ(ra, dec, radius, out, offset) {
        var raRad = ra * Math.PI / 180;
        var decRad = dec * Math.PI / 180;
        var cd = Math.cos(decRad);
        out[offset] = Math.cos(raRad) * cd * radius;
        out[offset + 1] = Math.sin(decRad) * radius;
        out[offset + 2] = Math.sin(raRad) * cd * radius;
    }

    // 真实 89 星座主星（按连接数分三级星等）
    function buildConstellationStars() {
        if (!STAR_DATA || STAR_DATA.charAt(0) === '_') return null;
        var items = STAR_DATA.split(';');
        var pos = [], col = [], siz = [];
        var R = 1; // 单位天球，渲染时按地球半径缩放并平移到地球位置
        for (var i = 0; i < items.length; i++) {
            var parts = items[i].split(',');
            if (parts.length < 2) continue;
            var ra = parseFloat(parts[0]), dec = parseFloat(parts[1]);
            var links = parseFloat(parts[2]) || 1;
            raDecToXYZ(ra, dec, R, pos, pos.length);
            var t = clamp((links - 1) / 2.4, 0, 1);
            col.push(lerpChannel(0.62, 1.0, t), lerpChannel(0.82, 1.0, t), 1.0);
            siz.push((links >= 2.5 ? 2.35 : (links >= 1.5 ? 1.7 : 1.2)) + hash3(i * 3.1, 7.3, 9.9) * 0.15);
        }
        return createGeom(new Float32Array(pos), new Float32Array(col), new Float32Array(siz));
    }

    // 星座连线采样点：让星座形态以粒子星尘的方式铺开
    function buildConstellationDots() {
        if (!DOT_DATA || DOT_DATA.charAt(0) === '_') return null;
        var items = DOT_DATA.split(';');
        var pos = [], col = [], siz = [];
        var R = 1;
        for (var i = 0; i < items.length; i++) {
            var parts = items[i].split(',');
            if (parts.length < 2) continue;
            raDecToXYZ(parseFloat(parts[0]), parseFloat(parts[1]), R, pos, pos.length);
            var jitter = 0.96 + hash3(i * 2.3, 5.9, 8.1) * 0.08;
            col.push(0.5 * jitter, 0.9 * jitter, 1.0 * jitter);
            siz.push(0.85);
        }
        return createGeom(new Float32Array(pos), new Float32Array(col), new Float32Array(siz));
    }

    var CONSTELLATION_NAMES = [
