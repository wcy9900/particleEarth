    function buildSaturnRings() {
        var R = PLANETS[5].dispR;
        var inner = R * 1.26;
        var outer = R * 2.2;
        var count = Math.round(40000 * CONFIG.quality);
        var pos = [], col = [], siz = [];
        for (var i = 0; i < count; i++) {
            var t = hash3(i * 1.9, 3.3, 5.9);
            // 卡西尼环缝：环中段留出空隙，避免一整块实心圆盘
            if (t > 0.60 && t < 0.68) continue;
            var radius = inner + (outer - inner) * Math.sqrt(Math.min(0.999, t));
            // 角度按序号均分，只加极小抖动：粒子沿环带连续铺开，不结团成扫帚状
            var a = (i / count) * Math.PI * 2 + (hash3(i * 7.1, 11.9, 13.3) - 0.5) * 0.035;
            pos.push(Math.cos(a) * radius,
                (hash3(i * 2.7, 5.1, 8.3) - 0.5) * R * 0.02,
                Math.sin(a) * radius);
            // C / B / A 三个环带各自成色，B 环最亮
            var c;
            if (t < 0.26) c = [0.54, 0.50, 0.44];
            else if (t < 0.60) c = [0.94, 0.88, 0.74];
            else c = [0.74, 0.68, 0.57];
            var jitter = 0.92 + hash3(i * 4.7, 9.7, 15.1) * 0.16;
            col.push(c[0] * jitter, c[1] * jitter, c[2] * jitter);
            siz.push(0.5 + hash3(i * 8.3, 12.7, 18.9) * 0.5);
        }
        return createGeom(new Float32Array(pos), new Float32Array(col), new Float32Array(siz));
    }

    function buildOrbitGeom(p) {
        var seg = 256;
        var pos = new Float32Array(seg * 2 * 3);
        var col = new Float32Array(seg * 2 * 3);
        var base = [clamp(0.28 + p.c1[0] * 0.35, 0, 1), clamp(0.42 + p.c1[1] * 0.3, 0, 1), clamp(0.62 + p.c1[2] * 0.3, 0, 1)];
        for (var i = 0; i < seg; i++) {
            for (var k = 0; k < 2; k++) {
                var a = ((i + k) / seg) * Math.PI * 2;
                var idx = (i * 2 + k) * 3;
                pos[idx] = Math.cos(a) * p.orbitR;
                pos[idx + 1] = Math.sin(a) * p.orbitR * p.incl;
                pos[idx + 2] = Math.sin(a) * p.orbitR;
                col[idx] = base[0];
                col[idx + 1] = base[1];
                col[idx + 2] = base[2];
            }
        }
        return { pos: (function () {
            var b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
            return b;
        })(), col: (function () {
            var b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
            return b;
        })(), count: seg * 2, size: null };
    }

    function buildUnitOrbitGeom() {
        var seg = 128;
        var pos = new Float32Array(seg * 2 * 3);
        var col = new Float32Array(seg * 2 * 3);
        for (var i = 0; i < seg; i++) {
            for (var k = 0; k < 2; k++) {
                var a = ((i + k) / seg) * Math.PI * 2;
                var idx = (i * 2 + k) * 3;
                pos[idx] = Math.cos(a);
                pos[idx + 1] = Math.sin(a);
                pos[idx + 2] = Math.sin(a);
                col[idx] = 0.55;
                col[idx + 1] = 0.74;
                col[idx + 2] = 0.95;
            }
        }
        var posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
        var colBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
        gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
        return { pos: posBuf, col: colBuf, count: seg * 2, size: null };
    }

    var starLayers = [];
    var coronaGeom = null;
    var ringsGeom = null;
    var unitOrbitGeom = null;
    var moonOrbitGeom = null;
    var constellationStars = null;
    var constellationDots = null;

    // ——— 分阶段渐进式构建 ———
    // 原实现一次性同步构建约 110 万点，会把主线程锁死数秒（首屏卡顿的根因）。
    // 现在拆成可切片的任务队列：每帧只占用约 22ms，剩下的时间留给合成器播放
    // 粒子聚集动画；主线（太阳/八大行星/土星环/轨道）就绪即开始渲染并淡出加载层，
    // 卫星等小体量细节在渲染主循环里继续补完，全程有进度条反馈。
    var loadQueue = [];
    var loadWeightTotal = 0;
    var loadWeightDone = 0;
    var loadUI = { fill: null, stage: null, pct: -1, text: '' };
    var coreReady = false;
    var sceneReady = false;
    var renderStarted = false;
    var revealStarted = false;
    var earthMaskDone = false;

    var LOAD_FRAME_BUDGET = 22;     // 加载期每帧构建预算（ms）
    var LOAD_FRAME_BUDGET_LIVE = 9; // 已开始渲染后收紧预算，保证画面流畅
    var LOAD_REVEAL_MIN = 3300;     // 粒子聚集最短展示时长（最慢一颗 3.20s 落位）

    function queueLoad(label, weight, step) {
        loadQueue.push({ label: label, weight: weight, step: step });
        loadWeightTotal += weight;
    }

    function addLoadProgress(n) { loadWeightDone += n; }

    // 同步子任务：本身很快，但仍按任务排队，让阶段文案与进度连续推进
    function queueSync(label, weight, fn) {
        queueLoad(label, weight, function () {
            fn();
            addLoadProgress(weight);
            return true;
        });
    }

    // 切片点云任务：job.step 在帧预算内推进一批点
    function queueGeomJob(label, job, assign) {
        queueLoad(label, job.count, function (deadline) {
            if (!job.step(deadline, addLoadProgress)) return false;
            assign(job.geom);
            return true;
        });
    }

    function updateLoadUI() {
        if (!loadUI.fill) {
            loadUI.fill = document.querySelector('#loading-bar i');
            loadUI.stage = document.getElementById('loading-stage');
            if (!loadUI.fill) return;
        }
        var job = loadQueue[0];
        var label = sceneReady ? '星系构建完成' : (job ? job.label : '正在校准相机');
        var shown = sceneReady ? 100
            : Math.min(99, Math.round((loadWeightTotal > 0 ? loadWeightDone / loadWeightTotal : 1) * 100));
        if (shown !== loadUI.pct) {
            loadUI.pct = shown;
            loadUI.fill.style.width = shown + '%';
        }
        var text = label + ' · ' + shown + '%';
        if (text !== loadUI.text) {
            loadUI.text = text;
            loadUI.stage.textContent = text;
        }
    }

    function startRender() {
        if (renderStarted) return;
        renderStarted = true;
        requestAnimationFrame(render);
    }

    // 主线就绪 + 首帧已出 + 聚集动画播完，三者齐备才淡出加载层
    function tryReveal() {
        if (revealStarted || !coreReady || !firstFrameDone) return;
        revealStarted = true;
        var wait = Math.max(0, LOAD_REVEAL_MIN - (performance.now() - loadingGalaxyStart));
        setTimeout(function () {
            // 天幕渐入与加载层淡出同时起算：从纯黑平滑过渡到有星场，不出现突兀跳变
            bgRevealStart = performance.now();
            loadingEl.classList.add('is-hidden');
            setTimeout(function () {
                loadingEl.style.display = 'none';
                // 加载层彻底退场：移除粒子节点、结束合成层动画，
                // 之后只剩渲染主循环，不会与场景重复绘制
                var galaxy = document.getElementById('loading-galaxy');
                if (galaxy) {
                    galaxy.style.animation = 'none';
                    galaxy.innerHTML = '';
                }
            }, 380);
            viewSwitchEl.classList.add('is-ready');
        }, wait);
        setTimeout(openEntryModal, wait + 260);
    }

    // 逐帧推进任务队列：超出预算立即让出主线程
    function pumpLoad() {
        if (!loadQueue.length) return;
        var deadline = performance.now() + (renderStarted ? LOAD_FRAME_BUDGET_LIVE : LOAD_FRAME_BUDGET);
        while (loadQueue.length) {
            var done;
            try {
                done = loadQueue[0].step(deadline);
            } catch (err) {
                loadingEl.innerHTML = '<p>场景构建失败</p><small>' +
                    (err && err.message ? err.message : err) + '</small>';
                console.error(err);
                return;
            }
            if (!done) break;
            loadQueue.shift();
        }
        if (!loadQueue.length) sceneReady = true;
        updateLoadUI();
        if (loadQueue.length) requestAnimationFrame(pumpLoad);
    }

    function planScene() {
        var q = CONFIG.quality;

        // 1) 深空资源：最便宜的解锁放最前，先立起背景与地理数据
        queueSync('正在解码地理数据', 1, function () { geoPack = decodeGeoPack(); });
        queueSync('正在铺设深空星场', 12000, function () { buildStars(); });
        queueSync('正在标注星座天球', 9914, function () {
            constellationStars = buildConstellationStars();
            constellationDots = buildConstellationDots();
        });
        queueSync('正在准备天体轨道', 64, function () {

    // 返回 1 = 全亮，接近 0 = 落在本影中心；半影区间用 smoothstep 过渡。
    function shadowDim(center, radius, pos, light) {
        var dx = center[0] - pos[0], dy = center[1] - pos[1], dz = center[2] - pos[2];
        var t = dx * light[0] + dy * light[1] + dz * light[2];
        if (t <= 0) return 1;
        var qx = dx - light[0] * t, qy = dy - light[1] * t, qz = dz - light[2] * t;
        var q = Math.sqrt(qx * qx + qy * qy + qz * qz);

        return 0.10 + 0.90 * smoothstep(radius * 0.90, radius * 1.25, q);

    function updateBodies() {

            var a = p.angle0 + time * p.speed;
            p.pos[0] = Math.cos(a) * p.orbitR;
            p.pos[1] = Math.sin(a) * p.orbitR * p.incl;
            p.pos[2] = Math.sin(a) * p.orbitR;
            p.spinAngle = time * p.spin + (p.spinPhase !== undefined ? p.spinPhase : p.angle0 * 0.6);

            var l = Math.hypot(p.pos[0], p.pos[1], p.pos[2]) || 1;
            p.light[0] = -p.pos[0] / l;
            p.light[1] = -p.pos[1] / l;
            p.light[2] = -p.pos[2] / l;

            if (p.moons) {
                for (var j = 0; j < p.moons.length; j++) {
                    var m = p.moons[j];
                    var ma = m.angle0 + time * m.speed;
                    m.pos[0] = p.pos[0] + Math.cos(ma) * m.orbitR;
                    m.pos[1] = p.pos[1] + Math.sin(ma) * m.orbitR * m.incl;
                    m.pos[2] = p.pos[2] + Math.sin(ma) * m.orbitR;

        // 因此视角不会产生任何上下俯仰或左右倾斜

            var vx = viewMatrix[0] * wx + viewMatrix[4] * wy + viewMatrix[8] * wz + viewMatrix[12];

            var cw = projMatrix[3] * vx + projMatrix[7] * vy + projMatrix[11] * vz + projMatrix[15];
            if (cw <= 0.0001) continue;
            var cx = (projMatrix[0] * vx + projMatrix[4] * vy + projMatrix[8] * vz + projMatrix[12]) / cw;
            var cy = (projMatrix[1] * vx + projMatrix[5] * vy + projMatrix[9] * vz + projMatrix[13]) / cw;

            var blocked = diskR > 0 && Math.hypot(cx * aspect, cy) < diskR * 0.96;
            var edge = Math.max(Math.abs(cx), Math.abs(cy));
            if (blocked || edge >= 0.95) continue;

            // 越靠近画面中心越清晰（原页行为：最多同时显示 5 个星座名）
            var fk = 1 - smoothstep(0.45, 0.9, edge);
            it.cand = fk * starFade * earthFocusFade * (1 - (scatterActive ? 0.6 : 0));
            it.metric = edge;
            it.x = (cx * 0.5 + 0.5) * window.innerWidth;
            it.y = (0.5 - cy * 0.5) * window.innerHeight - 6;
            if (it.cand > 0.01) cands.push(it);
        }

        cands.sort(function (a, b) { return a.metric - b.metric; });
        for (var c = 0; c < cands.length; c++) {
            if (c >= 5) cands[c].cand = 0;
        }

        for (var j = 0; j < starLabels.length; j++) {
            var item = starLabels[j];
            var target = item.cand;
            var prev = item.opacity;
            item.opacity += (target - item.opacity) * fadeK;
            if (Math.abs(item.opacity - target) < 0.005) item.opacity = target;
            if (item.opacity < 0.01) {
                if (prev >= 0.01) item.el.style.opacity = '0';
                continue;
            }
            var scale = 0.9 + item.opacity * 0.1;
            item.el.style.opacity = item.opacity.toFixed(2);
            item.el.style.transform = 'translate3d(' + item.x.toFixed(1) + 'px,' + item.y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale.toFixed(2) + ')';
        }
    }

    // 全视距离随画面宽高比自适应：竖屏时水平视野更窄，需要退得更远才能装下海王星轨道
    function overviewDist() {
        var aspect = Math.max(0.38, window.innerWidth / Math.max(1, window.innerHeight));
        var halfTan = Math.tan(CONFIG.fov * Math.PI / 360) * aspect;
        return Math.max(440, Math.min(1160, 300 / halfTan));
    }

    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, dprCap);
        pointingRatio = dpr;
        var w = Math.max(1, Math.floor(window.innerWidth * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
        }
        gl.viewport(0, 0, w, h);
        perspective(projMatrix, CONFIG.fov * Math.PI / 180, w / h, 0.5, 7000);
    }

    function scheduleResize() {
        if (scheduleResize.pending) return;
        scheduleResize.pending = true;
        requestAnimationFrame(function () {
            scheduleResize.pending = false;
            resize();
        });
    }

    // ==========================================
    // 9. 每帧渲染
    // ==========================================
    // 点精灵亮度补偿：远景点径被最小 1px 撑大、近景点径被上限压缩时，
    // 按面积比例衰减透明度，使加色混合后的表面亮度在任意距离保持一致
    function pointAlpha(base, s0, maxSize) {
        var s = clamp(s0, 1.0, maxSize);
        var k = s0 / s;
        return clamp(base * k * k, 0.0008, 1.0);
    }

    function render(now) {
        requestAnimationFrame(render);

        var rawDelta = lastFrameTime ? now - lastFrameTime : 16.7;
        var dt = lastFrameTime ? Math.min(0.05, rawDelta / 1000) : 0.016;
        lastFrameTime = now;

        // 自适应分辨率：持续掉帧时下调渲染像素比，优先保证公转动画顺滑
        if (sceneReady && firstFrameDone && rawDelta > 0 && rawDelta < 200) {
            perfAccum += rawDelta;
            perfFrames++;
        }
        if (perfFrames >= 90) {
            var avgFrame = perfAccum / perfFrames;
            if (avgFrame > 26) {
                slowStrikes++;
            } else {
                slowStrikes = 0;
            }
            if (slowStrikes >= 2 && dprCap > 1.01) {
                dprCap = Math.max(1, dprCap - 0.25);
                scheduleResize();
                slowStrikes = 0;
            }
            perfAccum = 0;
            perfFrames = 0;
        }

        time += dt;
        cloudDrift += dt * 0.062;
        updateBodies();
        updateCamera(dt);
        updateView(dt);
        var scatter = updateScatter(dt);
        updateInteraction(dt);
        orbitBright += (orbitGoal - orbitBright) * (1 - Math.exp(-dt * 4));

        // 星座天球模型：跟随地球位置，独立的 -23.4° 倾角 + 极慢自转
        var earthBody = PLANETS[2];
        var constR = earthBody.dispR * CONFIG.constellationScale * starScale;
        rotationZ(tmpM1, CONFIG.constellationTilt);
        rotationY(tmpM2, time * CONFIG.constellationSpin);
        multiply(constModel, tmpM1, tmpM2);
        for (var ci = 0; ci < 3; ci++) {
            constModel[ci] *= constR;
            constModel[4 + ci] *= constR;
            constModel[8 + ci] *= constR;
        }
        constModel[12] = earthBody.pos[0];
        constModel[13] = earthBody.pos[1];
        constModel[14] = earthBody.pos[2];

        // 相机：球坐标围绕当前目标点
        var st = Math.sin(cameraState.theta);
        var ex = camTarget.x + cameraState.radius * st * Math.sin(cameraState.phi);
        var ey = camTarget.y + cameraState.radius * Math.cos(cameraState.theta);
        var ez = camTarget.z + cameraState.radius * st * Math.cos(cameraState.phi);
        camEye[0] = ex; camEye[1] = ey; camEye[2] = ez;

        // 基准相机基向量（未滚转）：r0 = 视线×世界上方，u0 = r0×视线
        var fx = camTarget.x - ex, fy = camTarget.y - ey, fz = camTarget.z - ez;
        var fl = Math.hypot(fx, fy, fz) || 1;
        fx /= fl; fy /= fl; fz /= fl;
        var rx = -fz, ry = 0, rz = fx;
        var rl = Math.hypot(rx, ry, rz) || 1;
        rx /= rl; ry /= rl; rz /= rl;
        var ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
        // 画面滚转：相机基绕视线轴旋转，up 取旋转后的上方向，
        // 手掌顺时针 → 画面顺时针，且角度严格 1:1
        var cs = Math.cos(cameraState.roll), sn = Math.sin(cameraState.roll);
        var upX = -sn * rx + cs * ux, upY = -sn * ry + cs * uy, upZ = -sn * rz + cs * uz;
        lookAt(viewMatrix, ex, ey, ez, camTarget.x, camTarget.y, camTarget.z, upX, upY, upZ);

        // 撞击震动：只偏移视图矩阵的平移项，画面抖而不影响任何世界坐标计算
        if (shakeAmp > 0.0004) {
            viewMatrix[12] += (Math.sin(time * 61.7) * 0.6 + Math.sin(time * 103.3 + 1.7) * 0.4) * shakeAmp;
            viewMatrix[13] += (Math.sin(time * 54.3 + 2.1) * 0.6 + Math.sin(time * 91.1 + 0.5) * 0.4) * shakeAmp;
        }

        // 广告牌基向量：太阳辉光始终正对相机（随滚转同步）
        camRight[0] = cs * rx + sn * ux; camRight[1] = cs * ry + sn * uy; camRight[2] = cs * rz + sn * uz;
        camUp[0] = upX; camUp[1] = upY; camUp[2] = upZ;

        // 深空天幕状态：加载层开始退场时起算，2.4s 平滑渐入；
        // 视差目标由指针位置与相机环绕偏移共同给出，再做指数平滑，避免位移突变
        if (bgRevealStart >= 0) {
            var bgT = clamp((now - bgRevealStart) / 2400, 0, 1);
            bgReveal = bgT * bgT * (3 - 2 * bgT);
        }
        var bgPTx = clamp((cameraState.phi - 0.55) * 0.42 - bgPointerX * 0.62, -1, 1);
        var bgPTy = clamp((cameraState.theta - 0.82) * 0.55 - bgPointerY * 0.62, -1, 1);
        var bgPk = 1 - Math.exp(-dt * 2.6);
        bgParX += (bgPTx - bgParX) * bgPk;
        bgParY += (bgPTy - bgParY) * bgPk;

        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

        // 深空星场：去掉相机平移，相当于无穷远天幕；
        // 各层（星云罩 / 远 / 中 / 近星 / 亮核星云）以不同角速度缓慢漂移。
        // 页面本身不可滚动，因此把「随滚动产生的视差」映射为指针位置与相机环绕增量：
        // 每层按 par 系数沿相机右/上方向平移，越近的层位移越大，形成递进的深度感
        var bgTx = viewMatrix[12], bgTy = viewMatrix[13], bgTz = viewMatrix[14];
        viewMatrix[12] = 0;
        viewMatrix[13] = 0;
        viewMatrix[14] = 0;
        if (bgReveal > 0.001) {
            for (var sl = 0; sl < starLayers.length; sl++) {
                var lyr = starLayers[sl];
                if (!lyr.geom) continue;
                rotationY(starModel, time * lyr.spin);
                var pxs = bgParX * lyr.par, pys = bgParY * lyr.par;
                bgOffset[0] = camRight[0] * pxs + camUp[0] * pys;
                bgOffset[1] = camRight[1] * pxs + camUp[1] * pys;
                bgOffset[2] = camRight[2] * pxs + camUp[2] * pys;
                // 天幕在相机外侧（facing 恒为负），必须关闭轮廓淡出，否则整层会被裁成透明
                drawPoints(lyr.geom, {
                    model: starModel, sizeScale: 2150, maxSize: lyr.maxSize,
                    opacity: lyr.opacity * bgReveal, twinkle: lyr.twinkle,
                    soft: lyr.soft, edgeFade: 0, offset: bgOffset
                });
            }
        }
        viewMatrix[12] = bgTx;
        viewMatrix[13] = bgTy;
        viewMatrix[14] = bgTz;

        // 真实星座天球（还原原「粒子地球」）：环绕地球的主星与连线，远半球可见
        var ebDist = Math.max(Math.hypot(camEye[0] - earthBody.pos[0], camEye[1] - earthBody.pos[1], camEye[2] - earthBody.pos[2]), 1);
        var cbDiskR = 0;
        if (viewMode !== 'stars') {
            var cbr = clamp(earthBody.dispR * 1.12 / ebDist, 0.02, 0.999);
            cbDiskR = Math.tan(Math.asin(cbr)) / Math.tan(CONFIG.fov * Math.PI / 360);
        }
        // 天球在屏幕上过小时（全视远景）不绘制，避免地球旁出现一圈白色噪点
        var globePxNow = (constR / ebDist) * (window.innerHeight * 0.5) / Math.tan(CONFIG.fov * Math.PI / 360);
        var constellationOn = starFade > 0.01 && earthFocusFade > 0.01 && globePxNow > 30;
        if (constellationOn) {
            drawPoints(constellationDots, {
                model: constModel, sizeScale: 70, maxSize: 4.5,
                opacity: 0.60 * starFade * earthFocusFade, twinkle: 0.03,
                cull: -1, disk: cbDiskR > 0, diskR: cbDiskR,
                scatter: scatter * 0.55, scatterAmp: constR * 0.16
            });
            drawPoints(constellationStars, {
                model: constModel, sizeScale: 68, maxSize: 8,
                opacity: 0.70 * starFade * earthFocusFade, twinkle: 0.12,
                cull: -1, disk: cbDiskR > 0, diskR: cbDiskR,
                scatter: scatter * 0.55, scatterAmp: constR * 0.16
            });
        }

        // 星球模式下所有天体整体淡出；聚焦某个星球时只移动相机，其他星球照常可见
        var otherFade = planetFade;

        // 太阳：多层辉光 + 日冕（加色、无深度，实体球随后覆盖中心）
        // 近景收缩辉光，避免柔光把粒子糊成白团；远景保留光晕
        var sunDist = Math.max(Math.hypot(camEye[0] - SUN.pos[0], camEye[1] - SUN.pos[1], camEye[2] - SUN.pos[2]), 1);
        var sunGlow = clamp((sunDist / SUN.dispR - 1.7) / 3.0, 0.10, 1.0);
        if (otherFade > 0.01) {
            // 动态光晕：三层辉光 + 最外层弥散 bloom 的亮度与半径都以不同相位缓慢呼吸，
            // 幅度控制在 ±20% 以内，观感是「太阳在燃烧」而不是闪烁
            var glowBreath = 1 + 0.16 * Math.sin(time * 1.15) + 0.06 * Math.sin(time * 2.3 + 1.2);
            drawBillboard(zeroTarget, camRight, camUp, SUN.dispR * 8.4 * (1 + 0.05 * Math.sin(time * 0.7)), [0.96, 0.30, 0.10], 0.045 * otherFade * sunGlow * glowBreath, 0);
            drawBillboard(zeroTarget, camRight, camUp, SUN.dispR * 7.2 * (1 + 0.04 * Math.sin(time * 0.9 + 0.8)), [1.0, 0.42, 0.14], 0.08 * otherFade * sunGlow * glowBreath, 0);
            drawBillboard(zeroTarget, camRight, camUp, SUN.dispR * 3.6 * (1 + 0.05 * Math.sin(time * 1.35 + 1.4)), [1.0, 0.62, 0.24], 0.18 * otherFade * sunGlow * glowBreath, 0);
            drawBillboard(zeroTarget, camRight, camUp, SUN.dispR * 1.9 * (1 + 0.06 * Math.sin(time * 1.9 + 2.2)), [1.0, 0.84, 0.5], 0.32 * otherFade * sunGlow * glowBreath, 0);
            // 光线投射：两道互相垂直的拉长柔光，让太阳向外的光有明显方向感（仅 +2 个面片）
            var rayA = SUN.dispR * 7.4 * (1 + 0.09 * Math.sin(time * 0.77 + 0.3));
            var rayB = SUN.dispR * 6.2 * (1 + 0.09 * Math.sin(time * 0.63 + 1.9));
            rayRight[0] = camRight[0] * 2.5; rayRight[1] = camRight[1] * 2.5; rayRight[2] = camRight[2] * 2.5;
            drawBillboard(zeroTarget, rayRight, camUp, rayA, [1.0, 0.62, 0.28], 0.030 * otherFade * sunGlow * glowBreath, 0);
            rayUp[0] = camUp[0] * 2.5; rayUp[1] = camUp[1] * 2.5; rayUp[2] = camUp[2] * 2.5;
            drawBillboard(zeroTarget, camRight, rayUp, rayB, [1.0, 0.58, 0.24], 0.024 * otherFade * sunGlow * glowBreath, 0);
            rotationY(tmpModel, time * SUN.spin * 0.6);
            // 日冕粒子层：整体透明度与尺寸缓慢呼吸，模拟等离子涨落
            var coronaBreath = 0.86 + 0.28 * Math.sin(time * 1.15 + 0.6);
            drawPoints(coronaGeom, {
                model: tmpModel, sizeScale: SUN.dispR * 18 * (1 + 0.06 * Math.sin(time * 1.15)), maxSize: 6,
                opacity: 0.12 * coronaBreath * otherFade, shade: false, cull: false
            });
            // 日珥 / 耀斑喷发：粒子沿弧线升起再回落，逐帧更新位置与热度
            updateFlares(dt);
            drawPoints(flareGeom, {
                model: tmpModel, sizeScale: SUN.dispR * 11, maxSize: 5,
                opacity: (0.34 + 0.12 * Math.sin(time * 2.1)) * otherFade,
                shade: false, cull: false, soft: 1
            });
        }

        // 全部天体统一以粒子球呈现：无深度测试，靠背面剔除保证只看到朝向相机的一层
        gl.disable(gl.DEPTH_TEST);
        gl.depthMask(false);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        var PS = 5.5; // 参考粒子地球：细颗粒、高密度，接近原页 3px 点径的视觉效果

        rotationY(tmpModel, time * SUN.spin);
        normalMat3(tmpNormal, tmpModel);
        var sunS0 = SUN.dispR * PS / Math.max(Math.hypot(camEye[0], camEye[1], camEye[2]), 1);
        // 光球自身极轻微的热胀冷缩（±1.8% 尺寸 / ±3% 亮度），与辉光脉动同相位但不同幅度
        var sunBreath = Math.sin(time * 1.15 + 0.4);
        var sunHov = (fxHoverBody === SUN) ? fxHoverAmt : 0;
        var sunPul = (fxPulseBody === SUN) ? fxPulse : 0;
        if (otherFade > 0.01) drawPoints(SUN.geom, {
            model: tmpModel, normal: tmpNormal, light: SUN.light,
            sizeScale: SUN.dispR * PS * (1 + 0.018 * sunBreath + 0.022 * sunHov + 0.070 * sunPul),
            maxSize: 4,
            opacity: pointAlpha(0.55, sunS0, 4) * otherFade * (1 + 0.03 * sunBreath + 0.10 * sunHov + 0.22 * sunPul),
            shade: false, cull: true,
            scatter: scatter * 0.9, scatterAmp: SUN.dispR
        });

        for (var i = 0; i < PLANETS.length; i++) {
            var p = PLANETS[i];
            rotationZ(tmpM1, p.tilt);
            rotationY(tmpM2, p.spinAngle);
            multiply(tmpModel, tmpM1, tmpM2);
            normalMat3(tmpNormal, tmpModel);
            var isEarth = p.id === 'earth';
            var isJupiter = p.id === 'jupiter';
            var bodyFade = planetFade;
            // 交互系数：悬停微放大、选中脉冲、选中态长期轻微增益
            var mat = isEarth ? null : planetMat(p);
            var hov = (fxHoverBody === p) ? fxHoverAmt : 0;
            var pul = (fxPulseBody === p) ? fxPulse : 0;
            var selK = (selected === p || followBody === p) ? 1 : 0;
            // 点径按投影尺寸自适应：远景被最小点径撑大、近景被上限压缩时都做亮度补偿，
            // 让加色叠加的表面亮度在任意距离保持一致，既不过曝也不稀疏
            var bd = Math.hypot(camEye[0] - p.pos[0], camEye[1] - p.pos[1], camEye[2] - p.pos[2]);
            var s0 = p.dispR * PS / Math.max(bd, 1);
            if (bodyFade > 0.01) {
                if (isEarth) {
                    // 地球地表：逐参数对齐参考站点（尺寸 660/118、柔核、轮廓淡出 30/118、无镜面）
                    drawPoints(p.geom, {
                        model: tmpModel, normal: tmpNormal, offset: p.pos, light: p.light,
                        sizeScale: p.dispR * (660 / 118), maxSize: 16,
                        minDist: p.dispR * (30 / 118),
                        opacity: (0.95 - 0.35 * scatter) * bodyFade,
                        highlight: 0.09, soft: 2, edgeFade: 118 / 30,
                        shade: true, cull: true, atmo: true,
                        scatter: scatter * 0.9, scatterAmp: p.dispR
                    });
                } else {
                    // 球缘大气光晕：两层球壳 billboard（中心透明），紧贴球缘最亮、向外柔和衰减。
                    // 亮度随「相机是否在受光侧」变化，夜面几乎无光晕，符合物理直觉
                    var toEyeX = (camEye[0] - p.pos[0]) / Math.max(bd, 1);
                    var toEyeY = (camEye[1] - p.pos[1]) / Math.max(bd, 1);
                    var toEyeZ = (camEye[2] - p.pos[2]) / Math.max(bd, 1);
                    var dayK = 0.26 + 0.74 * clamp(
                        toEyeX * p.light[0] + toEyeY * p.light[1] + toEyeZ * p.light[2], 0, 1);
                    // 远景时点径被压到亚像素、星体自身变暗，光晕需同步衰减，
                    // 否则小星球会只剩一圈亮环、看起来像空心气泡
                    var dk = clamp(s0, 0.0, 1.0);
                    var haloGain = bodyFade * dayK * (0.82 + 0.62 * selK)
                        * (1 + 1.35 * hov) * (1 + 1.6 * pul) * (0.12 + 0.88 * dk * dk);
                    var haloWide = mat.haloAmt * 0.30 * haloGain;
                    var haloTight = mat.haloAmt * 0.40 * haloGain;
                    var haloZoom = 1 + 0.020 * hov + 0.070 * pul;
                    if (haloWide > 0.004) {
                        drawBillboard(p.pos, camRight, camUp, p.dispR * 1.44 * haloZoom,
                            mat.halo, haloWide, 2, 0.695);
                    }
                    if (haloTight > 0.004) {
                        drawBillboard(p.pos, camRight, camUp, p.dispR * 1.16 * haloZoom,
                            mat.halo, haloTight, 2, 0.862);
                    }
                    // 表面材质：同类行星共享配色/反照基调，个体再微调；
                    // 选中与悬停只放大点径与亮度，不改几何，避免破坏球体形态
                    drawPoints(p.geom, {
                        model: tmpModel, normal: tmpNormal, offset: p.pos, light: p.light,
                        sizeScale: p.dispR * PS * (1 + 0.028 * hov + 0.085 * pul), maxSize: 7,
                        opacity: pointAlpha(isJupiter ? 0.74 : mat.opacity, s0, 7) * bodyFade
                            * (1 + 0.10 * selK + 0.16 * hov + 0.30 * pul),
                        highlight: 0.05, sheen: mat.sheen,
                        shade: true, cull: true, amb: mat.amb,
                        rim: mat.rim, haze: mat.haze,
                        scatter: scatter, scatterAmp: p.dispR
                    });
                }
            }

            if (p.moons) {
                for (var k = 0; k < p.moons.length; k++) {
                    var mn = p.moons[k];
                    rotationZ(tmpM1, mn.tilt || 0.15);
                    rotationY(tmpM2, time * 0.18 + (mn.angle0 || 0));
                    multiply(tmpModel, tmpM1, tmpM2);
                    normalMat3(tmpNormal, tmpModel);
                    var mbd = Math.hypot(camEye[0] - mn.pos[0], camEye[1] - mn.pos[1], camEye[2] - mn.pos[2]);
                    // 卫星绕到母星背面时进入本影/半影，整体压暗，明暗层次随之成立
                    var mDim = shadowDim(p.pos, p.dispR * 1.02, mn.pos, mn.light);
                    if (planetFade > 0.01) drawPoints(mn.geom, {
                        model: tmpModel, normal: tmpNormal, offset: mn.pos, light: mn.light,
                        sizeScale: Math.max(mn.dispR * 70, 14), maxSize: 6,
                        opacity: 0.60 * planetFade, dim: mDim,
                        shade: true, cull: true, amb: 0.55,
                        scatter: scatter, scatterAmp: mn.dispR
                    });
                }
            }
        }

        // 选中冲击波：从球缘向外扩散的薄环，对行星 / 太阳 / 卫星一视同仁
        if (fxShock > 0 && fxShockBody) {
            var sr = fxShockBody.dispR || 1;
            var sk = fxShock * fxShock;
            drawBillboard(fxShockBody.pos, camRight, camUp,
                sr * (1.05 + 1.30 * (1 - fxShock)),
                SHOCK_COLOR, 0.62 * sk * planetFade, 1, 0.9);
        }

        // 地球专属（严格对齐参考站点）：大气光晕 → 双层云 → 大洲边界
        var earth = PLANETS[2];
        var earthLocalFade = planetFade;
        rotationZ(tmpM1, earth.tilt);
        rotationY(tmpM2, earth.spinAngle);
        multiply(tmpModel, tmpM1, tmpM2);
        normalMat3(tmpNormal, tmpModel);
        var ebd = Math.max(Math.hypot(camEye[0] - earth.pos[0], camEye[1] - earth.pos[1], camEye[2] - earth.pos[2]), 1);
        if (earthLocalFade > 0.01) {
            // 大气层只跟随地轴倾角，散开阶段更早消失，避免尘埃里还挂着一个光球
            var atmVis = clamp((earthLocalFade - 0.35) / 0.65, 0, 1);
            rotationZ(tmpM1, earth.tilt);
            normalMat3(tmpNormal, tmpM1);
            drawAtmosphere(earth.atmosGeom, {
                model: tmpM1, normal: tmpNormal, offset: earth.pos, light: earth.light,
                color: EARTH_ATMOS_COLOR, intensity: 1.08 * atmVis
            });

            // 云层自转略快于地表：地轴倾角 × (自转角速度 ×1.2)，持续缓慢漂移
            rotationZ(tmpM1, earth.tilt);
            rotationY(tmpM2, time * earth.spin * 1.2 + earth.spinPhase);
            multiply(tmpModel, tmpM1, tmpM2);
            normalMat3(tmpNormal, tmpModel);
            var cloudMin = earth.dispR * (30 / 118);
            // 低层厚积云：压在地表之上缓慢漂移
            drawPoints(earth.cloudDenseGeom, {
                model: tmpModel, normal: tmpNormal, offset: earth.pos, light: earth.light,
                sizeScale: earth.dispR * (660 / 118), maxSize: 19, minDist: cloudMin,
                opacity: (0.42 + 0.03 * Math.sin(time * 0.35)) * (1 - 0.5 * scatter) * earthLocalFade,
                twinkle: 0.07, shade: true, cull: true, amb: 1.0, highlight: 0.04, soft: 2, edgeFade: 118 / 30,
                scatter: scatter * 0.95, scatterAmp: earth.dispR, diffSpin: cloudDrift
            });
            // 高层薄卷云：更快的差速让上下云带持续错位，云层厚度与层次一览可见
            drawPoints(earth.cloudWispyGeom, {
                model: tmpModel, normal: tmpNormal, offset: earth.pos, light: earth.light,
                sizeScale: earth.dispR * (640 / 118), maxSize: 15, minDist: cloudMin,
                opacity: (0.24 + 0.04 * Math.sin(time * 0.27 + 1.1)) * (1 - 0.5 * scatter) * earthLocalFade,
                twinkle: 0.10, shade: true, cull: true, amb: 1.0, highlight: 0.05, soft: 2, edgeFade: 118 / 30,
                scatter: scatter, scatterAmp: earth.dispR, diffSpin: cloudDrift * 1.45
            });

            // 大洲边界：外层柔光 + 内核锐线，缩放时都清晰；随地表自转，不受云层遮挡
            rotationZ(tmpM1, earth.tilt);
            rotationY(tmpM2, earth.spinAngle);
            multiply(tmpModel, tmpM1, tmpM2);
            normalMat3(tmpNormal, tmpModel);
            var bOp = (0.95 - 0.6 * scatter) * earthLocalFade;
            var bSize = 2.2 * clamp(Math.sqrt(Math.max(earth.dispR * 2.4, 12) / ebd), 0.72, 1.22);
            var bMin = earth.dispR * (24 / 118);
            var bSpan = earth.dispR * (26 / 118);
            drawBoundaries(earth.boundaryGeom, {
                model: tmpModel, normal: tmpNormal, offset: earth.pos, light: earth.light,
                opacity: bOp * 0.36, baseSize: bSize * 2.0,
                cullZ: -ebd, minDist: bMin, fadeSpan: bSpan,
                scatter: scatter * 0.9, scatterAmp: earth.dispR
            });
            drawBoundaries(earth.boundaryGeom, {
                model: tmpModel, normal: tmpNormal, offset: earth.pos, light: earth.light,
                opacity: bOp * 0.9, baseSize: bSize,
                cullZ: -ebd, minDist: bMin, fadeSpan: bSpan,
                scatter: scatter * 0.9, scatterAmp: earth.dispR
            });
        }

        // 土星环：粒子加色，与球体共用同一倾角
        var saturn = PLANETS[5];
        rotationZ(tmpM1, saturn.tilt);
        var rs0 = saturn.dispR * 30 / Math.max(Math.hypot(camEye[0] - saturn.pos[0], camEye[1] - saturn.pos[1], camEye[2] - saturn.pos[2]), 1);
        if (planetFade > 0.01) drawPoints(ringsGeom, {
            model: tmpM1, offset: saturn.pos, light: saturn.light,
            sizeScale: saturn.dispR * 30, maxSize: 7,
            opacity: pointAlpha(0.18, rs0, 7) * planetFade,
            // 行星本影：土星把太阳光挡住，环在背光侧的对应扇区因此变暗
            shadowC: saturn.pos, shadowR: saturn.dispR * 1.0,
            // 环形粒子盘不做轮廓淡出：环本来就是扁平圆盘，约一半粒子 facing<0，
            // 若参与淡出会被判成背面而整层消失，只剩一小段可见
            shade: false, cull: false, edgeFade: -1,
            scatter: scatter * 0.7, scatterAmp: saturn.dispR * 2
        });

        // 交互迸发粒子：与其它粒子同样走加色混合，单 draw call
        drawBurst();

        // 行星公转轨道线：选中地球观察时淡出，避免横线穿过地球盘面（对齐参考站纯净画面）
        var orbitOpacity = (0.13 + 0.22 * orbitBright) * planetFade * (1 - earthFocusFade);
        for (var oi = 0; oi < PLANETS.length; oi++) {
            drawLines(PLANETS[oi].orbitGeom, {
                model: identityMatrix,
                opacity: orbitOpacity
            });
        }

        // 卫星轨道线：聚焦母星时更清晰，全视时不喧宾夺主
        for (var pi = 0; pi < PLANETS.length; pi++) {
            var pp = PLANETS[pi];
            if (!pp.moons) continue;
            var nearParent = (followBody === pp);
            for (var mi = 0; mi < pp.moons.length; mi++) {
                var mm = pp.moons[mi];
                identity(tmpM1);
                tmpM1[0] = mm.orbitR;
                tmpM1[5] = mm.orbitR * mm.incl;
                tmpM1[10] = mm.orbitR;
                drawLines(moonOrbitGeom, {
                    model: tmpM1,
                    offset: pp.pos,
                    opacity: (pp === selected ? (nearParent ? 0.34 : 0.2) : (nearParent ? 0.34 : 0.08)) * planetFade * (1 - earthFocusFade)
                });
            }
        }

        gl.depthMask(true);
        gl.disable(gl.DEPTH_TEST);

        updateLabels();
        updateStarLabels(dt);

        if (!firstFrameDone) {
            firstFrameDone = true;
            tryReveal();
        }
    }

    // ==========================================
    // 10. 天体标签与信息面板
    // ==========================================
    var labelItems = [];

    function buildLabels() {
        for (var i = 0; i < BODY_LIST.length; i++) {
            (function (b) {
                var el = document.createElement('button');
                el.type = 'button';
                el.className = 'body-label';
                var dot = document.createElement('i');
                var span = document.createElement('span');
                span.textContent = b.name;
                el.appendChild(dot);
                el.appendChild(span);
                el.addEventListener('click', function () {
                    focusBody(b);
                });
                labelsEl.appendChild(el);
                labelItems.push({ body: b, el: el, dy: b.isSun ? 0 : (i % 2 ? 13 : -13) });
            })(BODY_LIST[i]);
        }
    }

    function projectPoint(x, y, z) {
        var v = viewMatrix;
        var vx = v[0] * x + v[4] * y + v[8] * z + v[12];
        var vy = v[1] * x + v[5] * y + v[9] * z + v[13];
        var vz = v[2] * x + v[6] * y + v[10] * z + v[14];
        var vw = v[3] * x + v[7] * y + v[11] * z + v[15];
        var p = projMatrix;
        var cx = p[0] * vx + p[4] * vy + p[8] * vz + p[12] * vw;
        var cy = p[1] * vx + p[5] * vy + p[9] * vz + p[13] * vw;
        var cw = p[3] * vx + p[7] * vy + p[11] * vz + p[15] * vw;
        if (cw <= 0.0001) return null;
        var nx = cx / cw, ny = cy / cw;
        if (nx < -1.25 || nx > 1.25 || ny < -1.25 || ny > 1.25) return null;
        return {
            x: (nx * 0.5 + 0.5) * window.innerWidth,
            y: (0.5 - ny * 0.5) * window.innerHeight
        };
    }

    function updateLabels() {
        for (var i = 0; i < labelItems.length; i++) {
            var item = labelItems[i];
            var b = item.body;
            // 星座模式下星球整体淡出；其余情况下所有天体标签照常可见
            if (planetFade < 0.5) {
                item.el.style.opacity = '0';
                item.el.style.pointerEvents = 'none';
                continue;
            }
            var pt = projectPoint(b.pos[0], b.pos[1], b.pos[2]);
            if (!pt) {
                item.el.style.opacity = '0';
                item.el.style.pointerEvents = 'none';
                continue;
            }
            var dy = (selected === b || followBody === b) ? 0 : item.dy;
            item.el.style.left = pt.x.toFixed(1) + 'px';
            item.el.style.top = (pt.y + dy).toFixed(1) + 'px';
            item.el.style.opacity = (selected === b || followBody === b) ? '1' : '0.82';
            item.el.style.pointerEvents = 'auto';
            item.el.classList.toggle('active', selected === b);
        }
    }

    function showInfo(ref) {
        var prefix = ref.isMoon ? ('卫星 · 绕' + ref.parent.name + '运行') : ref.type;
        infoEl.hidden = false;
        infoNameEl.textContent = ref.name;
        infoEnEl.textContent = ref.en;
        infoMetaEl.textContent = prefix + ' · ' + ref.info;
    }

    function focusBody(ref) {
        if (viewMode === 'stars') setViewMode('both');
        selected = ref;
        followBody = ref;
        // 土星需要更远的观察距离：外环半径达 2.2R，若沿用 2.4R 的通用距离，
        // 环外缘会超出视口被裁掉，看起来只剩一小段
        camGoal.dist = ref.isSun ? 80 : (ref.isMoon ? Math.max(ref.dispR * 10, 12)
            : (ref.id === 'saturn' ? Math.max(ref.dispR * 5.0, 12) : Math.max(ref.dispR * 2.4, 12)));
        // 聚焦行星时把相机放到向阳一侧：始终以受光面为主，避免随机公转位置导致整颗星球落在夜面
        if (!ref.isSun) {
            var sd = ref.light;
            var sy = clamp(sd[1], -1, 1);
            camGoal.theta = clamp(Math.acos(sy), 0.35, Math.PI - 0.35);
            camGoal.phi = Math.atan2(sd[0], sd[2]) + 0.75;
        }
        orbitGoal = 0.4;
        cameraState.zoomVelocity = 0;
        showInfo(ref);
        updateEarthPanel();
        overviewBtn.classList.remove('active');
        overviewBtn.setAttribute('aria-pressed', 'false');
        searchInputEl.value = ref.name;
        searchClearEl.style.display = 'block';
        hideSearchResults();
        triggerSelectFx(ref);
    }

    function setOverview() {
        // 全视视角必须恢复完整太阳系，避免从星座模式进入时只看到星空
        if (viewMode !== 'both') setViewMode('both');
        selected = null;
        followBody = null;
        camGoal.dist = overviewDist();
        camGoal.theta = 0.82;
        camGoal.phi = 0.55;
        orbitGoal = 1;
        cameraState.zoomVelocity = 0;
        infoEl.hidden = true;
        updateEarthPanel();
        searchInputEl.value = '';
        searchClearEl.style.display = 'none';
        hideSearchResults();
        overviewBtn.classList.add('active');
        overviewBtn.setAttribute('aria-pressed', 'true');
    }

    // ==========================================
    // 11. 顶部搜索
    // ==========================================
    var searchEntries = [];
    var searchHits = [];
    var activeHit = -1;

    function buildSearchEntries() {
        searchEntries.push({ name: SUN.name, en: SUN.en, sub: '恒星', ref: SUN, order: -1 });
        for (var i = 0; i < PLANETS.length; i++) {
            var p = PLANETS[i];
            searchEntries.push({
                name: p.name, en: p.en, ref: p, order: i,
                sub: p.type + ' · ' + p.au.toFixed(2) + ' AU'
            });
            for (var j = 0; j < p.moons.length; j++) {
                var m = p.moons[j];
                searchEntries.push({
                    name: m.name, en: m.en, ref: m, order: 20 + i,
                    sub: '卫星 · ' + p.name
                });
            }
        }
    }

    function hideSearchResults() {
        searchResultsEl.hidden = true;
        searchInputEl.setAttribute('aria-expanded', 'false');
        activeHit = -1;
    }

    function renderSearchResults(hits) {
        searchResultsEl.innerHTML = '';
        if (!hits.length) {
            var empty = document.createElement('div');
            empty.className = 'search-empty';
            empty.textContent = '没有找到匹配的天体';
            searchResultsEl.appendChild(empty);
        } else {
            for (var i = 0; i < hits.length; i++) {
                (function (entry, index) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.setAttribute('role', 'option');
                    var name = document.createElement('span');
                    name.className = 'rs-name';
                    name.textContent = entry.name;
                    var em = document.createElement('em');
                    em.textContent = entry.en;
                    name.appendChild(em);
                    var sub = document.createElement('span');
                    sub.className = 'rs-sub';
                    sub.textContent = entry.sub;
                    btn.appendChild(name);
                    btn.appendChild(sub);
                    btn.addEventListener('click', function () {
                        chooseSearchHit(entry);
                    });
                    searchResultsEl.appendChild(btn);
                })(hits[i], i);
            }
        }
        searchResultsEl.hidden = false;
        searchInputEl.setAttribute('aria-expanded', 'true');
        activeHit = hits.length ? 0 : -1;
        refreshActiveHit();
    }

    function refreshActiveHit() {
        var btns = searchResultsEl.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', i === activeHit);
        }
    }

    function chooseSearchHit(entry) {
        focusBody(entry.ref);
    }

    function updateSearch() {
        var q = searchInputEl.value.trim().toLowerCase();
        searchClearEl.style.display = q ? 'block' : 'none';
        if (!q) {
            hideSearchResults();
            return;
        }
        var hits = [];
        for (var i = 0; i < searchEntries.length; i++) {
            var e = searchEntries[i];
            var name = e.name.toLowerCase();
            var en = e.en.toLowerCase();
            var score = -1;
            if (name.indexOf(q) === 0 || en.indexOf(q) === 0) score = 0;
            else if (name.indexOf(q) > -1 || en.indexOf(q) > -1) score = 1;
            if (score >= 0) hits.push({ entry: e, score: score, order: e.order });
        }
        hits.sort(function (a, b) {
            if (a.score !== b.score) return a.score - b.score;
            return a.order - b.order;
        });
        searchHits = hits.slice(0, 8).map(function (h) { return h.entry; });
        renderSearchResults(searchHits);
    }

    function moveActiveHit(dir) {
        if (!searchHits.length) return;
        activeHit = (activeHit + dir + searchHits.length) % searchHits.length;
        refreshActiveHit();
    }

    function setupSearch() {
        searchInputEl.addEventListener('input', updateSearch);
        searchInputEl.addEventListener('focus', function () {
            if (searchInputEl.value.trim()) updateSearch();
        });
        searchInputEl.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveActiveHit(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveActiveHit(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (searchHits.length) chooseSearchHit(searchHits[activeHit >= 0 ? activeHit : 0]);
            } else if (e.key === 'Escape') {
                hideSearchResults();
                searchInputEl.blur();
            }
        });
        searchClearEl.addEventListener('click', function () {
            searchInputEl.value = '';
            searchClearEl.style.display = 'none';
            hideSearchResults();
            searchInputEl.focus();
        });
        document.addEventListener('pointerdown', function (e) {
            if (!searchPanelEl.contains(e.target)) hideSearchResults();
        }, true);
    }

    // ==========================================
    // 12. 鼠标 / 触摸交互（保留原有操作逻辑）
    // ==========================================
    function setupPointer() {
        var pointers = {};
        var lastPinch = 0;
        // 轻点识别：按下与抬起位移小于 6px 视为「点击天体」，与拖拽环绕区分
        var tapStart = null;

        function pinchDistance() {
            var ids = Object.keys(pointers);
            if (ids.length < 2) return 0;
            var a = pointers[ids[0]], b = pointers[ids[1]];
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function applyZoom(value) {
            cameraState.radius = clamp(value, minDistNow(), CONFIG.maxDistance);
            camGoal.dist = cameraState.radius;
            cameraState.zoomVelocity = 0;
        }

        // 指针位置 → 天幕视差的原始输入（归一化到 -1..1）；
        // 触摸设备不参与，避免拖拽时指针量反复跳变
        window.addEventListener('pointermove', function (e) {
            if (e.pointerType === 'touch') return;
            bgPointerX = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
            bgPointerY = (e.clientY / Math.max(1, window.innerHeight)) * 2 - 1;
            // 未按下拖拽时持续做屏幕空间拾取，实现「靠近」高亮
            if (e.target === canvas && !tapStart) {
                setHoverBody(pickBody(e.clientX, e.clientY));
            }
        }, { passive: true });

        canvas.addEventListener('pointerdown', function (e) {
            pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (Object.keys(pointers).length === 1) {
                tapStart = { id: e.pointerId, x: e.clientX, y: e.clientY };
            }
            if (canvas.setPointerCapture) {
                try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            }
            lastPinch = pinchDistance();
        });

        canvas.addEventListener('pointermove', function (e) {
            var p = pointers[e.pointerId];
            if (!p) return;
            var dx = e.clientX - p.x;
            var dy = e.clientY - p.y;
            p.x = e.clientX;
            p.y = e.clientY;
            if (tapStart && tapStart.id === e.pointerId &&
                Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 6) {
                tapStart.moved = true;
            }

            if (Object.keys(pointers).length > 1) {
                var d = pinchDistance();
                if (lastPinch > 0 && d > 0) {
                    applyZoom(cameraState.radius * (lastPinch / d));
                }
                lastPinch = d;
                return;
            }

            cameraState.phi -= dx * 0.0055;
            cameraState.theta = clamp(cameraState.theta - dy * 0.0055, 0.18, Math.PI - 0.18);
            camGoal.phi = cameraState.phi;
            camGoal.theta = cameraState.theta;
        });

        function removePointer(e) {
            delete pointers[e.pointerId];
            lastPinch = pinchDistance();
        }
        canvas.addEventListener('pointerup', function (e) {
            if (tapStart && tapStart.id === e.pointerId) {
                if (!tapStart.moved) {
                    var hit = pickBody(e.clientX, e.clientY);
                    if (hit) focusBody(hit);   // focusBody 内部会触发完整冲击反馈
                }
                tapStart = null;
            }
            removePointer(e);
        });
        canvas.addEventListener('pointercancel', function (e) {
            if (tapStart && tapStart.id === e.pointerId) tapStart = null;
            removePointer(e);
        });
        // 指针离开画布时取消悬停高亮，避免光标与光晕滞留
        canvas.addEventListener('pointerleave', function () {
            if (!tapStart) setHoverBody(null);
        });

        canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            var factor = Math.exp(clamp(e.deltaY, -240, 240) * 0.0012);
            applyZoom(cameraState.radius * factor);
        }, { passive: false });
    }

    // ==========================================
    // 13. 界面与进入方式
    // ==========================================
    function setInstruction(html) {
        if (instructionEl) instructionEl.innerHTML = html;
    }

    function setControlMode(mode, message) {
        controlMode = mode;
        // 切换控制方式时重置旋转基准与环绕速度，重新识别时从当前手掌姿态起算
        handRollBase = null;
        handRotationTarget = 0;
        handOrbitVel = 0;
        if (mode === 'mouse') {
            setInstruction(MOUSE_HELP);
            statusEl.style.display = 'none';
            if (message) {
                statusEl.style.display = '';
                statusEl.textContent = message;
                statusEl.style.color = '#ff9b6b';
                setTimeout(function () {
                    if (controlMode === 'mouse') statusEl.style.display = 'none';
                }, 5200);
            }
        } else {
            setInstruction(HAND_HELP);
            statusEl.style.display = '';
            statusEl.textContent = '正在开启妙手控制…';
            statusEl.style.color = '#7c8da3';
        }
    }

    function openEntryModal() {
        if (!modalEl) {
            setControlMode('mouse');
            return;
        }
        stepModeEl.hidden = false;
        stepCameraEl.hidden = true;
        modalEl.hidden = false;
        requestAnimationFrame(function () { modalEl.classList.add('is-open'); });
        // 用户选择进入方式时后台预热手势模型，点“妙手控制”后无需再等下载
        setTimeout(warmupGesture, 300);
    }

    function closeEntryModal() {
        if (!modalEl) return;
        modalEl.classList.remove('is-open');
        setTimeout(function () { modalEl.hidden = true; }, 320);
    }

    function setupUI() {
        setupSearch();
        overviewBtn.addEventListener('click', setOverview);
        var modeBtns = document.querySelectorAll('.view-mode-btn');
        for (var vi = 0; vi < modeBtns.length; vi++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    setViewMode(btn.getAttribute('data-view'));
                });
            })(modeBtns[vi]);
        }
        var earthBtns = document.querySelectorAll('.earth-mode-btn');
        for (var ei = 0; ei < earthBtns.length; ei++) {
            (function (btn) {
                btn.addEventListener('click', function () {
                    setViewMode(btn.getAttribute('data-view'));
                });
            })(earthBtns[ei]);
        }
        buildStarLabels();
        setViewMode('both');
        updateEarthPanel();

        document.getElementById('mode-mouse').addEventListener('click', function () {
            setControlMode('mouse');
            closeEntryModal();
        });
        document.getElementById('mode-hand').addEventListener('click', function () {
            stepModeEl.hidden = true;
            stepCameraEl.hidden = false;
        });
        document.getElementById('camera-back').addEventListener('click', function () {
            stepCameraEl.hidden = true;
            stepModeEl.hidden = false;
        });
        document.getElementById('camera-allow').addEventListener('click', function () {
            closeEntryModal();
            setControlMode('hand');
            initGesture();
        });

        setControlMode('mouse');
    }

    // 首帧回调已并入 tryReveal（见第 7 节 分阶段构建）

    // ==========================================
    // 14. 手势控制（太阳系就绪后才加载）
    // ==========================================
    var previewCanvas = document.getElementById('webcam-preview');
    var previewCtx = previewCanvas.getContext('2d');
    previewCanvas.width = 160;
    previewCanvas.height = 120;
    var videoElement = document.getElementById('input-video');
    var hands = null;
    var cameraStream = null;
    var previewLoopActive = false;
    var lastLandmarks = null;
    var smoothCache = null;         // 平滑后的 21 个关键点
    var lastHandSeenAt = 0;         // 最近一次检测到手的时间
    var lastPreviewDrawAt = 0;      // 预览帧率限制
    var HAND_SMOOTH = 0.6;          // 关键点平滑系数（越大越跟手）
    var HAND_LOST_GRACE = 350;      // 丢手保持时长(ms)，避免偶发漏检导致状态闪烁

    function createHands() {
        hands = new window.Hands({
            locateFile: function (file) {
                // 运行期读取，脚本回退到 jsDelivr 时模型文件同步换线路
                return (window.__mpHandsBase || HANDS_CDN) + file;
            }
        });
        hands.setOptions({
            maxNumHands: 1,
            // lite 模型体积约为 full 的 1/3，首次加载更快，手势判定精度足够
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);
    }

    var gestureWarming = false;
    var warmHintTimer = 0;
    var warmWatchdog = 0;
    var prefetchPromise = null;

    // 模型资源清单（与 locateFile 同源）：预热时并行下载，避免 Emscripten 逐个串行拉取
    var HANDS_ASSETS = [
        'hands_solution_packed_assets_loader.js',
        'hands_solution_packed_assets.data',
        'hands_solution_simd_wasm_bin.js',
        'hands_solution_simd_wasm_bin.wasm',
        'hands.binarypb',
        'hand_landmark_lite.tflite'
    ];

    // 并行预取到浏览器 HTTP 缓存（镜像 max-age 一年），后续 loader 直接命中缓存
    function prefetchHandsAssets() {
        if (prefetchPromise) return prefetchPromise;
        var base = window.__mpHandsBase || HANDS_CDN;
        prefetchPromise = Promise.all(HANDS_ASSETS.map(function (name) {
            return fetch(base + name, { mode: 'cors', credentials: 'omit' }).then(function (res) {
                if (!res.ok) throw new Error(name);
                // 读完即丢弃，不长期占用内存
                return res.arrayBuffer().then(function () { return true; });
            }).catch(function () {
                return false; // 单个资源失败不阻断，回落到 Emscripten 自行加载
            });
        }));
        return prefetchPromise;
    }

    // 等待 MediaPipe 脚本就绪（脚本用 defer 加载，不阻塞首帧）
    function whenLibsReady(timeoutMs) {
        return new Promise(function (resolve, reject) {
            var deadline = performance.now() + (timeoutMs || 10000);
            (function poll() {
                if (window.Hands) return resolve();
                if (performance.now() > deadline) return reject(new Error('mediapipe timeout'));
                setTimeout(poll, 120);
            })();
        });
    }

    // 空闲预热：提前创建实例并跑一次空白推理，触发 wasm/模型初始化。
    // 用户点“妙手控制”时模型已就绪，摄像头一接通即可出结果。
    function warmupGesture() {
        if (hands || gestureInitialized) return;
        // 第一步：不等脚本，立刻并行下载模型文件（下载与脚本加载重叠进行）
        var prefetch = prefetchHandsAssets();
        whenLibsReady(15000).then(function () {
            if (hands || gestureInitialized) return prefetch;
            return prefetch.then(function () {
                if (hands || gestureInitialized) return;
                startWarmup();
            });
        }).catch(function () {
            // 库加载超时：用户点“妙手控制”时 initGesture 会再次等待并提示
        });
    }

    function setWarmupTimers() {
        clearTimeout(warmHintTimer);
        clearTimeout(warmWatchdog);
        warmHintTimer = setTimeout(function () {
            if (gestureWarming) setGestureStatus('手势模型下载较慢，请稍候…', '#ff9b6b');
        }, 6000);
        // 兜底：预热长时间不返回时强制放行，避免界面一直停在“加载中”
        warmWatchdog = setTimeout(function () {
            if (gestureWarming) endWarmup();
        }, 30000);
    }

    function endWarmup() {
        clearTimeout(warmHintTimer);
        clearTimeout(warmWatchdog);
        if (!gestureWarming) return;
        gestureWarming = false;
        if (controlMode === 'hand' && !lastLandmarks) setGestureStatus('等待手势…', '#7c8da3');
    }

    function startWarmup() {
        gestureWarming = true;
        if (!hands) createHands();
        if (controlMode === 'hand' && !lastLandmarks) setGestureStatus('正在加载手势模型…', '#7c8da3');
        setWarmupTimers();
        // 用空白画布跑一次推理，仅用于加载资源，结果由 onResults 忽略
        var c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        c.getContext('2d').fillRect(0, 0, 256, 256);
        hands.send({ image: c }).catch(function () {
        }).then(function () {
            endWarmup();
        });
    }

    // 预览：绘制摄像头画面，并用 MediaPipe 工具库叠加手部骨架
    function drawPreview() {
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        if (videoElement.readyState >= 2) {
            previewCtx.drawImage(videoElement, 0, 0, previewCanvas.width, previewCanvas.height);
        } else {
            previewCtx.fillStyle = '#040a12';
            previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
        }
        if (lastLandmarks && window.drawConnectors && window.drawLandmarks && window.HAND_CONNECTIONS) {
            window.drawConnectors(previewCtx, lastLandmarks, window.HAND_CONNECTIONS, { color: '#5ac8ff', lineWidth: 2 });
            window.drawLandmarks(previewCtx, lastLandmarks, { color: '#ff9b6b', lineWidth: 1, radius: 2 });
        }
        previewCtx.restore();
    }

    // 关键点指数平滑：抑制 MediaPipe 输出的抖动，骨架和旋转都更稳定
    function smoothLandmarks(raw) {
        if (!smoothCache || smoothCache.length !== raw.length) {
            smoothCache = raw.map(function (p) {
                return { x: p.x, y: p.y, z: p.z || 0 };
            });
            return smoothCache;
        }
        for (var i = 0; i < raw.length; i++) {
            var s = smoothCache[i];
            s.x += (raw[i].x - s.x) * HAND_SMOOTH;
            s.y += (raw[i].y - s.y) * HAND_SMOOTH;
            s.z += ((raw[i].z || 0) - s.z) * HAND_SMOOTH;
        }
        return smoothCache;
    }

    // 预览循环：直接画 video 元素，模型未返回时也能看到画面
    function previewLoop() {
        if (!previewLoopActive) return;
        var now = performance.now();
        if (now - lastPreviewDrawAt >= 33) {
            lastPreviewDrawAt = now;
            drawPreview();
        }
        requestAnimationFrame(previewLoop);
    }

    function startPreviewLoop() {
        if (previewLoopActive) return;
        previewCanvas.style.display = 'block';
        previewLoopActive = true;
        lastPreviewDrawAt = 0;
        requestAnimationFrame(previewLoop);
    }

    // 仅在文案/颜色变化时写 DOM，避免每次模型回调都触发布局
    function setGestureStatus(text, color) {
        if (statusEl.textContent !== text) statusEl.textContent = text;
        if (statusEl.style.color !== color) statusEl.style.color = color;
    }

    // 指节索引与距离计算提到回调外，避免每次识别都重复创建
    var FINGER_TIPS = [8, 12, 16, 20];
    var FINGER_MCPS = [5, 9, 13, 17];

    function distSq(p1, p2) {
        var ax = p1.x - p2.x, ay = p1.y - p2.y;
        return ax * ax + ay * ay;
    }

    function onResults(results) {
        if (gestureWarming) return;
        var raw = results.multiHandLandmarks && results.multiHandLandmarks[0];
        var now = performance.now();

        if (raw) {
            // 偶发漏检后重新捕获时重置平滑缓存，避免骨架从旧位置滑过来
            if (now - lastHandSeenAt > HAND_LOST_GRACE) {
                smoothCache = null;
                handRollBase = null;
            }
            lastHandSeenAt = now;

            var landmarks = smoothLandmarks(raw);
            lastLandmarks = landmarks;

            var wrist = landmarks[0];
            var middleBase = landmarks[9];
            var dx = middleBase.x - wrist.x;
            var dy = middleBase.y - wrist.y;
            // 画面坐标系（y 向下）中手掌的滚转角：掌心朝上为 0，顺时针为正
            var palmRoll = Math.atan2(dx, -dy);
            // 首次识别到手时记录基准角，起始姿态不产生任何视角偏移
            if (handRollBase === null) handRollBase = palmRoll;
            // 相对基准角的最短角差 = 手掌左右倾角，交由相机做水平环绕
            var relRoll = palmRoll - handRollBase;
            while (relRoll > Math.PI) relRoll -= Math.PI * 2;
            while (relRoll < -Math.PI) relRoll += Math.PI * 2;
            handRotationTarget = clamp(relRoll, -1.5, 1.5);

            var foldedCount = 0;

            for (var i = 0; i < 4; i++) {
                var dTip = distSq(landmarks[FINGER_TIPS[i]], wrist);
                var dMcp = distSq(landmarks[FINGER_MCPS[i]], wrist);
                if (dTip < dMcp * 1.2) foldedCount++;
            }

            // 带迟滞的状态机：避免手指计数在阈值附近抖动导致状态/视角反复跳变
            if (foldedCount >= 3) {
                cameraState.isFist = true;
                cameraState.isOpen = false;
            } else if (foldedCount === 0) {
                cameraState.isFist = false;
                cameraState.isOpen = true;
            } else if (cameraState.isFist && foldedCount === 2) {
                cameraState.isOpen = false;
            } else if (cameraState.isOpen && foldedCount === 1) {
                cameraState.isFist = false;
            } else {
                cameraState.isFist = false;
                cameraState.isOpen = false;
            }

            if (cameraState.isFist) {
                setGestureStatus('状态: ✊ 握拳 (拉远)', '#ff9b6b');
            } else if (cameraState.isOpen) {
                setGestureStatus('状态: ✋ 张开 (靠近)', '#4df0b4');
            } else {
                setGestureStatus('状态: 👋 水平环绕中', '#5ac8ff');
            }
        } else if (now - lastHandSeenAt > HAND_LOST_GRACE) {
            // 短暂漏检时保持上一状态，超过 350ms 才真正判定为“未检测到手”
            smoothCache = null;
            lastLandmarks = null;
            handRotationTarget = 0;
            handRollBase = null;
            handOrbitVel = 0;
            cameraState.isFist = false;
            cameraState.isOpen = false;
            setGestureStatus('未检测到手', '#7c8da3');
        }
    }

    function cameraErrorText(e) {
        var name = e && e.name;
        if (name === 'NotAllowedError' || name === 'SecurityError') return '摄像头权限被拒绝，已切换为鼠标控制';
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return '没有找到可用摄像头，已切换为鼠标控制';
        if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') return '摄像头被其他程序占用，已切换为鼠标控制';
        if (name === 'OverconstrainedError') return '摄像头不支持所需分辨率，已切换为鼠标控制';
        return '摄像头开启失败，已切换为鼠标控制';
    }

    var frameLoopActive = false;
    var sendBusy = false;
    var lastSendAt = 0;

    // 摄像头帧循环（轻量自实现）：模型就绪后再逐帧送检；
    // 预热或上一帧未返回时跳过，避免 hands.send 并发
    function startFrameLoop() {
        if (frameLoopActive) return;
        frameLoopActive = true;
        lastSendAt = 0;
        requestAnimationFrame(frameLoop);
    }

    function frameLoop() {
        if (!frameLoopActive) return;
        var now = performance.now();
        if (hands && !gestureWarming && !sendBusy && videoElement.readyState >= 2 && now - lastSendAt >= 33) {
            lastSendAt = now;
            sendBusy = true;
            try {
                hands.send({ image: videoElement }).catch(function () {
                }).then(function () {
                    sendBusy = false;
                });
            } catch (e) {
                sendBusy = false;
            }
        }
        requestAnimationFrame(frameLoop);
    }

    function stopCamera() {
        frameLoopActive = false;
        previewLoopActive = false;
        previewCanvas.style.display = 'none';
        if (cameraStream) {
            var tracks = cameraStream.getTracks();
            for (var i = 0; i < tracks.length; i++) {
                try { tracks[i].stop(); } catch (e) { /* 忽略 */ }
            }
            cameraStream = null;
        }
        videoElement.srcObject = null;
    }

    async function initGesture() {
        if (gestureInitialized) return;
        gestureInitialized = true;

        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
            setControlMode('mouse', location.protocol === 'file:'
                ? '本地文件方式打开时浏览器禁用摄像头，请改用 http://localhost 打开本页'
                : '当前浏览器不支持摄像头调用，已切换为鼠标控制');
            return;
        }

        // 第一步先开摄像头：预览画面立刻可见，模型继续在后台下载/初始化
        setGestureStatus('正在请求摄像头…', '#7c8da3');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false
            });
        } catch (e) {
            setControlMode('mouse', cameraErrorText(e));
            return;
        }
        videoElement.srcObject = cameraStream;
        try { await videoElement.play(); } catch (e) { /* 预览循环会在有画面后继续绘制 */ }
        startPreviewLoop();

        // 再等模型脚本与预取；此阶段摄像头画面已经在显示，不会空等
        setGestureStatus('正在加载手势模型…', '#7c8da3');
        try {
            await whenLibsReady(20000);
        } catch (e) {
            stopCamera();
            setControlMode('mouse', '手势模型加载超时，已切换为鼠标控制');
            return;
        }
        // 预取最多等 12s，避免个别资源卡住时一直不出手势
        if (prefetchPromise) {
            await Promise.race([prefetchPromise, new Promise(function (resolve) {
                setTimeout(resolve, 12000);
            })]);
        }

        // 没有预热过就直接创建：真实摄像头帧本身就是最好的热身
        if (!hands) createHands();
        startFrameLoop();
        if (!gestureWarming && !lastLandmarks) setGestureStatus('等待手势…', '#7c8da3');
    }

    // ==========================================
    // 15. 启动
    // ==========================================
    // 加载阶段粒子：目标点构成 3 条旋臂的星系盘（含中心核球），起点在视口外，
    // 每个粒子独立缓动 + 错峰延迟飞到自己的目标位置；一次性生成，不重复渲染
    var loadingGalaxyBuilt = false;
    var loadingGalaxyStart = 0;

    function buildLoadingGalaxy() {
        if (loadingGalaxyBuilt) return;
        var host = document.getElementById('loading-galaxy');
        if (!host) return;
        loadingGalaxyBuilt = true;
        loadingGalaxyStart = performance.now();
        var w = window.innerWidth, h = window.innerHeight;
        var maxR = Math.min(w * 0.55, h * 0.48);
        var count = w < 820 ? 260 : 520;
        var startR = Math.max(w, h) * 0.72 + 60;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < count; i++) {
            var core = Math.random() < 0.18;
            var r = core ? Math.pow(Math.random(), 1.8) * maxR * 0.22
                : Math.pow(Math.random(), 0.62) * maxR;
            var arm = i % 3;
            // 目标：旋臂角度随半径线性绕开，加一点横向抖动，形成自然的星系盘
            var ang = arm * Math.PI * 2 / 3 + (r / maxR) * 3.5 +
                (Math.random() - 0.5) * (0.50 + 0.55 * r / maxR);
            var tx = Math.cos(ang) * r;
            var ty = Math.sin(ang) * r * 0.52;   // 压扁成倾斜盘面
            var sa = Math.random() * Math.PI * 2;
            var sx = Math.cos(sa) * startR;
            var sy = Math.sin(sa) * startR * 0.85;
            var dot = document.createElement('span');
            dot.className = Math.random() < 0.22 ? 'galaxy-dot is-warm' : 'galaxy-dot';
            dot.style.setProperty('--x0', sx.toFixed(1) + 'px');
            dot.style.setProperty('--y0', sy.toFixed(1) + 'px');
            dot.style.setProperty('--x1', tx.toFixed(1) + 'px');
            dot.style.setProperty('--y1', ty.toFixed(1) + 'px');
            dot.style.setProperty('--s', ((core ? 4.1 : 3.0) + Math.random() * 4.2).toFixed(1) + 'px');
            dot.style.setProperty('--o', (0.44 + Math.random() * 0.56).toFixed(2));
            // 最慢一颗 = 0.60s 延迟 + 2.60s 飞行 = 3.20s，落在 3.3s 最短停留窗口内，淡出前必已全部落位
            dot.style.setProperty('--d', (1.90 + Math.random() * 0.70).toFixed(2) + 's');
            dot.style.setProperty('--delay', (Math.random() * 0.60).toFixed(2) + 's');
            frag.appendChild(dot);
        }
        host.appendChild(frag);
    }

    function boot() {
        buildLoadingGalaxy();
        resize();
        cameraState.radius = overviewDist();
        camGoal.dist = cameraState.radius;
        window.addEventListener('resize', scheduleResize);
        window.addEventListener('orientationchange', scheduleResize);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                lastFrameTime = 0;
                perfAccum = 0;
                perfFrames = 0;
            }
        });
        setupUI();
        setupPointer();
        buildSearchEntries();
        buildLabels();
        // 地表掩膜与场景构建并行解码：等到地球那一项时大概率已就绪，
        // 不会成为任务队列的串行等待点
        decodeEarthMask().then(function (mask) {
            earthMask = mask;
            earthMaskDone = true;
        });
        // 首帧立刻开始推进任务队列（此时主线程空），并发的掩膜解码完成后再插入
        setTimeout(function () {
            try {
                planScene();
                updateLoadUI();
                pumpLoad();
            } catch (err) {
                loadingEl.innerHTML = '<p>场景构建失败</p><small>' + (err && err.message ? err.message : err) + '</small>';
                console.error(err);
            }
        }, 0);
    }

    boot();
})();
</script>
</body>
</html>
