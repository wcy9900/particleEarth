    function decodeMask() {
        return new Promise(function (resolve) {
            var img = new Image();
            img.onload = function () {
                try {
                    var c = document.createElement('canvas');
                    c.width = img.naturalWidth;
                    c.height = img.naturalHeight;
                    var ctx = c.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0);
                    resolve({
                        data: ctx.getImageData(0, 0, c.width, c.height).data,
                        w: c.width,
                        h: c.height
                    });
                } catch (e) {
                    resolve(null);
                }
            };
            img.onerror = function () { resolve(null); };
            img.src = MASK_URL;
        });
    }

    function lerpChannel(a, b, t) {
        return a + (b - a) * t;
    }

    // 三维值噪声：按球面坐标采样，天然无经度接缝，避免纹理在 ±180° 出现割裂条纹
    function hashNoise(x, y, z) {
        var s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
        return s - Math.floor(s);
    }

    function valueNoise3(x, y, z) {
        var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        var xf = x - xi, yf = y - yi, zf = z - zi;
        var sx = xf * xf * (3 - 2 * xf);
        var sy = yf * yf * (3 - 2 * yf);
        var sz = zf * zf * (3 - 2 * zf);
        var a = lerpChannel(
            lerpChannel(hashNoise(xi, yi, zi), hashNoise(xi + 1, yi, zi), sx),
            lerpChannel(hashNoise(xi, yi + 1, zi), hashNoise(xi + 1, yi + 1, zi), sx),
            sy
        );
        var b = lerpChannel(
            lerpChannel(hashNoise(xi, yi, zi + 1), hashNoise(xi + 1, yi, zi + 1), sx),
            lerpChannel(hashNoise(xi, yi + 1, zi + 1), hashNoise(xi + 1, yi + 1, zi + 1), sx),
            sy
        );
        return lerpChannel(a, b, sz);
    }

    // 多尺度地形起伏：低频决定地块疏密、高频补充细碎纹理，返回 0..1
    function terrainDetail(x, y, z) {
        var n = valueNoise3(x * 2.7, y * 2.7, z * 2.7) * 0.64;
        n += valueNoise3(x * 6.4 + 11.3, y * 6.4, z * 6.4) * 0.26;
        n += valueNoise3(x * 14.1, y * 14.1 + 5.1, z * 14.1) * 0.10;
        return n;
    }

    // ==========================================
    // 3.1 大洲矢量数据解码与空间索引
    // GEO_PACK 布局：nCont → 每洲 [nRings → 每环 [nPts, x,y...]] → nCoast → 每段 [大洲, nPts, x,y...]
    // 坐标均为 int16 量化（×0.01°，约 1.1km 精度）
    // ==========================================
    var GEO = (function () {
        if (typeof GEO_PACK !== 'string' || !GEO_PACK) return null;
        try {
            var bin = atob(GEO_PACK);
            var n = bin.length >> 1;
            var vals = new Int16Array(n);
            for (var i = 0; i < n; i++) {
                // 手工按小端拼回 int16，避免不同浏览器对 DataView 字节序的差异
                vals[i] = ((bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)) << 16) >> 16;
            }

            var p = 0;
            function readRing(ci) {
                var np = vals[p++];
                var xy = new Float32Array(np * 2);
                var minx = 180, maxx = -180, miny = 90, maxy = -90;
                for (var k = 0; k < np; k++) {
                    var x = vals[p++] / 100, y = vals[p++] / 100;
                    xy[k * 2] = x;
                    xy[k * 2 + 1] = y;
                    if (x < minx) minx = x;
                    if (x > maxx) maxx = x;
                    if (y < miny) miny = y;
                    if (y > maxy) maxy = y;
                }
                return { ci: ci, xy: xy, np: np, minx: minx, maxx: maxx, miny: miny, maxy: maxy };
            }

            var nCont = vals[p++];
            var contRings = [];
            var rings = [];
            for (var c = 0; c < nCont; c++) {
                var nr = vals[p++];
                var list = [];
                for (var r = 0; r < nr; r++) {
                    var ring = readRing(c);
                    list.push(ring);
                    rings.push(ring);
                }
                contRings.push(list);
            }

            var nCoast = vals[p++];
            var coast = [];
            for (var m = 0; m < nCoast; m++) {
                var ci = vals[p++];
                coast.push(readRing(ci));
            }

            // 经纬网格索引：每个 6° 网格记录覆盖它的多边形环，海岸线归属查询只做局部射线判定
            var CELL = 6;
            var COLS = Math.round(360 / CELL);
            var ROWS = Math.round(180 / CELL);
            var grid = new Array(COLS * ROWS);
            for (var g = 0; g < rings.length; g++) {
                var rg = rings[g];
                var c0 = clamp(Math.floor((rg.minx + 180) / CELL), 0, COLS - 1);
                var c1 = clamp(Math.floor((rg.maxx + 180) / CELL), 0, COLS - 1);
                var r0 = clamp(Math.floor((rg.miny + 90) / CELL), 0, ROWS - 1);
                var r1 = clamp(Math.floor((rg.maxy + 90) / CELL), 0, ROWS - 1);
                for (var row = r0; row <= r1; row++) {
                    for (var col = c0; col <= c1; col++) {
                        var key = row * COLS + col;
                        if (!grid[key]) grid[key] = [];
                        grid[key].push(rg);
                    }
                }
            }

            return {
                contRings: contRings,
                coast: coast,
                grid: grid,
                cols: COLS,
                rows: ROWS,
                cell: CELL
            };
        } catch (e) {
            return null;
        }
    })();

    function ringContains(ring, x, y) {
        if (x < ring.minx || x > ring.maxx || y < ring.miny || y > ring.maxy) return false;
        var xy = ring.xy, np = ring.np;
        var res = false;
        for (var i = 0, j = np - 1; i < np; j = i++) {
            var xi = xy[i * 2], yi = xy[i * 2 + 1];
            var xj = xy[j * 2], yj = xy[j * 2 + 1];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) {
                res = !res;
            }
        }
        return res;
    }

    // 返回经纬度点所属大洲序号（-1 表示海洋）
    function continentAt(lon, lat) {
        if (!GEO) return -1;
        var col = Math.floor((lon + 180) / GEO.cell);
        var row = Math.floor((lat + 90) / GEO.cell);
        if (col < 0 || col >= GEO.cols || row < 0 || row >= GEO.rows) return -1;
        var bucket = GEO.grid[row * GEO.cols + col];
        if (!bucket) return -1;
        for (var i = 0; i < bucket.length; i++) {
            if (ringContains(bucket[i], lon, lat)) return bucket[i].ci;
        }
        return -1;
    }

    // ==========================================
    // 3.2 大洲边界粒子层：沿岸线等距加密，固定屏幕像素粗细
    // ==========================================
    var BOUNDARY_STEP = 0.16;   // 加密步长（度）
    var BOUNDARY_MAX = 60000;   // 点数上限（防御性）
    var BOUNDARY_COAST = [156, 232, 255];   // 海岸线基础色，与各大洲线色轻微混合

    function buildBoundaries() {
        if (!GEO) return null;
        var positions = [], colors = [], sizes = [];
        var R = CONFIG.earthRadius * 1.006;
        var pal = CONFIG.continents;

        function pushPoint(lon, lat, ci) {
            if (positions.length / 3 >= BOUNDARY_MAX) return;
            var lam = lon * Math.PI / 180;
            var phi = lat * Math.PI / 180;
            var cp = Math.cos(phi);
            positions.push(cp * Math.cos(lam) * R, Math.sin(phi) * R, cp * Math.sin(lam) * R);

            var tint = (ci >= 0 && ci < pal.length) ? pal[ci].line : BOUNDARY_COAST;
            var mixTo = 0.38;
            var r = BOUNDARY_COAST[0] + (tint[0] - BOUNDARY_COAST[0]) * mixTo;
            var g = BOUNDARY_COAST[1] + (tint[1] - BOUNDARY_COAST[1]) * mixTo;
            var b = BOUNDARY_COAST[2] + (tint[2] - BOUNDARY_COAST[2]) * mixTo;
            // 轻微亮度抖动，避免整条线死板；同时保留固定屏幕尺寸
            var lum = 0.94 + Math.random() * 0.12;
            colors.push(Math.min(1, r / 255 * lum), Math.min(1, g / 255 * lum), Math.min(1, b / 255 * lum));
            sizes.push(0.94 + Math.random() * 0.2);
        }

        for (var k = 0; k < GEO.coast.length; k++) {
            var ring = GEO.coast[k];
            var xy = ring.xy, np = ring.np;
            for (var i = 0; i < np - 1; i++) {
                var x1 = xy[i * 2], y1 = xy[i * 2 + 1];
                var x2 = xy[i * 2 + 2], y2 = xy[i * 2 + 3];
                // 跳过跨 180° 经线的假线段，以及沿地图边界的闭合边
                if (Math.abs(x2 - x1) > 180) continue;
                if (Math.abs(x1) > 179.5 && Math.abs(x2) > 179.5) continue;
                if (Math.abs(y1) > 89.5 && Math.abs(y2) > 89.5) continue;

                var midLat = (y1 + y2) * 0.5 * Math.PI / 180;
                var dx = (x2 - x1) * Math.cos(midLat);
                var dy = y2 - y1;
                var segLen = Math.sqrt(dx * dx + dy * dy);
                if (segLen < 1e-6) continue;
                var steps = Math.max(1, Math.ceil(segLen / BOUNDARY_STEP));
                for (var s = 0; s < steps; s++) {
                    var t = s / steps;
                    pushPoint(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, ring.ci);
                }
            }
        }

        if (!sizes.length) return null;
        return makePointsBuffers(
            new Float32Array(positions),
            new Float32Array(colors),
            new Float32Array(sizes)
        );
    }

    function buildEarth(mask) {
        var count = CONFIG.particleCount;
        var radius = CONFIG.earthRadius;
        var positions = new Float32Array(count * 3);
        var colors = new Float32Array(count * 3);
        var sizes = new Float32Array(count);
        var goldenAngle = Math.PI * (3 - Math.sqrt(5));

        var pal = CONFIG.palette;
        var data = mask ? mask.data : null;
        var texW = mask ? mask.w : 0;
        var texH = mask ? mask.h : 0;

        function sampleValue(u, v) {
            var px = Math.min(texW - 1, Math.max(0, (u * texW) | 0));
            var py = Math.min(texH - 1, Math.max(0, (v * texH) | 0));
            return data[(py * texW + px) * 4];
        }

        // 内陆度：周围 3×3（半径 3 texel）的陆地占比，用于海岸→内陆的柔和明暗过渡
        function inlandnessAt(u, v) {
            if (!data) return 0.5;
            var land = 0;
            var du = 3 / texW, dv = 3 / texH;
            for (var oy = -1; oy <= 1; oy++) {
                for (var ox = -1; ox <= 1; ox++) {
                    if (sampleValue(u + ox * du, v + oy * dv) >= 86) land++;
                }
            }
            return land / 9;
        }

        for (var i = 0; i < count; i++) {
            // 在斐波那契格点上做半格随机偏移：保持全球均匀覆盖，同时打散同心环纹
            var idx = i + (Math.random() - 0.5) * 1.1;
            idx = Math.max(0, Math.min(count - 1, idx));
            var y = 1 - (idx / (count - 1)) * 2;
            var ringRadius = Math.sqrt(Math.max(0, 1 - y * y));
            var theta = goldenAngle * idx;
            var ux = Math.cos(theta) * ringRadius;
            var uz = Math.sin(theta) * ringRadius;

            var shell = Math.random() < 0.9 ? 1 : 0.9 + Math.random() * 0.08;
            var r = radius * shell;

            // 轻微切向抖动，进一步打散点阵
            var jx = Math.random() - 0.5, jy = Math.random() - 0.5, jz = Math.random() - 0.5;
            var jd = jx * ux + jy * y + jz * uz;
            var spread = 0.9;

            positions[i * 3] = ux * r + (jx - ux * jd) * spread;
            positions[i * 3 + 1] = y * r + (jy - y * jd) * spread;
            positions[i * 3 + 2] = uz * r + (jz - uz * jd) * spread;

            var lat = Math.asin(y);
            var lon = Math.atan2(uz, ux);
            var u = (lon / (Math.PI * 2) + 0.5 + 1) % 1;
            var v = Math.min(0.9999, Math.max(0, 0.5 - lat / Math.PI));

            var cls = 0, level = Math.random() * 0.5, inland = 0.5, ci = -1, nd = 0.5;
            if (data) {
                var lonDeg = lon * 180 / Math.PI;
                var latDeg = lat * 180 / Math.PI;
                var value = sampleValue(u, v);
                var maskLand = value >= 86;

                // 海陆以矢量大洲多边形为准：粒子与海岸边界线严格贴合，掩膜只负责地形明暗与冰盖
                ci = continentAt(lonDeg, latDeg);
                if (ci === 2 && lonDeg > 70) ci = 0;   // 西伯利亚归入亚洲配色

                var iceCap = value >= 172 && (latDeg > 58 || latDeg < -58);
                if (iceCap) cls = 2;
                else if (ci >= 0) cls = 1;
                else cls = 0;

                if (cls === 2) level = clamp((value - 172) / 80, 0, 1);
                else if (cls === 1) level = maskLand ? clamp((value - 88) / 80, 0, 1) : 0.42;
                else level = maskLand ? 0.30 : clamp((value - 4) / 80, 0, 1);

                // 多尺度地形起伏叠加到高程上：大陆内部从此有山系、谷地与平原的自然斑块
                nd = terrainDetail(ux, y, uz);
                if (cls === 1) level = clamp(level + (nd - 0.5) * 0.28, 0, 1);
                else if (cls === 0) level = clamp(level + (nd - 0.5) * 0.24, 0, 1);

                if (cls === 1) inland = inlandnessAt(u, v);
            }

            var cr, cg, cb, size;
            if (cls === 2) {
                cr = pal.ice[0]; cg = pal.ice[1]; cb = pal.ice[2];
                size = 0.75 + Math.random() * 0.35;
            } else if (cls === 1) {
                var latAbs = Math.abs(lat);
                if (latAbs > 0.96) {
                    // 极地苔原：冷绿到深绿，高处更饱和
                    var tc = 0.3 + 0.7 * level;
                    cr = lerpChannel(pal.landCold[0], pal.landDeep[0], tc);
                    cg = lerpChannel(pal.landCold[1], pal.landDeep[1], tc);
                    cb = lerpChannel(pal.landCold[2], pal.landDeep[2], tc);
                } else if (latAbs > 0.20 && latAbs < 0.66 && level < 0.60) {
                    // 副热带干旱带：沙金与干草原橄榄绿交错
                    var dryMix = level < 0.34 ? (0.34 - level) / 0.34 : 0;
                    var td = 0.84 + 0.16 * level;
                    var dm = 0.45 + 0.55 * dryMix;
                    cr = lerpChannel(pal.landOlive[0], pal.landDry[0], dm) * td;
                    cg = lerpChannel(pal.landOlive[1], pal.landDry[1], dm) * td;
                    cb = lerpChannel(pal.landOlive[2], pal.landDry[2], dm) * td;
                } else if (latAbs <= 0.20) {
                    // 赤道雨林：深绿 → 鲜亮翠绿，最鲜艳的一段
                    var tl = 0.25 + 0.75 * level;
                    cr = lerpChannel(pal.landDeep[0], pal.landLush[0], tl);
                    cg = lerpChannel(pal.landDeep[1], pal.landLush[1], tl);
                    cb = lerpChannel(pal.landDeep[2], pal.landLush[2], tl);
                } else {
                    // 温带林地，越靠高纬越混入冷色针叶林
                    var tW = 0.15 + 0.85 * level;
                    var coldPull = clamp((latAbs - 0.62) / 0.34, 0, 1) * 0.55;
                    cr = lerpChannel(lerpChannel(pal.landDeep[0], pal.landBright[0], tW), pal.landCold[0], coldPull);
                    cg = lerpChannel(lerpChannel(pal.landDeep[1], pal.landBright[1], tW), pal.landCold[1], coldPull);
                    cb = lerpChannel(lerpChannel(pal.landDeep[2], pal.landBright[2], tW), pal.landCold[2], coldPull);
                }
                // 低地盆地与河谷：洼地处压向湿润橄榄绿，做出平原内部的深浅层次
                if (level < 0.36) {
                    var tBasin = clamp((0.36 - level) / 0.36, 0, 1) * (0.14 + 0.24 * nd);
                    cr = lerpChannel(cr, pal.landBasin[0], tBasin);
                    cg = lerpChannel(cg, pal.landBasin[1], tBasin);
                    cb = lerpChannel(cb, pal.landBasin[2], tBasin);
                }
                // 高山裸岩：沿噪声脊线成带分布，长成连绵山系而不是随机麻点
                if (level > 0.70 && nd > 0.54 && Math.random() < 0.46) {
                    var tm = 0.32 + Math.random() * 0.40;
                    cr = lerpChannel(cr, pal.landMountain[0], tm);
                    cg = lerpChannel(cg, pal.landMountain[1], tm);
                    cb = lerpChannel(cb, pal.landMountain[2], tm);
                }
                // 大洲专属底色：按内陆度微调比例，海岸带保留更多地形本色
                if (ci >= 0 && ci < CONFIG.continents.length) {
                    var tint = CONFIG.continents[ci].tint;
                    var tintMix = 0.40 + 0.20 * inland;
                    cr = lerpChannel(cr, tint[0], tintMix);
                    cg = lerpChannel(cg, tint[1], tintMix);
                    cb = lerpChannel(cb, tint[2], tintMix);
                }
                // 内部层次：内陆略亮、近岸略暗，叠加地形起伏做出由海向陆的柔和渐变
                var landShade = (0.90 + 0.14 * inland) * (0.93 + 0.14 * nd);
                cr *= landShade;
                cg *= landShade;
                cb *= landShade;
                // 轻微分通道扰动，避免整片陆地是同一个色号
                cr *= 0.96 + Math.random() * 0.08;
                cg *= 0.97 + Math.random() * 0.06;
                cb *= 0.96 + Math.random() * 0.08;
                size = (1.10 + Math.random() * 0.28) * (0.97 + 0.08 * nd);
            } else {
                // 深海 → 中浅层 → 近岸浅滩的青蓝过渡，浅滩里透出珊瑚绿
                var tOcean = 0.42 + 0.58 * level;
                if (tOcean < 0.6) {
                    var t1 = tOcean / 0.6;
                    cr = lerpChannel(pal.oceanDeep[0], pal.oceanMid[0], t1);
                    cg = lerpChannel(pal.oceanDeep[1], pal.oceanMid[1], t1);
                    cb = lerpChannel(pal.oceanDeep[2], pal.oceanMid[2], t1);
                } else {
                    var t2 = (tOcean - 0.6) / 0.4;
                    cr = lerpChannel(pal.oceanMid[0], pal.oceanShallow[0], t2);
                    cg = lerpChannel(pal.oceanMid[1], pal.oceanShallow[1], t2);
                    cb = lerpChannel(pal.oceanMid[2], pal.oceanShallow[2], t2);
                    if (level > 0.86) {
                        var tr2 = (level - 0.86) / 0.14 * 0.55;
                        cr = lerpChannel(cr, pal.oceanReef[0], tr2);
                        cg = lerpChannel(cg, pal.oceanReef[1], tr2);
                        cb = lerpChannel(cb, pal.oceanReef[2], tr2);
                    }
                }
                if (level < 0.14) {
                    // 海沟与深海盆地：颜色沉入更深的蓝，让洋底也有了起伏的体积感
                    var tTrench = clamp((0.14 - level) / 0.14, 0, 1) * 0.38;
                    cr = lerpChannel(cr, pal.oceanTrench[0], tTrench);
                    cg = lerpChannel(cg, pal.oceanTrench[1], tTrench);
                    cb = lerpChannel(cb, pal.oceanTrench[2], tTrench);
                }
                size = (0.54 + Math.random() * 0.26) * (0.97 + 0.10 * nd);
            }

            var jitter = 0.9 + Math.random() * 0.14;
            // 起伏明暗：噪声驱动，同一片地物内部也能看出沟谷与脊线的走向
            jitter *= 0.93 + 0.16 * nd;
            // 海岸带：略提亮并增大颗粒，与矢量边界线共同强化岸线轮廓
            var shore = cls === 1 ? clamp((0.72 - inland) / 0.72, 0, 1) : 0;
            if (shore > 0) {
                jitter *= 1 + 0.05 * shore;
                size += 0.12 * shore;
            }

            // 山地阴影：脊线背光一侧压暗，做出山脉连绵起伏的层次感
            if (cls === 1 && shore < 0.4 && level > 0.45 && Math.random() < 0.18) {
                jitter *= 0.72;
            }
            // 沙丘明暗纹：干旱带内沿噪声出现起伏，避免沙漠是一块平色
            if (cls === 1 && Math.abs(lat) > 0.20 && Math.abs(lat) < 0.66 && level < 0.38) {
                jitter *= 0.95 + 0.10 * nd;
            }
            // 赤道海域略提亮，模拟阳光最盛的暖水带
            if (cls === 0 && Math.abs(lat) < 0.18) {
                jitter *= 1.10;
            }
            // 洋流与浅滩：噪声高值处提亮，海水不再是均匀的一片蓝
            if (cls === 0) {
                jitter *= 1.0 + (nd - 0.5) * 0.14;
            }

            // 陆地零星暖金光点，模拟城市灯火，增加地表细节层次
            if (cls === 1 && inland > 0.55 && Math.random() < 0.04) {
                colors[i * 3] = 1;
                colors[i * 3 + 1] = 0.82;
                colors[i * 3 + 2] = 0.5;
                sizes[i] = size + 0.5;
            } else {
                colors[i * 3] = Math.min(1, (cr / 255) * jitter);
                colors[i * 3 + 1] = Math.min(1, (cg / 255) * jitter);
                colors[i * 3 + 2] = Math.min(1, (cb / 255) * jitter);
                sizes[i] = size;
            }
        }

        return makePointsBuffers(positions, colors, sizes);
    }

    // ==========================================
    // 3.0 双层云系：低层厚积云 + 高层薄卷云，两层各自差速漂移，云层因此有纵深
    // ==========================================
    function buildClouds(count) {
        var denseCount = Math.round(count * 0.62);
        var wispyCount = count - denseCount;

        function makeLayer(n, opts) {
            var positions = new Float32Array(n * 3);
            var colors = new Float32Array(n * 3);
            var sizes = new Float32Array(n);
            var centers = [];
            for (var c = 0; c < opts.clusters; c++) {
                // 云团集中在中低纬带，两极留白，看起来更像真实的大气环流
                var y = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                y = clamp(y, -opts.latLimit, opts.latLimit);
                var rr = Math.sqrt(Math.max(0, 1 - y * y));
                var th = Math.random() * Math.PI * 2;
                centers.push([Math.cos(th) * rr, y, Math.sin(th) * rr]);
            }

            for (var i = 0; i < n; i++) {
                var ct = centers[(Math.random() * centers.length) | 0];
                // 三次均匀随机求和近似高斯分布：云团中心密、边缘稀
                var gx = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                var gy = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                var gz = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
                // 沿纬向拉长、竖向压扁：形成自然云带而不是圆团
                var px = ct[0] + gx * opts.spread * opts.stretch;
                var py = ct[1] + gy * opts.spread * opts.flatten;
                var pz = ct[2] + gz * opts.spread * opts.stretch;
                var len = Math.hypot(px, py, pz) || 1;
                var r = opts.radius * (0.998 + Math.random() * 0.012);
                positions[i * 3] = (px / len) * r;
                positions[i * 3 + 1] = (py / len) * r;
                positions[i * 3 + 2] = (pz / len) * r;

                var core = 1 - Math.min(1, Math.hypot(gx * opts.stretch, gy * opts.flatten, gz * opts.stretch) * 0.95);
                // 云团内部提亮、边缘压暗：让云块从中心自然虚化到周围，避免硬边
                var tint = opts.tint + core * opts.coreGain + Math.random() * 0.04;
                colors[i * 3] = Math.min(1, tint * 0.90);
                colors[i * 3 + 1] = Math.min(1, tint * 0.97);
                colors[i * 3 + 2] = Math.min(1, tint * 1.06);
                sizes[i] = opts.sizeBase + Math.random() * opts.sizeRand + core * opts.sizeCore;
            }
            return makePointsBuffers(positions, colors, sizes);
        }

        return {
            // 低层：云团紧凑、颗粒厚实、亮度高，是地球表面主要的一层云
            dense: makeLayer(denseCount, {
                clusters: 34, latLimit: 0.90, spread: 0.21, stretch: 1.10, flatten: 0.55,
                radius: CONFIG.earthRadius * 1.020, tint: 0.55, coreGain: 0.34,
                sizeBase: 0.60, sizeRand: 0.40, sizeCore: 1.62
            }),
            // 高层：云带更修长轻薄、颗粒更小更淡，叠在厚云之上形成通透的卷云层
            wispy: makeLayer(wispyCount, {
                clusters: 22, latLimit: 0.82, spread: 0.30, stretch: 1.55, flatten: 0.34,
                radius: CONFIG.earthRadius * 1.046, tint: 0.50, coreGain: 0.30,
                sizeBase: 0.42, sizeRand: 0.44, sizeCore: 1.15
            })
        };
    }

    // ==========================================
    // 3.1 真实星座粒子（d3-celestial 数据）
    // ==========================================
    function raDecToXYZ(ra, dec, radius, out, offset) {
        var raRad = ra * Math.PI / 180;
        var decRad = dec * Math.PI / 180;
        var cd = Math.cos(decRad);
        out[offset] = Math.cos(raRad) * cd * radius;
        out[offset + 1] = Math.sin(decRad) * radius;
        out[offset + 2] = Math.sin(raRad) * cd * radius;
    }

    function buildConstellationStars() {
        if (!STAR_DATA || STAR_DATA.charAt(0) === '_') return null;
        var items = STAR_DATA.split(';');
        var rows = [];
        for (var i = 0; i < items.length; i++) {
            var parts = items[i].split(',');
            if (parts.length >= 2) rows.push(parts);
        }

        var count = rows.length;
        var radius = CONFIG.starRadius;
        var positions = new Float32Array(count * 3);
        var colors = new Float32Array(count * 3);
        var sizes = new Float32Array(count);

        for (var j = 0; j < count; j++) {
            var ra = parseFloat(rows[j][0]);
            var dec = parseFloat(rows[j][1]);
            var links = parseFloat(rows[j][2]) || 1;
            raDecToXYZ(ra, dec, radius, positions, j * 3);

            var t = clamp((links - 1) / 2.4, 0, 1);
            colors[j * 3] = lerpChannel(0.68, 1.0, t);
            colors[j * 3 + 1] = lerpChannel(0.86, 1.0, t);
            colors[j * 3 + 2] = 1.0;
            // 按连接数分三级星等，让星座主星更有层次
            sizes[j] = (links >= 2.5 ? 2.7 : (links >= 1.5 ? 2.0 : 1.45)) + Math.random() * 0.18;
        }

        return makePointsBuffers(positions, colors, sizes);
    }

    function buildConstellationDots() {
        if (!DOT_DATA || DOT_DATA.charAt(0) === '_') return null;
        var items = DOT_DATA.split(';');
        var rows = [];
        for (var i = 0; i < items.length; i++) {
            var parts = items[i].split(',');
            if (parts.length >= 2) rows.push(parts);
        }

        var count = rows.length;
        var radius = CONFIG.starRadius;
        var positions = new Float32Array(count * 3);
        var colors = new Float32Array(count * 3);
        var sizes = new Float32Array(count);

        for (var j = 0; j < count; j++) {
            raDecToXYZ(parseFloat(rows[j][0]), parseFloat(rows[j][1]), radius, positions, j * 3);
            var jitter = 0.96 + Math.random() * 0.08;
            colors[j * 3] = 0.55 * jitter;
            colors[j * 3 + 1] = 0.95 * jitter;
            colors[j * 3 + 2] = 1.0 * jitter;
            sizes[j] = 1.05;
        }

        return makePointsBuffers(positions, colors, sizes);
    }

    function buildBgStars(count) {
        var nebulaCount = IS_LOW_END ? 32 : 64;
        var total = count + nebulaCount;
        var positions = new Float32Array(total * 3);
        var colors = new Float32Array(total * 3);
        var sizes = new Float32Array(total);
        var radius = CONFIG.bgStarRadius;

        for (var i = 0; i < count; i++) {
            var dimBand = i < count * 0.42;
            var x, y, z;
            if (dimBand) {
                // 银河带：沿同一大圆聚集，形成可见的星空层次
                var a = Math.random() * Math.PI * 2;
                y = (Math.random() + Math.random() + Math.random() - 1.5) * 0.1;
                var bx = Math.cos(a), bz = Math.sin(a);
                var bl = Math.sqrt(bx * bx + y * y + bz * bz) || 1;
                x = bx / bl;
                y /= bl;
                z = bz / bl;
            } else {
                var u = Math.random() * 2 - 1;
                var phi = Math.random() * Math.PI * 2;
                var rr = Math.sqrt(Math.max(0, 1 - u * u));
                x = Math.cos(phi) * rr;
                y = u;
                z = Math.sin(phi) * rr;
            }
            positions[i * 3] = x * radius;
            positions[i * 3 + 1] = y * radius;
            positions[i * 3 + 2] = z * radius;

            var warm = !dimBand && Math.random() < 0.16;
            var bright = (dimBand ? 0.72 : 0.82) + Math.random() * 0.33;
            var rare = !dimBand && Math.random() < 0.012;
            if (rare) bright = 1.15 + Math.random() * 0.25;
            colors[i * 3] = warm ? bright : bright * 0.78;
            colors[i * 3 + 1] = warm ? bright * 0.9 : bright * 0.9;
            colors[i * 3 + 2] = warm ? bright * 0.72 : bright;
            sizes[i] = dimBand
                ? 0.5 + Math.random() * 0.5
                : 0.8 + Math.random() * 1.0 + (Math.random() < 0.09 ? 1.5 : 0) + (rare ? 2.2 : 0);
        }

        // 几团柔和的星云，增加深空层次
        var tints = [
            [0.42, 0.26, 0.75],
            [0.78, 0.44, 0.3],
            [0.24, 0.46, 0.78],
            [0.28, 0.62, 0.66]
        ];
        for (var c = 0; c < 4; c++) {
            // 每个星云团的方向固定，内部点做随机偏移
            var baseAngle = c * 1.57 + 0.7;
            var baseTilt = Math.sin(c * 0.9 + 0.3) * 0.75;
            var cluster = [
                Math.cos(baseAngle) * Math.cos(baseTilt),
                Math.sin(baseTilt),
                Math.sin(baseAngle) * Math.cos(baseTilt)
            ];
            for (var k = 0; k < nebulaCount / 4; k++) {
                var idx = count + c * (nebulaCount / 4) + k;
                var dx = cluster[0] + (Math.random() - 0.5) * 0.36;
                var dy = cluster[1] + (Math.random() - 0.5) * 0.36;
                var dz = cluster[2] + (Math.random() - 0.5) * 0.36;
                var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
                positions[idx * 3] = dx / dl * radius;
                positions[idx * 3 + 1] = dy / dl * radius;
                positions[idx * 3 + 2] = dz / dl * radius;

                var tint = tints[c];
                var glow = 0.1 + Math.random() * 0.12;
                colors[idx * 3] = tint[0] * glow;
                colors[idx * 3 + 1] = tint[1] * glow;
                colors[idx * 3 + 2] = tint[2] * glow;
                sizes[idx] = 6 + Math.random() * 13;
            }
        }

        return makePointsBuffers(positions, colors, sizes);
    }

    // ==========================================
    // 3.4 星座名称标签（靠近视野中心的星座淡入显示）
    // ==========================================
    var CONSTELLATION_NAMES = [
        { name: '猎户座', ra: 83.8, dec: 2 },
        { name: '大熊座', ra: 165, dec: 50 },
        { name: '小熊座', ra: 225, dec: 75 },
        { name: '仙后座', ra: 15, dec: 60 },
        { name: '仙女座', ra: 11, dec: 38 },
        { name: '天鹅座', ra: 307.5, dec: 42 },
        { name: '天琴座', ra: 282.5, dec: 37 },
        { name: '天鹰座', ra: 295, dec: 3 },
        { name: '天蝎座', ra: 247.5, dec: -30 },
        { name: '人马座', ra: 285, dec: -25 },
        { name: '狮子座', ra: 157.5, dec: 15 },
        { name: '金牛座', ra: 67.5, dec: 17 },
        { name: '双子座', ra: 105, dec: 22 },
        { name: '御夫座', ra: 90, dec: 42 },
        { name: '英仙座', ra: 52.5, dec: 45 },
        { name: '大犬座', ra: 101, dec: -22 },
        { name: '处女座', ra: 195, dec: -5 },
        { name: '半人马座', ra: 195, dec: -47 },
        { name: '船底座', ra: 130, dec: -60 },
        { name: '南十字座', ra: 187.5, dec: -60 },
        { name: '天秤座', ra: 225, dec: -15 },
        { name: '巨蟹座', ra: 130, dec: 20 },
        { name: '摩羯座', ra: 315, dec: -20 },
        { name: '水瓶座', ra: 330, dec: -10 },
        { name: '双鱼座', ra: 15, dec: 5 },
        { name: '白羊座', ra: 30, dec: 20 },
        { name: '蛇夫座', ra: 255, dec: -5 },
        { name: '武仙座', ra: 255, dec: 30 },
        { name: '天龙座', ra: 255, dec: 65 },
        { name: '飞马座', ra: 340, dec: 15 },
        { name: '鲸鱼座', ra: 30, dec: -10 },
        { name: '天鹤座', ra: 330, dec: -45 }
    ];

    var labelLayerEl = document.getElementById('star-labels');
    var labelItems = [];

    function buildStarLabels() {
        if (!labelLayerEl) return;
        for (var i = 0; i < CONSTELLATION_NAMES.length; i++) {
            var info = CONSTELLATION_NAMES[i];
            var el = document.createElement('div');
            el.className = 'star-label';
            var dot = document.createElement('i');
            var span = document.createElement('span');
            span.textContent = info.name;
            el.appendChild(dot);
            el.appendChild(span);
            labelLayerEl.appendChild(el);

            var dir = [0, 0, 0];
            raDecToXYZ(info.ra, info.dec, 1, dir, 0);
            labelItems.push({ el: el, dir: dir, opacity: 0, x: 0, y: 0 });
        }
    }

    var lab = { wx: 0, wy: 0, wz: 0, vx: 0, vy: 0, vz: 0, cx: 0, cy: 0, cw: 1 };

    function updateStarLabels(dt, ex, ey, ez, scatter, vis) {
        if (!labelItems.length) return;
        var show = viewMode !== 'earth' && vis > 0.5;
        var m = starModel;
        var R = CONFIG.starRadius * starScale;
        var aspect = canvas.width / Math.max(1, canvas.height);
        var diskR = 0;
        if (viewMode === 'both') {
            var ratio = clamp(CONFIG.earthRadius * 1.12 / cameraState.radius, 0.02, 0.999);
            diskR = Math.tan(Math.asin(ratio)) / STAR_FOV_TAN;
        }
        var bothMode = viewMode === 'both';
        var edgeLimit = bothMode ? 0.995 : 0.95;
        var cands = [];

        // 第一遍：计算每个星座的屏幕位置与候选透明度
        for (var i = 0; i < labelItems.length; i++) {
            var it = labelItems[i];
            it.cand = 0;
            it.metric = 9;

            if (show) {
                var d = it.dir;
                lab.wx = (m[0] * d[0] + m[4] * d[1] + m[8] * d[2]) * R;
                lab.wy = (m[1] * d[0] + m[5] * d[1] + m[9] * d[2]) * R;
                lab.wz = (m[2] * d[0] + m[6] * d[1] + m[10] * d[2]) * R;

                // 无穷远天幕：只按视线方向投影，不含相机平移
                lab.vx = viewMatrix[0] * lab.wx + viewMatrix[4] * lab.wy + viewMatrix[8] * lab.wz;
                lab.vy = viewMatrix[1] * lab.wx + viewMatrix[5] * lab.wy + viewMatrix[9] * lab.wz;
                lab.vz = viewMatrix[2] * lab.wx + viewMatrix[6] * lab.wy + viewMatrix[10] * lab.wz;

                if (lab.vz < -20) {
                    lab.cw = starProjMatrix[3] * lab.vx + starProjMatrix[7] * lab.vy + starProjMatrix[11] * lab.vz + starProjMatrix[15];
                    if (lab.cw > 0.0001) {
                        lab.cx = (starProjMatrix[0] * lab.vx + starProjMatrix[4] * lab.vy + starProjMatrix[8] * lab.vz + starProjMatrix[12]) / lab.cw;
                        lab.cy = (starProjMatrix[1] * lab.vx + starProjMatrix[5] * lab.vy + starProjMatrix[9] * lab.vz + starProjMatrix[13]) / lab.cw;

                            var blocked = diskR > 0 && Math.hypot(lab.cx * aspect, lab.cy) < diskR * (bothMode ? 0.9 : 0.96);
                            var edge = Math.max(Math.abs(lab.cx), Math.abs(lab.cy));
                            if (!blocked && edge < edgeLimit) {
                                // 无穷远天幕下可见星都在前方，只需处理屏幕边缘淡出
                                var fk = 1;
                                var ek = 1 - clamp((edge - (bothMode ? 0.86 : 0.70)) / (bothMode ? 0.14 : 0.24), 0, 1);
                                ek = ek * ek * (3 - 2 * ek);
                                it.cand = fk * ek * vis * (1 - scatter);
                                it.metric = edge;
                                it.x = (lab.cx * 0.5 + 0.5) * window.innerWidth;
                                it.y = (0.5 - lab.cy * 0.5) * window.innerHeight - 6;
                                if (it.cand > 0.01) cands.push(it);
                            }
                        }
                    }
            }
        }

        // 同时显示更多星座名，并用最小屏幕间距过滤重叠标签
        cands.sort(function (a, b) { return a.metric - b.metric; });
        var picked = [];
        for (var c = 0; c < cands.length; c++) {
            var cand = cands[c];
            var tooClose = false;
            for (var q = 0; q < picked.length; q++) {
                var dxs = cand.x - picked[q].x;
                var dys = cand.y - picked[q].y;
                if (dxs * dxs + dys * dys < 76 * 76) { tooClose = true; break; }
            }
            if (tooClose || picked.length >= 9) cand.cand = 0;
            else picked.push(cand);
        }

        // 第二遍：平滑淡入淡出并写入 DOM
        for (var j = 0; j < labelItems.length; j++) {
            var item = labelItems[j];
            var target = item.cand;
            var prev = item.opacity;
            var k = Math.min(1, dt * (target < item.opacity ? 12 : 7));
            item.opacity += (target - item.opacity) * k;
            if (Math.abs(item.opacity - target) < 0.005) item.opacity = target;

            if (item.opacity < 0.01) {
                if (prev >= 0.01) item.el.style.opacity = '0';
                continue;
            }

            var scale = 0.9 + item.opacity * 0.1;
            item.el.style.opacity = item.opacity.toFixed(2);
            item.el.style.transform = 'translate3d(' + item.x.toFixed(1) + 'px,' + item.y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + scale.toFixed(2) + ')';
        }
    }

    // 4. 相机与渲染
    // ==========================================
    var cameraState = {
        radius: CONFIG.defaultDistance,
        theta: Math.PI / 2 - 0.05,
        phi: 0.6,
        zoomVelocity: 0,
        isFist: false,
        isOpen: false,
        handRotation: 0
    };

    // 手势采样值（模型回调更新）与相机实际响应（每帧平滑逼近）分开，
    // 避免模型回调频率低于渲染帧率时视角出现阶跃/滞后
    var handRotationTarget = 0;
    var gestureZoom = 0;

    var MOUSE_HELP = '🖱 <b>拖动</b>: 旋转视角<br>⚙️ <b>滚轮 / 双指</b>: 缩放远近';
    var HAND_HELP = '👋 <b>旋转手掌</b>: 旋转相机视角<br>✊ <b>握拳并拉远</b>: 相机远离 (加速)<br>✋ <b>五指张开靠近</b>: 相机靠近 (减速)';

    var viewMode = 'both';
    var controlMode = 'mouse';
    var earthFade = 1;
    var starFade = 1;
    var starScale = 1;
    var time = 0;
    var lastFrameTime = 0;
    var dprCap = CONFIG.pixelRatioCap;
    var perfAccum = 0;
    var perfFrames = 0;
    var slowStrikes = 0;
    var firstFrameDone = false;
    var gestureInitialized = false;

    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, dprCap);
        pointingRatio = dpr;
        var w = Math.max(1, Math.floor(window.innerWidth * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
        }
        gl.viewport(0, 0, w, h);
        perspective(projMatrix, 60 * Math.PI / 180, w / h, 1, 2000);
    }

    function updateCamera(dt) {
        var step = Math.min(dt * 60, 3);
        var handActive = controlMode === 'hand';

        // 手势旋转：每帧向最新采样值平滑逼近，过渡跟手且不抖动
        var rotTarget = handActive ? handRotationTarget : 0;
        var rotK = Math.min(1, dt * 22);
        cameraState.handRotation += (rotTarget - cameraState.handRotation) * rotK;
        if (Math.abs(cameraState.handRotation) < 0.02) cameraState.handRotation = 0;

        if (Math.abs(cameraState.handRotation) > 0.1) {
            cameraState.phi += cameraState.handRotation * CONFIG.rotationSpeedMultiplier * step;
        }

        // 手势缩放意图平滑过渡：握拳/张开切换时不再瞬间反向
        var zoomTarget = handActive ? (cameraState.isFist ? 1 : (cameraState.isOpen ? -1 : 0)) : 0;
        var zoomK = Math.min(1, dt * 9);
        gestureZoom += (zoomTarget - gestureZoom) * zoomK;
        if (Math.abs(gestureZoom) < 0.02) gestureZoom = 0;

        if (gestureZoom > 0) {
            cameraState.zoomVelocity += 0.5 * gestureZoom * step;
        } else if (gestureZoom < 0) {
            var diff = cameraState.radius - CONFIG.minDistance;
            cameraState.zoomVelocity = -diff * 0.05 * (-gestureZoom) * step;
        } else {
            cameraState.zoomVelocity *= Math.pow(0.9, step);
        }

        cameraState.radius += cameraState.zoomVelocity * step;

        if (cameraState.radius < CONFIG.minDistance) {
            cameraState.radius = CONFIG.minDistance;
            cameraState.zoomVelocity = 0;
        }
        if (cameraState.radius > CONFIG.maxDistance) {
            cameraState.radius = CONFIG.maxDistance;
            cameraState.zoomVelocity *= 0.5;
        }
    }

    function updateView(dt) {
        var targetEarth = viewMode === 'stars' ? 0 : 1;
        var targetStar = viewMode === 'earth' ? 0 : 1;
        var targetScale = viewMode === 'stars' ? CONFIG.starOnlyScale : 1;
        var k = Math.min(1, dt * 4.5);

        earthFade += (targetEarth - earthFade) * k;
        starFade += (targetStar - starFade) * k;
        starScale += (targetScale - starScale) * k;

        if (Math.abs(earthFade - targetEarth) < 0.01) earthFade = targetEarth;
        if (Math.abs(starFade - targetStar) < 0.01) starFade = targetStar;
        if (Math.abs(starScale - targetScale) < 0.01) starScale = targetScale;
    }

    // 切换视图过渡：当前形态先散开并淡出，目标形态以同样的散乱状态淡入后汇聚
    // 两个阶段在时间上重叠，视觉上是一团尘埃整体转身，而不是目标凭空出现
    var transT = 1;
    var transActive = false;
    var transFromEarth = false;
    var transFromStar = false;
    var cloudDrift = 0;

    function smooth01(x) {
        x = clamp(x, 0, 1);
        return x * x * (3 - 2 * x);
    }

    function updateTransition(dt) {
        // 云层差速自转累积角（赤道附加角速度）
        cloudDrift += dt * 0.062;
        if (!transActive) return null;
        transT += dt / 1.5;
        if (transT >= 1) {
            transT = 1;
            transActive = false;
            return null;
        }
        var t = transT;
        return {
            outS: smooth01(t / 0.50),                        // 旧形态：散开 0→1
            outV: 1 - smooth01((t - 0.10) / 0.52),            // 旧形态：淡出 1→0
            inS: 1 - smooth01((t - 0.40) / 0.60),             // 新形态：由散乱 1→0 汇聚
            inV: smooth01((t - 0.32) / 0.34),                 // 新形态：淡入 0→1
            pulse: Math.sin(Math.PI * t)                      // 一直存在的形态：轻微脉动
        };
    }

    function triggerScatter() {
        transFromEarth = earthFade > 0.5;
        transFromStar = starFade > 0.5;
        transT = 0;
        transActive = true;
    }

    function render(now) {
        requestAnimationFrame(render);
        var rawDelta = lastFrameTime ? now - lastFrameTime : 16.7;
        var dt = lastFrameTime ? Math.min(0.05, rawDelta / 1000) : 0.016;
        lastFrameTime = now;

        // 自适应分辨率：持续掉帧时下调渲染像素比，优先保证旋转顺滑
        if (firstFrameDone && rawDelta > 0 && rawDelta < 200) {
            perfAccum += rawDelta;
            perfFrames++;
        }
        if (perfFrames >= 90) {
            var avgFrame = perfAccum / perfFrames;
            if (avgFrame > 26) {
                slowStrikes++;
            } else {
                slowStrikes = 0;
            }
            // 连续两轮明显掉帧才降档，避免 resize 反复触发造成额外卡顿
            if (slowStrikes >= 2 && dprCap > 1.01) {
                dprCap = Math.max(1, dprCap - 0.25);
                scheduleResize();
                slowStrikes = 0;
            }
            perfAccum = 0;
            perfFrames = 0;
        }

        time += dt;
        updateCamera(dt);
        updateView(dt);

        // 逐帧解算两种形态各自的可见度与散开量
        var tr = updateTransition(dt);
        var earthVis = earthFade, starVis = starFade;
        var earthScatter = 0, starScatter = 0;
        if (tr) {
            var earthNow = viewMode !== 'stars';
            var starNow = viewMode !== 'earth';
            if (transFromEarth && earthNow) {
                earthVis = 1;
                earthScatter = tr.pulse;
            } else if (transFromEarth) {
                earthVis = tr.outV;
                earthScatter = tr.outS;
            } else if (earthNow) {
                earthVis = tr.inV;
                earthScatter = tr.inS;
            } else {
                earthVis = 0;
            }

            if (transFromStar && starNow) {
                starVis = 1;
                starScatter = tr.pulse;
            } else if (transFromStar) {
                starVis = tr.outV;
                starScatter = tr.outS;
            } else if (starNow) {
                starVis = tr.inV;
                starScatter = tr.inS;
            } else {
                starVis = 0;
            }
        }

        var sinTheta = Math.sin(cameraState.theta);
        var ex = cameraState.radius * sinTheta * Math.sin(cameraState.phi);
        var ey = cameraState.radius * Math.cos(cameraState.theta);
        var ez = cameraState.radius * sinTheta * Math.cos(cameraState.phi);
        lookAt(viewMatrix, ex, ey, ez, 0, 0, 0, 0, 1, 0);
        // 星座层独立使用更广的视场，让星空像真实夜空一样铺满画面
        perspective(starProjMatrix, 100 * Math.PI / 180, canvas.width / Math.max(1, canvas.height), 1, 5000);

        gl.clear(gl.COLOR_BUFFER_BIT);

        // 深空背景星场：忽略相机平移，等效于无穷远天幕，任何缩放距离都不会露出球体边界
        rotationY(bgModel, time * 0.004);
        var bgTx = viewMatrix[12], bgTy = viewMatrix[13], bgTz = viewMatrix[14];
        viewMatrix[12] = 0;
        viewMatrix[13] = 0;
        viewMatrix[14] = 0;
        drawPoints(bgStarBuffers, bgModel, {
            opacity: 0.92, sizeScale: 2150, maxSize: 30, minDist: 16, twinkle: 0.06
        });
        viewMatrix[12] = bgTx;
        viewMatrix[13] = bgTy;
        viewMatrix[14] = bgTz;

        // 真实星座：同样置于无穷远天幕，视野内就是一片真实夜空，不再有球体轮廓
        if (starVis > 0.01) {
            rotationZ(starTilt, CONFIG.tilt);
            rotationY(starSpin, time * CONFIG.starSpin);
            multiply(starModel, starTilt, starSpin);

            var diskMode = viewMode === 'both';
            var lineOpacity = diskMode ? 0.6 : 0.92;

            var prevProj = projMatrix;
            projMatrix = starProjMatrix;
            viewMatrix[12] = 0;
            viewMatrix[13] = 0;
            viewMatrix[14] = 0;

            drawPoints(dotBuffers, starModel, {
                opacity: lineOpacity * (1.0 - 0.35 * starScatter) * starVis,
                sizeScale: 460,
                pointScale: starScale,
                maxSize: 9,
                minDist: 14,
                disk: diskMode,
                fovTan: STAR_FOV_TAN,
                twinkle: 0.03,
                scatter: starScatter * 0.7
            });
            drawPoints(starBuffers, starModel, {
                opacity: (1.0 - 0.35 * starScatter) * starVis,
                sizeScale: 560,
                pointScale: starScale,
                maxSize: 18,
                minDist: 14,
                disk: diskMode,
                fovTan: STAR_FOV_TAN,
                twinkle: 0.12,
                scatter: starScatter * 0.7
            });

            projMatrix = prevProj;
            viewMatrix[12] = bgTx;
            viewMatrix[13] = bgTy;
            viewMatrix[14] = bgTz;
        }

        // 地球：地轴倾角 × 自转（相位让非洲/欧亚大陆朝向初始视角）
        if (earthBuffers && earthVis > 0.01) {
            rotationZ(earthTilt, CONFIG.tilt);
            rotationY(earthSpin, time * CONFIG.earthSpin - 0.52);
            multiply(earthModel, earthTilt, earthSpin);
            // 云层自转略快于地表，持续缓慢漂移
            rotationY(cloudSpin, time * CONFIG.earthSpin * 1.2 - 0.52);
            multiply(cloudModel, earthTilt, cloudSpin);

            // 大气层跟着整体可见度走，散开阶段更早消失，避免尘埃里还挂着一个光球
            var atmVis = clamp((earthVis - 0.35) / 0.65, 0, 1);
            drawAtmosphere(atmosBuffers, earthTilt, CONFIG.palette.atmosphere, 1.08 * atmVis, pointingRatio);

            drawPoints(earthBuffers, earthModel, {
                opacity: (0.95 - 0.35 * earthScatter) * earthVis, sizeScale: 660, maxSize: 16, minDist: 30,
                highlight: 0.09, shade: true, cull: true, scatter: earthScatter * 0.9
            });

            // 云层：低层厚积云压在地表之上缓慢漂移
            drawPoints(cloudBuffers.dense, cloudModel, {
                opacity: (0.42 + 0.03 * Math.sin(time * 0.35)) * (1.0 - 0.5 * earthScatter) * earthVis,
                sizeScale: 660, maxSize: 19, minDist: 30,
                cull: true, twinkle: 0.07, shade: true, highlight: 0.04,
                scatter: earthScatter * 0.95, diffSpin: cloudDrift
            });
            // 高层薄卷云：更快的差速让上下云带持续错位，云层厚度与层次一览可见
            drawPoints(cloudBuffers.wispy, cloudModel, {
                opacity: (0.24 + 0.04 * Math.sin(time * 0.27 + 1.1)) * (1.0 - 0.5 * earthScatter) * earthVis,
                sizeScale: 640, maxSize: 15, minDist: 30,
                cull: true, twinkle: 0.10, shade: true, highlight: 0.05,
                scatter: earthScatter * 1.0, diffSpin: cloudDrift * 1.45
            });

            // 大洲边界：绘于云层之后，不受粒子层遮挡；外层柔光 + 内核锐线，缩放时都清晰
            var bOp = (0.95 - 0.6 * earthScatter) * earthVis;
            var bSize = 2.2 * clamp(Math.sqrt(CONFIG.defaultDistance / cameraState.radius), 0.72, 1.22);
            drawBoundaries(boundaryBuffers, earthModel, {
                opacity: bOp * 0.36,
                baseSize: bSize * 2.0,
                minDist: 24,
                scatter: earthScatter * 0.9
            });
            drawBoundaries(boundaryBuffers, earthModel, {
                opacity: bOp * 0.9,
                baseSize: bSize,
                minDist: 24,
                scatter: earthScatter * 0.9
            });
        }

        updateStarLabels(dt, ex, ey, ez, starScatter, starVis);

        if (!firstFrameDone) {
            firstFrameDone = true;
            onFirstFrame();
        }
    }

    function onFirstFrame() {
        loadingEl.classList.add('is-hidden');
        setTimeout(function () { loadingEl.style.display = 'none'; }, 380);
        viewSwitchEl.classList.add('is-ready');
        setTimeout(openEntryModal, 260);
    }

    function scheduleResize() {
        if (scheduleResize.pending) return;
        scheduleResize.pending = true;
        requestAnimationFrame(function () {
            scheduleResize.pending = false;
            resize();
        });
    }

    // ==========================================
    // 5. 交互与视图切换
    // ==========================================
    function setInstruction(html) {
        if (instructionEl) instructionEl.innerHTML = html;
    }

    function setControlMode(mode, message) {
        controlMode = mode;
        if (mode === 'mouse') {
            setInstruction(MOUSE_HELP);
            statusEl.style.display = 'none';
            if (message) {
                statusEl.style.display = '';
                statusEl.textContent = message;
                statusEl.style.color = '#ff9b6b';
                setTimeout(function () {
                    if (controlMode === 'mouse') statusEl.style.display = 'none';
                }, 5200);
            }
        } else {
            setInstruction(HAND_HELP);
            statusEl.style.display = '';
            statusEl.textContent = '正在开启妙手控制…';
            statusEl.style.color = '#7c8da3';
        }
    }

    function setViewMode(mode) {
        if (mode !== 'earth' && mode !== 'stars' && mode !== 'both') return;
        if (mode !== viewMode) triggerScatter();
        viewMode = mode;
        var buttons = viewSwitchEl.querySelectorAll('button[data-view]');
        for (var i = 0; i < buttons.length; i++) {
            var on = buttons[i].getAttribute('data-view') === mode;
            buttons[i].classList.toggle('active', on);
            buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false');
        }
    }

    function openEntryModal() {
        if (!modalEl) {
            setControlMode('mouse');
            return;
        }
        stepModeEl.hidden = false;
        stepCameraEl.hidden = true;
        modalEl.hidden = false;
        requestAnimationFrame(function () { modalEl.classList.add('is-open'); });
        // 用户选择进入方式时后台预热手势模型：尽早开始，点“妙手控制”后无需再等下载
        setTimeout(warmupGesture, 300);
    }

    function closeEntryModal() {
        if (!modalEl) return;
        modalEl.classList.remove('is-open');
        setTimeout(function () { modalEl.hidden = true; }, 320);
    }

    function setupUI() {
        viewSwitchEl.addEventListener('click', function (e) {
            var t = e.target;
            while (t && t !== viewSwitchEl && t.tagName !== 'BUTTON') t = t.parentNode;
            if (t && t.tagName === 'BUTTON') setViewMode(t.getAttribute('data-view'));
        });

        document.getElementById('mode-mouse').addEventListener('click', function () {
            setControlMode('mouse');
            closeEntryModal();
        });
        document.getElementById('mode-hand').addEventListener('click', function () {
            stepModeEl.hidden = true;
            stepCameraEl.hidden = false;
        });
        document.getElementById('camera-back').addEventListener('click', function () {
            stepCameraEl.hidden = true;
            stepModeEl.hidden = false;
        });
        document.getElementById('camera-allow').addEventListener('click', function () {
            closeEntryModal();
            setControlMode('hand');
            initGesture();
        });

        setControlMode('mouse');
        setViewMode('both');
    }

    function setupPointer() {
        var pointers = {};
        var lastPinch = 0;

        function pinchDistance() {
            var ids = Object.keys(pointers);
            if (ids.length < 2) return 0;
            var a = pointers[ids[0]], b = pointers[ids[1]];
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        canvas.addEventListener('pointerdown', function (e) {
            pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (canvas.setPointerCapture) {
                try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            }
            lastPinch = pinchDistance();
        });

        canvas.addEventListener('pointermove', function (e) {
            var p = pointers[e.pointerId];
            if (!p) return;
            var dx = e.clientX - p.x;
            var dy = e.clientY - p.y;
            p.x = e.clientX;
            p.y = e.clientY;

            if (Object.keys(pointers).length > 1) {
                var d = pinchDistance();
                if (lastPinch > 0 && d > 0) {
                    cameraState.radius = clamp(cameraState.radius * (lastPinch / d), CONFIG.minDistance, CONFIG.maxDistance);
                    cameraState.zoomVelocity = 0;
                }
                lastPinch = d;
                return;
            }

            cameraState.phi -= dx * 0.0055;
            cameraState.theta = clamp(cameraState.theta - dy * 0.0055, 0.2, Math.PI - 0.2);
        });

        function removePointer(e) {
            delete pointers[e.pointerId];
            lastPinch = pinchDistance();
        }
        canvas.addEventListener('pointerup', removePointer);
        canvas.addEventListener('pointercancel', removePointer);

        canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            var factor = Math.exp(clamp(e.deltaY, -240, 240) * 0.0012);
            cameraState.radius = clamp(cameraState.radius * factor, CONFIG.minDistance, CONFIG.maxDistance);
            cameraState.zoomVelocity = 0;
        }, { passive: false });
    }

    // ==========================================
    // 6. 启动
    // ==========================================
    function boot() {
        resize();
        window.addEventListener('resize', scheduleResize);
        window.addEventListener('orientationchange', scheduleResize);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                lastFrameTime = 0;
                perfAccum = 0;
                perfFrames = 0;
            }
        });
        setupUI();
        setupPointer();
        buildStarLabels();

        decodeMask().then(function (mask) {
            earthBuffers = buildEarth(mask);
            starBuffers = buildConstellationStars();
            dotBuffers = buildConstellationDots();
            bgStarBuffers = buildBgStars(CONFIG.bgStarCount);
            atmosBuffers = createSphere(CONFIG.earthRadius * 1.045, 32, 48);
            cloudBuffers = buildClouds(CONFIG.cloudCount);
            boundaryBuffers = buildBoundaries();
            requestAnimationFrame(render);
        });
    }

    // ==========================================
    // 6. 手势控制（地球就绪后才加载）
    // ==========================================
    var previewCanvas = document.getElementById('webcam-preview');
    var previewCtx = previewCanvas.getContext('2d');
    previewCanvas.width = 160;
    previewCanvas.height = 120;
    var videoElement = document.getElementById('input-video');
    var hands = null;
    var cameraStream = null;
    var previewLoopActive = false;
    var lastLandmarks = null;
    var smoothCache = null;         // 平滑后的 21 个关键点
    var lastHandSeenAt = 0;         // 最近一次检测到手的时间
    var lastPreviewDrawAt = 0;      // 预览帧率限制
    var HAND_SMOOTH = 0.6;          // 关键点平滑系数（越大越跟手）
    var HAND_LOST_GRACE = 350;      // 丢手保持时长(ms)，避免偶发漏检导致状态闪烁

    function createHands() {
        hands = new window.Hands({
            locateFile: function (file) {
                // 运行期读取，脚本回退到 jsDelivr 时模型文件同步换线路
                return (window.__mpHandsBase || HANDS_CDN) + file;
            }
        });
        hands.setOptions({
            maxNumHands: 1,
            // lite 模型体积约为 full 的 1/3，首次加载更快，手势判定精度足够
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);
    }

    var gestureWarming = false;
    var warmHintTimer = 0;
    var warmWatchdog = 0;
    var prefetchPromise = null;

    // 模型资源清单（与 locateFile 同源）：预热时并行下载，避免 Emscripten 逐个串行拉取
    var HANDS_ASSETS = [
        'hands_solution_packed_assets_loader.js',
        'hands_solution_packed_assets.data',
        'hands_solution_simd_wasm_bin.js',
        'hands_solution_simd_wasm_bin.wasm',
        'hands.binarypb',
        'hand_landmark_lite.tflite'
    ];

    // 并行预取到浏览器 HTTP 缓存（镜像 max-age 一年），后续 loader 直接命中缓存
    function prefetchHandsAssets() {
        if (prefetchPromise) return prefetchPromise;
        var base = window.__mpHandsBase || HANDS_CDN;
        prefetchPromise = Promise.all(HANDS_ASSETS.map(function (name) {
            return fetch(base + name, { mode: 'cors', credentials: 'omit' }).then(function (res) {
                if (!res.ok) throw new Error(name);
                // 读完即丢弃，不长期占用内存
                return res.arrayBuffer().then(function () { return true; });
            }).catch(function () {
                return false; // 单个资源失败不阻断，回落到 Emscripten 自行加载
            });
        }));
        return prefetchPromise;
    }

    // 等待 MediaPipe 脚本就绪（脚本用 defer 加载，不阻塞地球首帧）
    function whenLibsReady(timeoutMs) {
        return new Promise(function (resolve, reject) {
            var deadline = performance.now() + (timeoutMs || 10000);
            (function poll() {
                if (window.Hands) return resolve();
                if (performance.now() > deadline) return reject(new Error('mediapipe timeout'));
                setTimeout(poll, 120);
            })();
        });
    }

    // 空闲预热：提前创建实例并跑一次空白推理，触发 wasm/模型初始化。
    // 用户点“妙手控制”时模型已就绪，摄像头一接通即可出结果。
    function warmupGesture() {
        if (hands || gestureInitialized) return;
        // 第一步：不等脚本，立刻并行下载模型文件（下载与脚本加载重叠进行）
        var prefetch = prefetchHandsAssets();
        whenLibsReady(15000).then(function () {
            if (hands || gestureInitialized) return prefetch;
            return prefetch.then(function () {
                if (hands || gestureInitialized) return;
                startWarmup();
            });
        }).catch(function () {
            // 库加载超时：用户点“妙手控制”时 initGesture 会再次等待并提示
        });
    }

    function setWarmupTimers() {
        clearTimeout(warmHintTimer);
        clearTimeout(warmWatchdog);
        warmHintTimer = setTimeout(function () {
            if (gestureWarming) setGestureStatus('手势模型下载较慢，请稍候…', '#ff9b6b');
        }, 6000);
        // 兜底：预热长时间不返回时强制放行，避免界面一直停在“加载中”
        warmWatchdog = setTimeout(function () {
            if (gestureWarming) endWarmup();
        }, 30000);
    }

    function endWarmup() {
        clearTimeout(warmHintTimer);
        clearTimeout(warmWatchdog);
        if (!gestureWarming) return;
        gestureWarming = false;
        if (controlMode === 'hand' && !lastLandmarks) setGestureStatus('等待手势…', '#7c8da3');
    }

    function startWarmup() {
        gestureWarming = true;
        if (!hands) createHands();
        if (controlMode === 'hand' && !lastLandmarks) setGestureStatus('正在加载手势模型…', '#7c8da3');
        setWarmupTimers();
        // 用空白画布跑一次推理，仅用于加载资源，结果由 onResults 忽略
        var c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        c.getContext('2d').fillRect(0, 0, 256, 256);
        hands.send({ image: c }).catch(function () {
        }).then(function () {
            endWarmup();
        });
    }

    // 预览：绘制摄像头画面，并用 MediaPipe 工具库叠加手部骨架
    function drawPreview() {
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        if (videoElement.readyState >= 2) {
            previewCtx.drawImage(videoElement, 0, 0, previewCanvas.width, previewCanvas.height);
        } else {
            previewCtx.fillStyle = '#040a12';
            previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
        }
        if (lastLandmarks && window.drawConnectors && window.drawLandmarks && window.HAND_CONNECTIONS) {
            window.drawConnectors(previewCtx, lastLandmarks, window.HAND_CONNECTIONS, { color: '#5ac8ff', lineWidth: 2 });
            window.drawLandmarks(previewCtx, lastLandmarks, { color: '#ff9b6b', lineWidth: 1, radius: 2 });
        }
        previewCtx.restore();
    }

    // 关键点指数平滑：抑制 MediaPipe 输出的抖动，骨架和旋转都更稳定
    function smoothLandmarks(raw) {
        if (!smoothCache || smoothCache.length !== raw.length) {
            smoothCache = raw.map(function (p) {
                return { x: p.x, y: p.y, z: p.z || 0 };
            });
            return smoothCache;
        }
        for (var i = 0; i < raw.length; i++) {
            var s = smoothCache[i];
            s.x += (raw[i].x - s.x) * HAND_SMOOTH;
            s.y += (raw[i].y - s.y) * HAND_SMOOTH;
            s.z += ((raw[i].z || 0) - s.z) * HAND_SMOOTH;
        }
        return smoothCache;
    }

    // 预览循环：直接画 video 元素，模型未返回时也能看到画面
    function previewLoop() {
        if (!previewLoopActive) return;
        var now = performance.now();
        if (now - lastPreviewDrawAt >= 33) {
            lastPreviewDrawAt = now;
            drawPreview();
        }
        requestAnimationFrame(previewLoop);
    }

    function startPreviewLoop() {
        if (previewLoopActive) return;
        previewCanvas.style.display = 'block';
        previewLoopActive = true;
        lastPreviewDrawAt = 0;
        requestAnimationFrame(previewLoop);
    }

    // 仅在文案/颜色变化时写 DOM，避免每次模型回调都触发布局
    function setGestureStatus(text, color) {
        if (statusEl.textContent !== text) statusEl.textContent = text;
        if (statusEl.style.color !== color) statusEl.style.color = color;
    }

    // 指节索引与距离计算提到回调外，避免每次识别都重复创建
    var FINGER_TIPS = [8, 12, 16, 20];
    var FINGER_MCPS = [5, 9, 13, 17];

    function distSq(p1, p2) {
        var ax = p1.x - p2.x, ay = p1.y - p2.y;
        return ax * ax + ay * ay;
    }

    function onResults(results) {
        if (gestureWarming) return;
        var raw = results.multiHandLandmarks && results.multiHandLandmarks[0];
        var now = performance.now();

        if (raw) {
            // 偶发漏检后重新捕获时重置平滑缓存，避免骨架从旧位置滑过来
            if (now - lastHandSeenAt > HAND_LOST_GRACE) smoothCache = null;
            lastHandSeenAt = now;

            var landmarks = smoothLandmarks(raw);
            lastLandmarks = landmarks;

            var wrist = landmarks[0];
            var middleBase = landmarks[9];
            var dx = middleBase.x - wrist.x;
            var dy = middleBase.y - wrist.y;
            // 用 roll 角（按手掌尺度归一化）代替裸 dx：
            // 手离镜头远近不同时，同样的倾斜能得到相近的旋转力度
            var roll = Math.atan2(dx, Math.abs(dy) + 0.001);
            handRotationTarget = clamp(-roll * 1.7, -1.4, 1.4);

            var foldedCount = 0;

            for (var i = 0; i < 4; i++) {
                var dTip = distSq(landmarks[FINGER_TIPS[i]], wrist);
                var dMcp = distSq(landmarks[FINGER_MCPS[i]], wrist);
                if (dTip < dMcp * 1.2) foldedCount++;
            }

            // 带迟滞的状态机：避免手指计数在阈值附近抖动导致状态/视角反复跳变
            if (foldedCount >= 3) {
                cameraState.isFist = true;
                cameraState.isOpen = false;
            } else if (foldedCount === 0) {
                cameraState.isFist = false;
                cameraState.isOpen = true;
            } else if (cameraState.isFist && foldedCount === 2) {
                cameraState.isOpen = false;
            } else if (cameraState.isOpen && foldedCount === 1) {
                cameraState.isFist = false;
            } else {
                cameraState.isFist = false;
                cameraState.isOpen = false;
            }

            if (cameraState.isFist) {
                setGestureStatus('状态: ✊ 握拳 (拉远)', '#ff9b6b');
            } else if (cameraState.isOpen) {
                setGestureStatus('状态: ✋ 张开 (靠近)', '#4df0b4');
            } else {
                setGestureStatus('状态: 🤞 旋转控制中', '#5ac8ff');
            }
        } else if (now - lastHandSeenAt > HAND_LOST_GRACE) {
            // 短暂漏检时保持上一状态，超过 350ms 才真正判定为“未检测到手”
            smoothCache = null;
            lastLandmarks = null;
            handRotationTarget = 0;
            cameraState.isFist = false;
            cameraState.isOpen = false;
            setGestureStatus('未检测到手', '#7c8da3');
        }
    }

    function cameraErrorText(e) {
        var name = e && e.name;
        if (name === 'NotAllowedError' || name === 'SecurityError') return '摄像头权限被拒绝，已切换为鼠标控制';
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return '没有找到可用摄像头，已切换为鼠标控制';
        if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') return '摄像头被其他程序占用，已切换为鼠标控制';
        if (name === 'OverconstrainedError') return '摄像头不支持所需分辨率，已切换为鼠标控制';
        return '摄像头开启失败，已切换为鼠标控制';
    }

    var frameLoopActive = false;
    var sendBusy = false;
    var lastSendAt = 0;

    // 摄像头帧循环（轻量自实现）：模型就绪后再逐帧送检；
    // 预热或上一帧未返回时跳过，避免 hands.send 并发
    function startFrameLoop() {
        if (frameLoopActive) return;
        frameLoopActive = true;
        lastSendAt = 0;
        requestAnimationFrame(frameLoop);
    }

    function frameLoop() {
        if (!frameLoopActive) return;
        var now = performance.now();
        if (hands && !gestureWarming && !sendBusy && videoElement.readyState >= 2 && now - lastSendAt >= 33) {
            lastSendAt = now;
            sendBusy = true;
            try {
                hands.send({ image: videoElement }).catch(function () {
                }).then(function () {
                    sendBusy = false;
                });
            } catch (e) {
                sendBusy = false;
            }
        }
        requestAnimationFrame(frameLoop);
    }

    function stopCamera() {
        frameLoopActive = false;
        previewLoopActive = false;
        previewCanvas.style.display = 'none';
        if (cameraStream) {
            var tracks = cameraStream.getTracks();
            for (var i = 0; i < tracks.length; i++) {
                try { tracks[i].stop(); } catch (e) { /* 忽略 */ }
            }
            cameraStream = null;
        }
        videoElement.srcObject = null;
    }

    async function initGesture() {
        if (gestureInitialized) return;
        gestureInitialized = true;

        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
            setControlMode('mouse', location.protocol === 'file:'
                ? '本地文件方式打开时浏览器禁用摄像头，请改用 http://localhost 打开本页'
                : '当前浏览器不支持摄像头调用，已切换为鼠标控制');
            return;
        }

        // 第一步先开摄像头：预览画面立刻可见，模型继续在后台下载/初始化
        setGestureStatus('正在请求摄像头…', '#7c8da3');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false
            });
        } catch (e) {
            setControlMode('mouse', cameraErrorText(e));
            return;
        }
        videoElement.srcObject = cameraStream;
        try { await videoElement.play(); } catch (e) { /* 预览循环会在有画面后继续绘制 */ }
        startPreviewLoop();

        // 再等模型脚本与预取；此阶段摄像头画面已经在显示，不会空等
        setGestureStatus('正在加载手势模型…', '#7c8da3');
        try {
            await whenLibsReady(20000);
        } catch (e) {
            stopCamera();
            setControlMode('mouse', '手势模型加载超时，已切换为鼠标控制');
            return;
        }
        // 预取最多等 12s，避免个别资源卡住时一直不出手势
        if (prefetchPromise) {
            await Promise.race([prefetchPromise, new Promise(function (resolve) {
                setTimeout(resolve, 12000);
            })]);
        }

        // 没有预热过就直接创建：真实摄像头帧本身就是最好的热身
        if (!hands) createHands();
        startFrameLoop();
        if (!gestureWarming && !lastLandmarks) setGestureStatus('等待手势…', '#7c8da3');
    }

    boot();
})();
</script>
</body>
</html>
